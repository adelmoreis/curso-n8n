.xb{background:#ff6d5a;color:#fff;border-radius:7px;padding:6px 12px;font-weight:600;font-size:12px}

.addf{border:1px dashed #c9c9d1;border-radius:8px;text-align:center;padding:8px;background:#fff}
.tg{display:flex;align-items:center;gap:9px}

.tg i.on{background:#12b76a}.tg i.on::after{left:20px}
.fx{color:#c4262b;font-family:ui-monospace,Menlo,Consolas,monospace}

.hl{position:relative;z-index:5}
.hl::after{content:"";position:absolute;inset:-6px;border:4px solid #5b4ee8;border-radius:16px;pointer-events:none;animation:rp 1.6s ease-in-out infinite;box-shadow:0 0 0 2px #fff}
.hl.r::after{border-radius:999px}
.hl::before{content:"";position:absolute;left:50%;top:-30px;margin-left:-9px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:15px solid #e8761a;z-index:6;animation:ab 1.2s ease-in-out infinite;filter:drop-shadow(0 0 2px #fff)}
.hl.b::before{top:auto;bottom:-30px;border-top:0;border-bottom:15px solid #e8761a}
.hl.nar::before{display:none}
@keyframes rp{0%,100%{border-width:4px}50%{border-width:6.5px}}
@keyframes ab{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){.hl::after,.hl::before,.pg.on{animation:none}}
.legend .demo .hl,.demo .hl{display:inline-block;padding:8px 18px;background:#ff6d5a;color:#fff;border-radius:8px;font-weight:700}

.hl.nar::before{display:none}
.demo{display:inline-block}

function chapter(id,k,t,sub,obj,secs){var m=misDoCap(id);if(m&&m.num){k='Missão '+m.num;t=m.t;}CH.push({id:id,k:k,t:t,sub:sub,obj:obj,secs:secs,key:m&&m.key||''});}

chapter('c0','Parte 0','Antes de começar','Como usar esta apostila e preparar o seu n8n.',['Entender como esta apostila funciona','Ter um n8n oficial aberto para praticar','Reconhecer as áreas principais da tela'],[
 {id:'oque',t:'O que é o n8n e por que aprender',tut:'O n8n liga os seus aplicativos e faz as tarefas repetidas por você. Pense num assistente que nunca cansa.',
  fala:'O n8n automatiza tarefas ligando aplicativos. Aprender a usá-lo é aprender a fazer o trabalho repetido rodar sozinho.',
  html:(function(){var I=(window.CURSO&&CURSO.intro)||{};var mundos=(window.CURSO?CURSO.sumario:[]).map(function(w){var ms=w.it.filter(function(i){return /^\d/.test(i[1]);});var soon=ms.every(function(i){return !i[0];});return '<tr><td><b>Mundo '+w.n+'</b></td><td>'+esc(w.t)+'</td><td>'+(soon?'<i>em breve</i>':ms.map(function(i){return esc(i[2].split(':')[0]);}).join(', '))+'</td></tr>';}).join('');
   return '<h4>O que é o n8n</h4><p>'+esc(I.oque||'')+'</p><h4>Por que vale aprender</h4><ul>'+(I.vantagens||[]).map(function(v){return '<li>'+esc(v)+'</li>';}).join('')+'</ul><h4>Uma tendência de mercado</h4><p>'+esc(I.tendencia||'')+(I.fonte?' <a href="'+esc(I.fonte.u)+'" target="_blank" rel="noopener">Fonte: '+esc(I.fonte.t)+'</a>':'')+'</p><h4>Como o curso está dividido</h4><div class="tw"><table class="cmp"><tr><th>Mundo</th><th>Tema</th><th>Missões</th></tr>'+mundos+'</table></div><p>'+esc(I.curso||'')+'</p>';})()},
 {id:'usar',t:'Como usar esta apostila',tut:'Pense nesta apostila como uma aula particular que você pode pausar. Leia um trecho, abra o seu n8n ao lado e repita o que viu. Se travar, toque no tutor.',
  fala:'Esta apostila é para você praticar de verdade. Leia um trecho, abra o seu n8n ao lado e faça o mesmo. Os círculos roxos mostram onde clicar.',
  html:'<p>Esta apostila foi feita para quem está começando e quer <b>aprender fazendo</b>. Ela não é um texto para decorar: cada assunto traz uma explicação simples, a tela do n8n com o ponto exato onde clicar e uma pequena tarefa para você repetir no <b>seu próprio n8n</b>.</p>'+say('Leia um trecho, abra o seu n8n ao lado e faça o mesmo. Os círculos roxos mostram onde clicar.')+'<h4>Como estudar</h4><ol><li><b>Leia</b> a explicação do assunto.</li><li><b>Olhe a tela</b> da figura. O círculo roxo com a seta laranja piscando mostra onde clicar.</li><li><b>Pratique</b> no seu n8n com a caixa tracejada "Pratique agora".</li><li>Se ficar com dúvida, toque no <b>tutor</b>, no canto da tela.</li></ol>'+co('tip','Sumário inteligente','<p>O sumário ao lado acompanha a sua leitura: o assunto em que você está fica destacado e os já lidos ficam marcados em verde. Toque em qualquer assunto para ir direto a ele. Se você sair e voltar, use o botão <b>Continuar de onde parei</b>.</p>')+'<table class="cmp"><tr><th>Você vê</th><th>Significa</th></tr><tr><td>Círculo roxo com seta piscando</td><td>Clique aqui na tela do n8n</td></tr><tr><td>Caixa tracejada roxa</td><td>Tarefa para fazer no seu n8n</td></tr><tr><td>Caixa verde</td><td>Dica que economiza tempo</td></tr><tr><td>Caixa laranja</td><td>Atenção: erro comum</td></tr></table>'},
 {id:'preparar',t:'Prepare o seu n8n',tut:'O n8n é como uma cozinha: antes de cozinhar, você precisa ter a cozinha. Você pode "alugar" uma pronta (n8n Cloud) ou montar a sua em casa (instalar).',
  fala:'Antes de praticar, você precisa de um n8n aberto. Pode ser o n8n Cloud, no site oficial, ou uma instalação sua.',
  html:'<p>As telas desta apostila são iguais às do <b>n8n oficial</b>. Por isso, o melhor jeito de aprender é ter o seu n8n aberto em outra aba ou janela enquanto lê. Existem dois caminhos principais:</p><div class="tw"><table class="cmp"><tr><th>Caminho</th><th>Para quem é</th><th>Como começar</th></tr><tr><td><b>n8n Cloud</b></td><td>Quem quer começar hoje, sem instalar nada.</td><td>Crie a sua conta no site oficial <code>n8n.io</code>. A nuvem costuma ter um período de teste, mas as condições mudam. Confira no site.</td></tr><tr><td><b>Instalar por conta própria</b></td><td>Quem tem um computador ou servidor e quer controle total.</td><td>Com o Node.js instalado, o comando <code>npx n8n</code> abre o n8n no seu computador. Também dá para usar Docker. O passo a passo está na documentação oficial.</td></tr></table></div>'+warn('<p>Preços, limites do teste e comandos de instalação podem mudar. Sempre confira a documentação oficial em <b>docs.n8n.io</b> antes de começar.</p>')+doit(['Abra o seu n8n e entre com a sua conta.','Deixe o n8n aberto em outra aba ou ao lado desta apostila.','Se ainda não tem um n8n, crie ou instale agora e volte aqui.'])},
 {id:'tela',t:'Conhecendo a tela do n8n',tut:'A tela inicial do n8n é como a recepção de um escritório: aqui você vê os seus workflows (as receitas) e daqui entra em cada um para editar.',
  fala:'Esta é a tela inicial do n8n. Do lado esquerdo ficam os menus. No meio, a lista dos seus workflows. O botão laranja cria um novo.',
  html:'<p>Quando você entra no n8n, a primeira tela é a <b>lista de workflows</b>. Do lado esquerdo está o menu, no meio estão os seus workflows, e no alto, à direita, fica o botão laranja <b>Create workflow</b>. As abas <b>Workflows</b>, <b>Credentials</b> e <b>Executions</b> separam as receitas, os acessos guardados e o histórico de execuções.</p>'+fig(listScr({hlBtn:1}),'Tela inicial do n8n, na área <b>Personal</b>. O botão laranja cria um workflow novo.','n8n.agente3d.net/home/workflows')+tipsx('<p>O visual do seu n8n pode ter pequenas diferenças (cores, posição de menus), porque o n8n é atualizado com frequência. O que importa é achar os mesmos nomes dos botões.</p>')}
]);

chapter('c1','Parte 1','A ideia central','O que é automação, workflow, gatilho e node.',['Explicar o que é um workflow com as suas palavras','Diferenciar gatilho e node','Entender como os dados andam entre os blocos'],[
 {id:'workflow',t:'Workflow: uma receita que roda sozinha',tut:'Workflow é uma receita de bolo para o computador: uma lista de passos, sempre na mesma ordem. Você escreve a receita uma vez e ela se repete sozinha.',
  fala:'Um workflow é uma receita. Ele começa com um gatilho e passa por nodes, que são os blocos que fazem cada tarefa.',
  html:'<p>Automatizar é ensinar o computador a fazer uma tarefa repetitiva sozinho. No n8n, cada automação se chama <b>workflow</b>: uma sequência de blocos ligados por linhas, que o n8n executa da esquerda para a direita.</p><p>Um exemplo do dia a dia: <i>quando chegar um pedido novo, guarde o nome do cliente, calcule o valor e avise a equipe.</i> Cada parte dessa frase vira um bloco.</p>'+fig(edScr(node(180,170,IC.cur,'Gatilho (trigger)',{ck:1})+wire(256,208,110)+node(366,170,IC.edit,'Edit Fields',{ck:1})+wire(442,208,110)+node(552,170,IC.edit,'Edit Fields1',{ck:1})),'Um workflow com três blocos: um gatilho e dois Edit Fields ligados em sequência.')+say('Gatilho é o que faz a receita começar. Node é um passo que faz uma coisa. Os dados passam de um para o próximo.')+'<div class="gloss"><div><b>Workflow</b><span>A automação inteira, do começo ao fim.</span></div><div><b>Gatilho (trigger)</b><span>O evento que dispara o workflow: um clique, um horário, uma mensagem.</span></div><div><b>Node</b><span>Um bloco que faz uma tarefa: criar campos, buscar dados, enviar mensagem.</span></div><div><b>Execução</b><span>Cada vez que o workflow roda do começo ao fim.</span></div></div>'},
 {id:'dados',t:'Como os dados andam entre os blocos',tut:'Imagine uma esteira de fábrica: cada node pega o que chegou, mexe e coloca de volta na esteira para o próximo.',
  fala:'Cada node recebe dados do node anterior, faz o seu trabalho e entrega o resultado para o próximo.',
  html:'<p>O que passa de um bloco para o outro são <b>dados</b>. Cada node tem três partes importantes: o que <b>entra</b> (Input), o que o node <b>faz</b> (Parameters) e o que <b>sai</b> (Output).</p><div class="fa"><span class="c">Input: o que chegou</span><span>&#10142;</span><span class="c">Parameters: o que o node faz</span><span>&#10142;</span><span class="c ok">Output: o resultado</span></div><p>Os dados chegam em <b>itens</b>, e cada item tem <b>campos</b> (nome, telefone, valor...). Pense em cada item como uma <b>ficha de cadastro</b> e em cada campo como uma linha da ficha.</p>'+co('tip','Regra de ouro','<p>Se o resultado não saiu como esperado, olhe sempre o <b>Input</b> e o <b>Output</b> do node. A maioria dos erros se resolve ali.</p>')}
]);

chapter('c2','Missão 1.1','Seu primeiro workflow','Gatilho e Edit Fields, do zero ao primeiro resultado.',['Criar um workflow e escolher um gatilho','Adicionar e abrir o node Edit Fields','Criar um campo e ler o resultado em Schema, Table e JSON'],[
 {id:'criar',t:'Criar o workflow',tut:'Criar o workflow é pegar uma folha em branco. Ainda não tem nada na folha, mas ela já existe e tem um nome.',
  fala:'Clique no botão laranja Create workflow. No editor, vamos montar tudo.',
  html:'<p>Na lista de workflows, clique em <b>Create workflow</b>. O n8n abre o <b>editor</b>: a tela em que você monta o workflow, arrastando e ligando blocos. No começo, ele está vazio e mostra só um quadrado com o sinal de +.</p>'+fig(listScr({hlBtn:1}),'Passo 1: clique em Create workflow.','n8n.agente3d.net/home/workflows')+fig(edScr('<div class="n-first">'+H('','<div class="bx">+</div>')+'<span class="t">Add first step…</span></div>'),'Passo 2: o editor vazio. Clique em Add first step para escolher o primeiro passo.','n8n.agente3d.net/workflow/novo')+say('Este é o editor, a tela onde você monta os workflows. Clique no quadrado com o mais.')+doit(['Clique em <b>Create workflow</b>.','Dê um nome ao workflow, se quiser (por exemplo, "Meu primeiro workflow").','Veja o editor vazio e o quadrado <b>Add first step</b>.'])},
 {id:'gatilho',t:'Escolher o gatilho',tut:'O gatilho é o botão de ligar. Sem ele, a receita não começa. "Trigger manually" é um botão que você mesmo aperta.',
  fala:'Todo workflow começa por um gatilho. Escolha Trigger manually: ele roda quando você clica em um botão.',
  html:'<p>Todo workflow precisa de um <b>gatilho</b>, o evento que o faz começar. Existem muitos tipos: um horário marcado, uma mensagem que chega, um formulário enviado. Para treinar, vamos usar o mais simples: o <b>Trigger manually</b>, que roda quando <i>você</i> clica em um botão.</p>'+fig(panelScr('What triggers this workflow?','Um gatilho é o evento que inicia o workflow.',[[P.cur,'Trigger manually','Roda quando você clica em um botão'],[P.web,'On webhook call','Roda quando outro sistema chama um endereço'],[P.clock,'On a schedule','Roda em dias e horários marcados']],0),'Na lista de gatilhos, escolha <b>Trigger manually</b>.','n8n.agente3d.net/workflow/novo')+'<h4>Gatilhos mais comuns</h4><table class="cmp"><tr><th>Gatilho</th><th>Quando dispara</th><th>Exemplo</th></tr><tr><td>Trigger manually</td><td>Quando você clica</td><td>Testar o workflow</td></tr><tr><td>On a schedule</td><td>Em dias e horas marcados</td><td>Relatório toda segunda, às 8h</td></tr><tr><td>On webhook call</td><td>Quando outro sistema chama um endereço</td><td>Formulário do site enviado</td></tr></table>'+doit(['Clique em <b>Add first step</b>.','Escolha <b>Trigger manually</b>.','Confira se o bloco do gatilho apareceu no editor.'])},
 {id:'editfields',t:'Adicionar o node Edit Fields',tut:'O Edit Fields é o caderno de anotações do workflow: é nele que você escreve ou corrige as informações que vão seguir adiante.',
  fala:'Agora vamos ligar o próximo passo. Clique no mais ao lado do gatilho e escolha Edit Fields.',
  html:'<p>Com o gatilho no editor, aparece um <b>+</b> ao lado dele. Clicar ali abre a lista de nodes que você pode ligar em seguida. Escolha <b>Edit Fields (Set)</b>, um dos nodes mais usados do n8n: ele <b>cria ou muda campos</b> nos dados.</p>'+fig(edScr(node(330,170,IC.cur,'When clicking ‘Execute workflow’')+plus(410,196,1)),'Passo 1: clique no + ao lado do gatilho.')+fig(panelScr('What happens next?','Escolha o próximo passo do workflow.',[[P.edit,'Edit Fields (Set)','Cria ou muda campos nos seus dados'],[P.web,'HTTP Request','Busca ou envia dados na internet'],[P.clock,'Wait','Espera um tempo antes de continuar']],0,node(330,170,IC.cur,'When clicking ‘Execute workflow’')),'Passo 2: escolha <b>Edit Fields (Set)</b>.')+'<div class="card"></div>'.replace('<div class="card"></div>','')+'<h4>Para que serve na prática</h4><ul>'+FICHAS.edit.ex.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul><div class="fa"><span class="c">'+esc(FICHAS.edit.a)+'</span><span>&#10142;</span><span class="c ok">'+esc(FICHAS.edit.b)+'</span></div>'+doit(['Clique no <b>+</b> ao lado do gatilho.','Escolha <b>Edit Fields (Set)</b>.','Veja os dois blocos ligados por uma linha.'])},
 {id:'abrir',t:'Abrir o node: Input, Parameters e Output',tut:'Abrir o node é como abrir a porta de uma máquina: à esquerda entra a matéria-prima, no meio ficam os botões, à direita sai o produto pronto.',
  fala:'Dê dois cliques rápidos no Edit Fields. Por dentro, à esquerda está o Input, no meio os Parameters e à direita o Output.',
  html:'<p>Para configurar um node, dê <b>dois cliques rápidos</b> nele. A tela se divide em três áreas, e entender cada uma é a chave para tudo no n8n:</p>'+fig(edScr(node(250,170,IC.cur,'When clicking ‘Execute workflow’')+wire(326,208,100)+node(426,170,IC.edit,'Edit Fields',{hl:1})),'Dê dois cliques rápidos no Edit Fields.')+fig(nodeScr({i:{empty:1,hlBtn:1},m:{},o:{empty:1}}),'O node aberto. O Input está vazio porque o gatilho ainda não rodou. Clique em <b>Execute previous nodes</b>.')+'<table class="cmp"><tr><th>Área</th><th>O que é</th><th>Analogia</th></tr><tr><td><b>Input</b> (esquerda)</td><td>Os dados que chegaram do node anterior.</td><td>A matéria-prima</td></tr><tr><td><b>Parameters</b> (meio)</td><td>O que o node vai fazer. Aqui você configura.</td><td>Os botões da máquina</td></tr><tr><td><b>Output</b> (direita)</td><td>O resultado depois que o node roda.</td><td>O produto pronto</td></tr></table>'+say('O Input está vazio. Clique em Execute previous nodes para o gatilho rodar.')+doit(['Dê dois cliques no <b>Edit Fields</b>.','Identifique as três áreas: Input, Parameters e Output.','Clique em <b>Execute previous nodes</b>.'])},
 {id:'campo',t:'Criar o campo "nome" com o valor Maria',tut:'Um campo é uma linha de uma ficha: tem um nome ("nome") e um valor ("Maria"). Você está preenchendo a primeira linha da ficha.',
  fala:'Clique em Add Field. No quadro do nome escreva nome, e no quadro do valor escreva Maria. Depois clique em Execute step.',
  html:'<p>O gatilho mandou um <b>item vazio</b>: uma ficha sem nenhuma linha preenchida. Agora você vai dizer ao Edit Fields o que escrever nela. Clique em <b>Add Field</b> e preencha:</p><ul><li><b>Nome do campo:</b> <code>nome</code></li><li><b>Valor:</b> <code>Maria</code></li></ul>'+fig(nodeScr({i:{body:'<div class="js">{}</div><p style="margin:8px 0 0;color:#6b6b76">O gatilho mandou 1 item vazio.</p>'},m:{fields:[['nome','Maria','String']],hlField:0,hlEx:0},o:{empty:1}}),'O campo <code>nome</code> com o valor <code>Maria</code>. Depois, clique em <b>Execute step</b>.')+warn('<p>O <b>nome</b> do campo e o <b>valor</b> ficam em quadros diferentes. Escrever Maria no quadro do nome é um engano comum.</p>')+doit(['Clique em <b>Add Field</b>.','Escreva <code>nome</code> no quadro do nome e <code>Maria</code> no quadro do valor.','Clique em <b>Execute step</b>.'])},
 {id:'resultado',t:'Ler o resultado: Schema, Table e JSON',tut:'É a mesma ficha vista de três jeitos: como lista (Schema), como tabela (Table) e como o computador guarda por dentro (JSON).',
  fala:'Funcionou! O Output mostra o campo nome com o valor Maria. O mesmo dado pode ser visto em Schema, Table ou JSON.',
  html:'<p>Depois de executar, o <b>Output</b> mostra o resultado. O dado é um só, mas o n8n deixa você ver de três jeitos, nas abas do Output:</p><ul><li><b>Schema:</b> uma lista com o nome e o tipo de cada campo.</li><li><b>Table:</b> uma tabela, parecida com uma planilha.</li><li><b>JSON:</b> o formato em que o n8n guarda o dado por dentro. Você vai usar muito nas próximas missões.</li></ul>'+fig(nodeScr({i:{body:'<div class="js">{}</div>'},m:{fields:[['nome','Maria','String']]},o:{ok:1,tab:'t',hl:1,body:tbl(['nome'],['Maria'])}}),'O resultado no Output, na aba Table.')+fig(nodeScr({i:{body:'<div class="js">{}</div>'},m:{fields:[['nome','Maria','String']]},o:{ok:1,tab:'j',hl:1,body:js('{\n  '+jl('nome','Maria')+'\n}')}}),'O mesmo resultado, agora na aba JSON.')+say('É sempre a mesma informação. Só muda como ela aparece.')+doit(['Clique em <b>Table</b>, depois em <b>JSON</b>, depois em <b>Schema</b>.','Confirme que o campo <code>nome</code> aparece com o valor <code>Maria</code> nos três.'])},
 {id:'rec11',t:'Recapitulando a Missão 1.1',tut:'Você montou uma mini receita: gatilho, node, campo e resultado. É a base de todo workflow, inclusive os grandes.',
  fala:'Missão 1.1 cumprida. Agora você sabe onde fica o Input, o Output e como ver os dados de três jeitos.',
  html:'<ul><li>Um <b>workflow</b> começa por um <b>gatilho</b>.</li><li>Os <b>nodes</b> ligados recebem dados, fazem uma tarefa e passam o resultado adiante.</li><li>O <b>Edit Fields</b> cria ou muda campos.</li><li>Dentro do node: <b>Input</b> (entra), <b>Parameters</b> (configura) e <b>Output</b> (sai).</li><li>O mesmo dado aparece em <b>Schema</b>, <b>Table</b> e <b>JSON</b>.</li></ul>'+co('do','Desafio extra','<p>Crie mais um campo no mesmo Edit Fields: nome <code>cidade</code> e valor <code>Salvador</code>. Execute e veja os dois campos no Output.</p>')}
]);

chapter('c3','Missão 1.2','O Monstro do JSON','Ler dados de dentro de caixas e listas com expressões.',['Entender o que é JSON: chaves e valores','Escrever expressões para buscar um dado','Entrar em caixas (objetos) e listas'],[
 {id:'json',t:'O que é JSON',tut:'JSON é uma ficha de cadastro escrita de um jeito que o computador entende: cada informação tem um nome (a chave) e um conteúdo (o valor).',
  fala:'JSON não é um monstro. É uma ficha com nomes e valores. Chaves entre aspas, dois pontos e o valor.',
  html:co('tip','Ligando com a Missão 1.1',' Na 1.1 você aprendeu a abrir um node e olhar o <b>Input</b> e o <b>Output</b>. Agora vamos entender os dados que aparecem ali. ')+'<p>Quase todo dado que passa pelo n8n está em <b>JSON</b>. Ele parece complicado, mas é só uma ficha: cada informação tem um <b>nome</b>, chamado de <b>chave</b>, e um <b>valor</b>. Veja a ficha de um cliente que chegou ao segundo Edit Fields:</p>'+fig(nodeScr({title:'Edit Fields1',i:{hlIn:1,body:'<div class="js">'+CLIENTE_JSON+'</div>'},m:{},o:{empty:1}}),'No Input, a ficha de um cliente em JSON.')+'<table class="cmp"><tr><th>Símbolo</th><th>O que significa</th><th>Exemplo</th></tr><tr><td><code>"nome"</code></td><td>chave: o nome do dado</td><td><code>"telefone"</code></td></tr><tr><td><code>"Carla Dias"</code></td><td>valor de texto, entre aspas</td><td><code>"capacete"</code></td></tr><tr><td><code>{ }</code></td><td>uma <b>caixa</b> com outros dados dentro</td><td><code>"moto": { ... }</code></td></tr><tr><td><code>[ ]</code></td><td>uma <b>lista</b> de itens</td><td><code>"extras": [ ... ]</code></td></tr></table>'+say('Repare que moto é uma caixa com outros dados dentro, e extras é uma lista.')},
 {id:'expr',t:'Expressões: buscar um dado do node anterior',tut:'Uma expressão é um bilhete que diz "pegue o telefone da ficha que chegou". O n8n lê o bilhete e troca pelo valor real.',
  fala:'Para buscar um dado do node anterior, você escreve uma expressão entre chaves duplas. Por exemplo, cifrão json ponto telefone.',
  html:'<p>Em vez de digitar o telefone na mão, você pede ao n8n: <i>pegue o telefone que chegou</i>. Isso se escreve com uma <b>expressão</b>, um trecho entre chaves duplas:</p><p style="text-align:center;font-size:22px"><code>{{ $json.telefone }}</code></p><ul><li><code>{{ }}</code> avisa ao n8n: "isto é uma expressão".</li><li><code>$json</code> é a ficha que chegou do node anterior.</li><li><code>.telefone</code> é a chave que você quer ler.</li></ul>'+fig(nodeScr({title:'Edit Fields1',i:{body:'<div class="js">'+CLIENTE_JSON+'</div>'},m:{fields:[['telefone','{{ $json.telefone }}','String']],hlField:0},o:{ok:1,tab:'t',body:tbl(['telefone'],['11 99999-1234'])}}),'Desafio 1: o campo <code>telefone</code> com a expressão. O Output mostra o telefone real.')+warn('<p>Escreva a chave <b>exatamente</b> como aparece no Input: letras minúsculas e maiúsculas fazem diferença. <code>Telefone</code> não é o mesmo que <code>telefone</code>.</p>')+doit(['No segundo Edit Fields, clique em <b>Execute previous nodes</b> para chegar a ficha.','Add Field com nome <code>telefone</code> e valor <code>{{ $json.telefone }}</code>.','Execute step e confira o telefone no Output.'])},
 {id:'caixa',t:'Dados dentro de uma caixa',tut:'Uma caixa dentro da ficha é como uma gaveta: para pegar o que está dentro, você diz o nome da gaveta e depois o nome do objeto.',
  fala:'O modelo está dentro da caixa moto. Para entrar na caixa, use um ponto: cifrão json ponto moto ponto modelo.',
  html:'<p>Nem todo dado fica solto na ficha. O <b>modelo da moto</b> está dentro da caixa <code>moto</code>. Para entrar na caixa, você usa um <b>ponto</b>, de fora para dentro:</p><p style="text-align:center;font-size:22px"><code>{{ $json.moto.modelo }}</code></p><p>Leia assim: <i>do que chegou, pegue a moto e, dela, o modelo.</i></p>'+fig(nodeScr({title:'Edit Fields1',i:{body:'<div class="js">'+CLIENTE_JSON+'</div>'},m:{fields:[['telefone','{{ $json.telefone }}','String'],['modelo','{{ $json.moto.modelo }}','String']],hlField:1},o:{ok:1,tab:'t',body:tbl(['telefone','modelo'],['11 99999-1234','Elétrica X1'])}}),'Desafio 2: o campo <code>modelo</code> lendo de dentro da caixa <code>moto</code>.')+tipsx('<p>Caixa dentro de caixa? Continue colocando pontos: <code>{{ $json.cliente.endereco.cidade }}</code>.</p>')+doit(['Add Field com nome <code>modelo</code>.','Valor: <code>{{ $json.moto.modelo }}</code>.','Execute step e confira <b>Elétrica X1</b>.'])},
 {id:'lista',t:'Listas: o primeiro item é o número 0',tut:'Em uma fila, o primeiro da fila é o "número 0" para o computador. Por isso o primeiro item é [0], o segundo é [1] e assim por diante.',
  fala:'Em listas, a contagem começa do zero. O primeiro item é o número zero, o segundo é o número um.',
  html:'<p>Uma <b>lista</b> guarda vários itens do mesmo tipo, entre colchetes. O campo <code>extras</code> tem dois acessórios: <code>"capacete"</code> e <code>"baú"</code>. Para escolher um, use o <b>número da posição</b> entre colchetes. E atenção: <b>a contagem começa do zero</b>.</p><table class="cmp"><tr><th>Quero</th><th>Escrevo</th><th>Resultado</th></tr><tr><td>1º item</td><td><code>{{ $json.extras[0] }}</code></td><td>capacete</td></tr><tr><td>2º item</td><td><code>{{ $json.extras[1] }}</code></td><td>baú</td></tr></table>'+fig(nodeScr({title:'Edit Fields1',i:{body:'<div class="js">'+CLIENTE_JSON+'</div>'},m:{fields:[['telefone','{{ $json.telefone }}','String'],['modelo','{{ $json.moto.modelo }}','String'],['acessorio','{{ $json.extras[0] }}','String']],hlField:2},o:{ok:1,tab:'t',body:tbl(['telefone','modelo','acessorio'],['11 99999-1234','Elétrica X1','capacete'])}}),'Desafio 3: o campo <code>acessorio</code> lendo o primeiro item da lista <code>extras</code>.')+warn('<p>O erro mais comum com listas é usar <code>[1]</code> achando que é o primeiro. O primeiro é sempre <code>[0]</code>.</p>')+doit(['Add Field com nome <code>acessorio</code>.','Valor: <code>{{ $json.extras[0] }}</code>.','Execute step e confira <b>capacete</b>. Troque para <code>[1]</code> e veja <b>baú</b>.'])},
 {id:'rec12',t:'Recapitulando a Missão 1.2',tut:'Resumo da gaveta: ponto entra na caixa, colchete escolhe o item da lista. Tudo entre chaves duplas.',
  fala:'Missão 1.2 cumprida. O JSON não é mais um monstro: é só uma ficha com nomes e valores.',
  html:'<table class="cmp"><tr><th>Quero</th><th>Escrevo</th></tr><tr><td>um campo simples</td><td><code>{{ $json.telefone }}</code></td></tr><tr><td>algo dentro de uma caixa</td><td><code>{{ $json.moto.modelo }}</code></td></tr><tr><td>o 1º item de uma lista</td><td><code>{{ $json.extras[0] }}</code></td></tr></table>'+co('tip','Se deu erro','<p>Confira, nesta ordem: 1) a chave existe no Input? 2) está com as letras iguais? 3) você usou ponto para caixas e colchetes para listas?</p>')}
]);

chapter('c4','Missão 1.3','Pedido novo','Tipos de dado e como não perder informação pelo caminho.',['Reconhecer String, Number e Boolean','Converter texto em número e em verdadeiro/falso','Manter os outros dados com Include Other Input Fields'],[
 {id:'tipos',t:'Tipos de dado: texto, número e verdadeiro/falso',tut:'O computador só soma números de verdade. "1500" entre aspas é como o desenho de um número: parece, mas não soma. Por isso existem os tipos.',
  fala:'Todo campo tem um tipo. String é texto, Number é número e Boolean é verdadeiro ou falso.',
  html:co('tip','Ligando com a Missão 1.2',' Na 1.2 você leu dados dentro do JSON. Agora vem a pergunta: de que <b>tipo</b> é cada dado, texto, número ou verdadeiro/falso? ')+'<p>'+esc(FICHAS.tipos.what)+' '+esc(FICHAS.tipos.why)+'</p>'+fig(nodeScr({title:'Edit Fields1',i:{body:PED_IN+'<p style="margin:10px 0 0;color:#6b6b76">Repare: valor e pago chegaram como <b>texto</b> (T).</p>'},m:{},o:{empty:1}}),'Chegou um pedido novo. No Input, a letra <b>T</b> mostra que valor e pago vieram como texto.')+'<div class="tw"><table class="cmp"><tr><th>Tipo</th><th>Para que serve</th><th>Exemplo</th><th>No JSON</th></tr><tr><td><b>String</b></td><td>Texto, nomes, telefones</td><td>Maria</td><td><code>"Maria"</code></td></tr><tr><td><b>Number</b></td><td>Valores que você soma ou compara</td><td>1500</td><td><code>1500</code></td></tr><tr><td><b>Boolean</b></td><td>Sim ou não, verdadeiro ou falso</td><td>pago</td><td><code>true</code></td></tr></table></div><ul>'+FICHAS.tipos.ex.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>'},
 {id:'number',t:'Guardar o valor como número',tut:'Você está trocando a etiqueta do campo de "texto" para "número". O valor é o mesmo, mas agora o n8n deixa somar e comparar.',
  fala:'No campo valor, use a expressão e troque o tipo de String para Number. No Output, o mil e quinhentos aparece sem aspas.',
  html:'<p>Para converter o <b>valor</b> em número, crie o campo com a expressão <code>{{ $json.valor }}</code> e troque o tipo, ao lado do nome, de <b>String</b> para <b>Number</b>. Compare no Output (aba JSON): o número aparece <b>sem aspas</b>.</p>'+fig(nodeScr({title:'Edit Fields1',i:{body:PED_IN},m:{fields:[['valor','{{ $json.valor }}','Number']],hlField:0},o:{ok:1,tab:'j',body:js('{\n  '+jl('valor','1500',1)+'\n}')}}),'Desafio 1: <code>valor</code> com tipo Number. Repare que o 1500 está sem aspas.')+tipsx('<p>Regra prática: <b>com aspas é texto, sem aspas é número ou verdadeiro/falso</b>.</p>')+doit(['Add Field com nome <code>valor</code> e valor <code>{{ $json.valor }}</code>.','Troque o tipo de <b>String</b> para <b>Number</b>.','Execute step e veja o 1500 sem aspas na aba JSON.'])},
 {id:'boolean',t:'Guardar "pago" como verdadeiro ou falso',tut:'Boolean é um interruptor: só tem dois estados, ligado (true) ou desligado (false). Perfeito para "pago?", "ativo?", "entregue?".',
  fala:'Agora o campo pago, com a expressão e o tipo Boolean. No JSON, true e false também aparecem sem aspas.',
  html:'<p>O campo <b>pago</b> só pode ser verdadeiro ou falso. Crie-o com <code>{{ $json.pago }}</code> e o tipo <b>Boolean</b>. No JSON, <code>true</code> e <code>false</code> aparecem <b>sem aspas</b>, igual a números.</p>'+fig(nodeScr({title:'Edit Fields1',i:{body:PED_IN},m:{fields:[['valor','{{ $json.valor }}','Number'],['pago','{{ $json.pago }}','Boolean']],hlField:1},o:{ok:1,tab:'j',body:js('{\n  '+jl('valor','1500',1)+',\n  '+jl('pago','true',1)+'\n}')}}),'Desafio 2: <code>pago</code> com tipo Boolean.')+doit(['Add Field com nome <code>pago</code> e valor <code>{{ $json.pago }}</code>.','Troque o tipo para <b>Boolean</b>.','Execute step e confira <code>true</code> sem aspas.'])},
 {id:'include',t:'Não perder o cliente: Include Other Input Fields',tut:'Por padrão o Edit Fields devolve só o que você criou, como um caderno novo. Ligar a chave é pedir para copiar também o que já estava na ficha.',
  fala:'O node só devolve os campos que você criou, então o cliente sumiu. Ligue Include Other Input Fields para manter os outros dados.',
  html:'<p>Repare no Output da etapa anterior: o <b>cliente</b> sumiu. Isso acontece porque o Edit Fields devolve <b>apenas os campos que você criou</b>. Para manter o resto da ficha, ligue a chave <b>Include Other Input Fields</b> e execute de novo.</p>'+fig(nodeScr({title:'Edit Fields1',i:{body:PED_IN},m:{fields:[['valor','{{ $json.valor }}','Number'],['pago','{{ $json.pago }}','Boolean']],inc:1,hlTg:1},o:{ok:1,tab:'j',body:js('{\n  '+jl('cliente','Carla Dias')+',\n  '+jl('valor','1500',1)+',\n  '+jl('pago','true',1)+'\n}')}}),'Desafio 3: com a chave ligada, o <code>cliente</code> volta no Output.')+warn('<p>Depois de mudar a chave, <b>execute o node de novo</b>. O Output só atualiza quando você clica em Execute step.</p>')+doit(['Ligue <b>Include Other Input Fields</b>.','Clique em <b>Execute step</b>.','Confira que o <code>cliente</code> voltou, com <code>valor</code> como número e <code>pago</code> como true.'])},
 {id:'rec13',t:'Recapitulando a Missão 1.3',tut:'Três ideias: tipo certo para cada dado, aspas só em texto e a chave para não perder o resto da ficha.',
  fala:'Missão 1.3 cumprida. Você já sabe tratar tipos. Agora vem o treino do Mundo 1.',
  html:'<ul><li>Todo campo tem um <b>tipo</b>: String, Number ou Boolean.</li><li>Para somar ou comparar, o valor precisa ser <b>Number</b>.</li><li>No JSON, só <b>texto</b> vem entre aspas.</li><li><b>Include Other Input Fields</b> mantém o resto dos dados.</li></ul>'+co('do','Desafio final do Mundo 1','<p>No seu n8n, monte do zero um workflow com gatilho + dois Edit Fields: o primeiro cria <code>nome</code> e <code>telefone</code>; o segundo converte <code>valor</code> em Number e <code>pago</code> em Boolean, mantendo os outros campos. Se funcionar, você concluiu o Mundo 1.</p>')}
]);

function quizHtml(){
  return '<div class="qz" id="qz">'+QP.map(function(q,qi){
    var r=(qi*3+1)%4,ord=[0,1,2,3].map(function(i){return (i+r)%4;}),c=ord.indexOf(q.c);
    return '<div class="q" data-c="'+c+'"><h4>'+(qi+1)+'. '+esc(q.q)+'</h4>'+ord.map(function(oi,i){return '<button type="button" class="qo" data-i="'+i+'"><b>'+'ABCD'.charAt(i)+'</b><span>'+esc(q.o[oi])+'</span></button>';}).join('')+'<p class="qe"><b>Resposta:</b> '+esc(q.e)+'</p></div>';}).join('')+'</div><p class="score" id="score" aria-live="polite"></p>';
}

function flow(arr,hl){var h='',x=60;arr.forEach(function(n,i){h+=(n==='Webhook'&&window.CURSO?node(x,170,CURSO.icones.hook,n,{hl:hl===i,cls:'hk',lbl:'POST'}):node(x,170,n==='HTTP Request'?IC.globe:n==='If'?IC.branch:(i===0?IC.cur:IC.edit),n,{hl:hl===i}));if(i<arr.length-1)h+=wire(x+76,208,100);x+=176;});return edScr(h,(arr[0]==='Webhook')?'Mundo 2 · Pedidos':'');}
var PEDIDO2='{\n  <span class="k">"body"</span>: {\n    '+jl('cliente','Carla Dias')+',\n    '+jl('cep','40010000')+',\n    '+jl('valor','1500',1)+',\n    <span class="k">"pago"</span>: <span class="n">true</span>,\n    '+jl('pagamento','pix')+'\n  }\n}';
chapter('c7','Missão 2.1','Webhooks: o pedido chega sozinho','Receber um pedido de fora do n8n, sem apertar nenhum botão.',['Explicar o que é um Webhook e para que serve','Configurar HTTP Method e Path','Usar Listen for test event e ler o pedido dentro de body'],[
 {id:'webhook',t:'O que é um Webhook',tut:'Webhook é a campainha da sua casa: quando alguém aperta, o n8n atende. Você não precisa ficar olhando a porta o tempo todo.',
  fala:'Webhook é uma porta de entrada. Quando um site ou sistema envia um pedido para o endereço dele, o workflow começa sozinho.',
  html:'<p>Até agora o workflow começava quando <i>você</i> clicava em um botão. No dia a dia isso não serve: o pedido de um cliente pode chegar de madrugada. O <b>Webhook</b> resolve isso. Ele é um gatilho que <b>espera um aviso de fora</b>, como o site da loja, e começa o workflow assim que o aviso chega.</p>'+say('Webhook é a campainha da casa. Quando alguém aperta, o n8n atende e o workflow começa.')+fig(flow(['Webhook','Edit Fields','Edit Fields1'],0),'O Webhook toma o lugar do Trigger manually, no começo do workflow.')+co('tip','Exemplo do dia a dia','<p>O cliente fecha um pedido no site. O site envia os dados do pedido para o endereço do seu Webhook, e o n8n já começa a tratar tudo.</p>')},
 {id:'config',t:'Configurar: HTTP Method e Path',tut:'O Method é a forma de bater na porta (POST é entregar um pacote). O Path é o número da casa: precisa ser igual dos dois lados.',
  fala:'No Webhook, troque o HTTP Method para POST e escreva pedido no Path. O site envia com POST para o final pedido.',
  html:'<p>Dê dois cliques no Webhook. Dois campos importam:</p><div class="tw"><table class="cmp"><tr><th>Campo</th><th>O que é</th><th>O que escrever</th></tr><tr><td><b>HTTP Method</b></td><td>A forma como o site envia o pedido. Quem <b>entrega</b> dados usa POST.</td><td><code>POST</code></td></tr><tr><td><b>Path</b></td><td>O final do endereço. Funciona como o número da casa.</td><td><code>pedido</code></td></tr></table></div><p>O n8n mostra a <b>Test URL</b> e a <b>Production URL</b>. A <b>Test URL</b> só funciona enquanto você está testando. A <b>Production URL</b> vale quando o workflow está ativo.</p>'+warn('<p>O Method e o Path precisam ser <b>iguais nos dois lados</b>: no Webhook e no sistema que envia. Se um deles estiver diferente, o n8n responde <b>404</b>, que quer dizer "não encontrei esse endereço".</p>')},
 {id:'listen',t:'Escutar e receber o pedido',tut:'Listen for test event é abrir a porta e ficar de ouvido. Se o pedido chegar antes de você abrir, ninguém atende.',
  fala:'Clique em Listen for test event e só depois envie o pedido de teste. Assim o n8n está escutando quando ele chegar.',
  html:'<ol><li>No Webhook, clique em <b>Listen for test event</b>. O n8n fica esperando.</li><li>No sistema que envia (no curso, o cartão do site), clique em <b>Enviar pedido de teste</b>.</li><li>O pedido chega e aparece no <b>Output</b> do Webhook.</li></ol>'+warn('<p>Se você enviar o pedido <b>antes</b> de clicar em Listen for test event, o n8n responde 404. É só clicar em Listen e enviar de novo. Mudou o Method ou o Path? O n8n para de escutar, então clique em Listen outra vez.</p>')},
 {id:'body',t:'Ler o pedido: tudo está dentro de body',tut:'O Output do Webhook vem com várias gavetas. O pedido do cliente está na gaveta body, então tudo começa com $json.body.',
  fala:'O pedido chegou, mas está dentro da caixa body. Para pegar o cliente, escreva cifrão json ponto body ponto cliente.',
  html:'<p>O Output do Webhook traz quatro grupos: <code>headers</code>, <code>params</code>, <code>query</code> e <code>body</code>. Os dados do pedido ficam em <b>body</b>:</p><pre class="js">'+PEDIDO2+'</pre><p>Por isso, para buscar o nome do cliente nos próximos nodes, você usa a caixa <code>body</code> (lembra da Missão 1.2?):</p><div class="tw"><table class="cmp"><tr><th>Quero</th><th>Escrevo</th></tr><tr><td>o cliente</td><td><code>{{ $json.body.cliente }}</code></td></tr><tr><td>o valor</td><td><code>{{ $json.body.valor }}</code></td></tr><tr><td>se foi pago</td><td><code>{{ $json.body.pago }}</code></td></tr></table></div>'},
 {id:'rec21',t:'Recapitulando a Missão 2.1',tut:'Campainha (Webhook), forma de bater (POST), número da casa (Path) e o pacote dentro de body.',
  fala:'Missão 2.1 cumprida. O pedido agora chega sozinho e você sabe onde achar cada dado dele.',
  html:'<ul><li>O <b>Webhook</b> espera um aviso de fora e começa o workflow sozinho.</li><li><b>HTTP Method</b> e <b>Path</b> precisam combinar com quem envia.</li><li>Clique em <b>Listen for test event</b> antes de enviar o pedido de teste.</li><li>Os dados do pedido ficam em <b>body</b>: <code>{{ $json.body.cliente }}</code>.</li></ul>'+co('do','Desafio extra','<p>No seu n8n, crie um Webhook com POST e o Path <code>pedido</code>. Escute o evento e, com o terminal ou um site de testes, envie um pedido. Confira se o cliente aparece dentro de body.</p>')}
]);

chapter('c8','Missão 2.2','HTTP Request e Merge','Buscar dados na internet e juntar de volta ao pedido.',['Explicar o que é uma API e o HTTP Request','Montar uma URL com expressão','Juntar o pedido e o endereço com o Merge'],[
 {id:'http',t:'O que é o HTTP Request',tut:'É como o n8n abrir o navegador sozinho: vai até um endereço da internet, pega a resposta e traz para dentro do workflow.',
  fala:'O HTTP Request faz o n8n acessar um endereço da internet e trazer a resposta. Aqui vamos buscar o endereço de um CEP.',
  html:co('tip','Ligando com a Missão 2.1',' Na 2.1 o pedido de Carla Dias chegou pelo Webhook, com o CEP dentro de <code>body</code>. Agora vamos usar esse CEP. ')+'<p>Muitos serviços entregam informações por um endereço na internet, chamado de <b>API</b>. O <b>HTTP Request</b> é o node que acessa esse endereço e traz a resposta. No curso, o pedido de Carla Dias trouxe só o <b>CEP</b>. Vamos pedir ao <b>ViaCEP</b>, um serviço gratuito dos Correios, o endereço completo.</p>'+fig(flow(['Webhook','HTTP Request'],1),'Depois do Webhook, ligue o HTTP Request com o +.')+co('tip','Para guardar','<p>HTTP Request serve para <b>qualquer</b> serviço com API: buscar um CEP, consultar um preço, enviar um aviso. Aprendendo com o ViaCEP, você aprende o jeito de todos.</p>')},
 {id:'url',t:'Method GET e a URL com expressão',tut:'GET é "me traga a informação". A URL tem um pedaço fixo e um pedaço que o n8n troca pelo CEP do pedido.',
  fala:'Method GET. Na URL escreva https://viacep.com.br/ws/ e a expressão do CEP, depois barra json barra.',
  html:'<p>Configure o HTTP Request assim:</p><div class="tw"><table class="cmp"><tr><th>Campo</th><th>O que escrever</th></tr><tr><td><b>Method</b></td><td><code>GET</code> (o ViaCEP só responde ao GET)</td></tr><tr><td><b>URL</b></td><td><code>https://viacep.com.br/ws/{{ $json.body.cep }}/json/</code></td></tr><tr><td><b>Authentication</b></td><td><code>None</code> (o ViaCEP é aberto)</td></tr></table></div><p>O pedaço entre chaves duplas é uma <b>expressão</b>: o n8n troca pelo CEP que veio no pedido, que está dentro de <code>body</code>. Com o CEP <code>40010000</code>, o endereço final vira <code>https://viacep.com.br/ws/40010000/json/</code>.</p>'},
 {id:'resp',t:'Ler a resposta',tut:'O ViaCEP devolve uma ficha de endereço. Cada informação tem nome e valor, igual ao JSON que você já conhece.',
  fala:'Clique em Execute step. A resposta traz logradouro, bairro, localidade e uf, o endereço do cliente.',
  html:'<p>Clique em <b>Execute step</b>. O Output traz a ficha do endereço, como esta (os valores variam conforme o CEP):</p><pre class="js">{\n  '+jl('cep','40010-000')+',\n  '+jl('logradouro','Rua de Exemplo')+',\n  '+jl('bairro','Comércio')+',\n  '+jl('localidade','Salvador')+',\n  '+jl('uf','BA')+'\n}</pre><p>Nos próximos nodes você pega a cidade com <code>{{ $json.localidade }}</code>.</p>'},
 {id:'erros22',t:'Deu erro? Os três mais comuns',tut:'Erro de HTTP é bilhete de resposta. Leia o número e a frase: eles dizem quase sempre o que está errado.',
  fala:'Se der erro, leia a mensagem. Endereço que não existe, método errado e barra json faltando são os mais comuns.',
  html:'<div class="tw"><table class="cmp"><tr><th>A mensagem diz</th><th>O que significa</th><th>Como corrigir</th></tr><tr><td><code>ENOTFOUND</code></td><td>O endereço não existe.</td><td>Confira se escreveu <code>viacep.com.br</code> certinho.</td></tr><tr><td><code>405 Method Not Allowed</code></td><td>O serviço não aceita esse método.</td><td>Troque o Method para <code>GET</code>.</td></tr><tr><td><code>400 Bad Request</code></td><td>O caminho está incompleto.</td><td>O endereço precisa terminar com <code>/json/</code>.</td></tr></table></div>'+tipsx('<p>Mudou a URL e o Output continua com o resultado antigo? Clique em <b>Execute step</b> de novo.</p>')},
 {id:'merge',t:'Merge: o pedido sumiu, como juntar de volta',tut:'Merge é um funil: duas fichas entram, uma ficha sai. Position junta a primeira de um lado com a primeira do outro.',
  fala:'O HTTP Request trouxe só o endereço e o pedido ficou para trás. O Merge junta os dois: troque o Mode para Combine e o Combine By para Position.',
  html:'<p>Olhe o Output do HTTP Request: veio <b>só o endereço</b>. O pedido de Carla Dias, com o cliente, o valor e o pago, <b>ficou para trás</b>. Isso acontece sempre com o HTTP Request: ele devolve apenas a resposta do serviço.</p><p>Para ter tudo em uma ficha só, ligue o <b>Merge</b> com duas entradas: uma vem direto do <b>Webhook</b> (o pedido) e a outra vem do <b>HTTP Request</b> (o endereço).</p><div class="tw"><table class="cmp"><tr><th>Campo</th><th>O que escolher</th><th>Por quê</th></tr><tr><td><b>Mode</b></td><td><code>Combine</code></td><td>Append só coloca uma ficha depois da outra. Combine junta as duas.</td></tr><tr><td><b>Combine By</b></td><td><code>Position</code></td><td>Matching Fields exige um campo com o mesmo valor nos dois lados. O <code>cep</code> do pedido (40010000) não é igual ao do ViaCEP (40010-000), então nada casa.</td></tr></table></div><p>No Output sai <b>uma ficha</b> com o pedido e o endereço juntos.</p>'+co('tip','Para guardar',' Sempre que um node trouxer dados novos e você quiser manter o que já tinha, o Merge junta os dois. ')},
 {id:'rec22',t:'Recapitulando a Missão 2.2',tut:'Endereço fixo + expressão com o CEP, método GET, Execute step e Merge para juntar com o pedido.',
  fala:'Missão 2.2 cumprida. Você buscou um dado na internet e juntou com o pedido.',
  html:'<ul><li><b>HTTP Request</b> acessa um endereço (API) e traz a resposta.</li><li>A <b>URL</b> pode misturar texto fixo com uma <b>expressão</b>.</li><li>Use <b>GET</b> para buscar dados.</li><li>Erro? Leia o número: <b>ENOTFOUND</b>, <b>405</b> e <b>400</b> são os mais comuns.</li><li>O HTTP Request devolve só a resposta. Use o <b>Merge</b> (Combine + Position) para juntar com o pedido.</li></ul>'}
]);

chapter('c9','Missão 2.3','If e Switch','Decidir o caminho do pedido: sim ou não, e vários caminhos.',['Usar o If para uma pergunta de sim ou não','Usar o Switch quando há mais de dois caminhos','Escolher entre If e Switch'],[
 {id:'if',t:'If: o pedido foi pago?',tut:'O If é um guarda de trânsito com duas saídas: se a resposta for sim, o pedido segue por True; se for não, por False.',
  fala:'O If faz uma pergunta de sim ou não. Value 1 recebe cifrão json ponto body ponto pago, e o operador é is true.',
  html:'<p>Lembra do <b>Boolean</b> da Missão 1.3, o tipo que só vale true ou false? O pedido tem um: o <code>pago</code>. Depois que o pedido chega pelo Webhook, é hora de <b>decidir</b>. O <b>If</b> faz uma pergunta de sim ou não e manda o pedido por um de dois caminhos: <b>True</b> ou <b>False</b>.</p>'+fig(flow(['Webhook','If'],1),'O If abre dois caminhos: True e False.')+'<div class="tw"><table class="cmp"><tr><th>Campo</th><th>O que escrever</th></tr><tr><td><b>Value 1</b></td><td><code>{{ $json.body.pago }}</code></td></tr><tr><td><b>Operator</b></td><td><code>is true</code> (dentro de Boolean)</td></tr></table></div><p>Clique em <b>Execute step</b>: o pedido de Carla foi pago, então sai por <b>True</b>.</p>'+warn('<p>Escreva a expressão <b>com as chaves duplas</b> <code>{{ }}</code> e só ela. Um ponto ou texto solto no Value 1 não busca nada.</p>')},
 {id:'switch',t:'Switch: vários caminhos',tut:'O Switch é um porteiro com várias portas: cada regra leva a uma saída, e o Fallback é a porta para quem não se encaixou em nenhuma.',
  fala:'Quando existem mais de dois caminhos, use o Switch. Regra 1 é pix, regra 2 é cartao, e o resto cai no Fallback.',
  html:'<p>E se o pedido pode ser pago por <b>pix</b>, <b>cartão</b> ou <b>boleto</b>? Com dois caminhos o If basta. Com mais, use o <b>Switch</b>: cada <b>regra</b> leva a uma saída.</p><div class="tw"><table class="cmp"><tr><th>Regra</th><th>Value 1</th><th>Value 2</th><th>Sai por</th></tr><tr><td>1</td><td><code>{{ $json.body.pagamento }}</code></td><td><code>pix</code></td><td>Output 0</td></tr><tr><td>2</td><td><code>{{ $json.body.pagamento }}</code></td><td><code>cartao</code> (sem acento)</td><td>Output 1</td></tr><tr><td>nenhuma</td><td colspan="2">boleto, por exemplo</td><td>Fallback</td></tr></table></div><p>O pedido de Carla é pix, então sai pelo <b>Output 0</b>. Teste também com um pedido de boleto para ver o <b>Fallback</b> em ação.</p>'},
 {id:'rec23',t:'Recapitulando a Missão 2.3',tut:'If: sim ou não. Switch: várias portas.',
  fala:'Missão 2.3 cumprida. Você decide o caminho de cada pedido.',
  html:'<ul><li><b>If</b>: pergunta de sim ou não, com saídas True e False.</li><li><b>Switch</b>: várias regras, uma saída para cada, e o Fallback para o que sobrar.</li></ul>'}
]);

chapter('c10','Projeto do Mundo 2','Pedido, CEP e decisão','Juntar tudo em um fluxo completo, e na trilha do negócio, escrever o plano da sua automação.',['Montar sozinho: Webhook, Edit Fields, If e HTTP Request','Escrever o plano da automação do seu negócio','Ter à mão a cola do Mundo 2'],[
 {id:'projeto',t:'O projeto: Webhook, Edit Fields, If e HTTP Request',tut:'Você já fez cada peça separado. Agora é montar a esteira inteira: o pedido chega, é organizado, é decidido e, se estiver pago, o endereço é buscado.',
  fala:'Projeto do Mundo 2. Ligue o Webhook, o Edit Fields para acertar os tipos, o If que decide se o pedido foi pago e, no caminho True, o HTTP Request com o CEP.',
  html:'<p>Agora você monta tudo em um só workflow, sem ajuda passo a passo. Dessa vez o site manda o <code>pago</code> e o <code>valor</code> como <b>texto</b>, igual ao pedido novo da Missão 1.3. Por isso o Edit Fields vem antes de qualquer decisão:</p>'+fig(flow(['Webhook','Edit Fields','If','HTTP Request'],-1),'O fluxo completo do projeto. O HTTP Request fica no caminho True do If.')+'<ol><li><b>Webhook</b> (POST, Path <code>pedido</code>) recebe o pedido de Carla Dias.</li><li><b>Edit Fields</b> organiza o pedido: campo <code>pago</code> com <code>{{ $json.body.pago }}</code> e tipo <i>Boolean</i>; campo <code>valor</code> com <code>{{ $json.body.valor }}</code> e tipo <i>Number</i>; e a chave <i>Include Other Input Fields</i> ligada, para o cliente e o CEP não sumirem (Missão 1.3).</li><li><b>If</b> pergunta se foi pago: <code>{{ $json.pago }}</code> <i>is true</i>. Repare que o caminho ficou mais curto, porque o Edit Fields já tirou o <code>pago</code> de dentro de <code>body</code>.</li><li><b>HTTP Request</b>, ligado na saída <b>True</b>, busca o endereço pelo CEP: <code>https://viacep.com.br/ws/{{ $json.body.cep }}/json/</code>. Só o pedido pago chega até aqui.</li></ol>'+co('tip','Por que o HTTP Request fica depois do If?',' O HTTP Request devolve só a resposta do ViaCEP: o pedido original some da frente. Se ele viesse antes do If, o <code>pago</code> não estaria mais lá para ser perguntado. Decidir primeiro e buscar depois evita o problema, e ainda poupa uma consulta para o pedido que não vai seguir. ')+'<p>Se tudo estiver certo, o pedido sai por <b>True</b>, o endereço aparece e você conclui o projeto, ganhando <b>250 XP</b>.</p>'},
 {id:'plano',t:'Trilha do negócio: o plano da sua automação',tut:'O plano é o roteiro da automação que você vai montar de verdade. Escreva em poucas palavras, do seu jeito.',
  fala:'Quem escolheu automatizar o próprio negócio escreve agora o plano da sua automação, com cinco campos.',
  html:'<p>Se você escolheu a trilha <b>automatizar o meu negócio</b>, ao fim do projeto o simulador pede o plano da sua automação. São cinco campos, e os exemplos abaixo são de uma loja:</p><div class="tw"><table class="cmp"><tr><th>Campo</th><th>O que responder</th><th>Exemplo</th></tr><tr><td><b>Nome da automação</b></td><td>Um nome curto.</td><td>Pedido novo da loja</td></tr><tr><td><b>O que dispara</b></td><td>O evento que inicia tudo.</td><td>Um pedido chega pelo site</td></tr><tr><td><b>Que dado ela busca</b></td><td>A informação que falta.</td><td>O endereço pelo CEP</td></tr><tr><td><b>Que decisão ela toma</b></td><td>A pergunta de sim ou não.</td><td>Só separa o pedido se estiver pago</td></tr><tr><td><b>O que acontece em cada caminho</b></td><td>O que sai por True e por False.</td><td>Pago vai para a entrega; não pago recebe um aviso</td></tr></table></div>'+tipsx('<p>Guarde o plano. No Mundo 4 (Agentes de IA e projeto final) você monta uma automação completa no n8n, e este plano é o seu ponto de partida. Dá para voltar e editar quando quiser.</p>')},
 {id:'resumo2',t:'O que você aprendeu nos Mundos 1 e 2',tut:'É o mesmo resumo que o simulador mostra ao passar no quiz do Mundo 2.',
  fala:'Este é o resumo de tudo o que você aprendeu nos Mundos 1 e 2.',
  html:(function(){var R=(window.CURSO&&CURSO.resumo2)||null;if(!R)return '';return '<p>'+esc(R.abre)+'</p>'+R.mundos.map(function(m){return '<h4>Mundo '+m.n+' &middot; '+esc(m.t)+'</h4><div class="tw"><table class="cmp"><tr><th>Missão</th><th>O que ficou</th></tr>'+m.it.map(function(x){return '<tr><td><b>'+esc(x[0])+'</b></td><td>'+esc(x[1])+'</td></tr>';}).join('')+'</table></div>';}).join('')+'<h4>O fio que liga tudo</h4><p>'+esc(R.fio)+'</p><h4>Erros que você já sabe ler</h4><p>'+esc(R.erros)+'</p><h4>O que vem agora</h4><p>'+esc(R.proximo)+'</p>';})()},
 {id:'cola2',t:'Cola do Mundo 2',tut:'Imprima ou salve: é o resumo das quatro missões.',
  fala:'Esta é a cola do Mundo 2, com o essencial de cada node.',
  html:'<div class="tw"><table class="cmp"><tr><th>Quero</th><th>Faço</th></tr><tr><td>Receber um pedido de fora</td><td>Webhook: Method <code>POST</code>, Path <code>pedido</code>, Listen for test event</td></tr><tr><td>Pegar um dado do pedido</td><td><code>{{ $json.body.cliente }}</code></td></tr><tr><td>Buscar dados na internet</td><td>HTTP Request: GET + URL, com expressão se precisar</td></tr><tr><td>Decidir entre sim e não</td><td>If: <code>{{ $json.body.pago }}</code> is true</td></tr><tr><td>Decidir entre vários caminhos</td><td>Switch: uma regra por saída + Fallback</td></tr><tr><td>Juntar duas fichas</td><td>Merge: Combine + Position</td></tr><tr><td>Acertar o tipo de um dado que chegou como texto</td><td>Edit Fields: campo novo com o tipo Boolean ou Number + Include Other Input Fields ligado</td></tr><tr><td>Buscar dados só do pedido pago</td><td>If antes, HTTP Request ligado na saída True</td></tr></table></div><h4>Palavras novas</h4><div class="gloss">'+[['Webhook','Gatilho que espera um aviso de fora e começa o workflow.'],['API','Endereço na internet que entrega informações.'],['HTTP Request','Node que acessa uma API e traz a resposta.'],['GET e POST','GET busca dados. POST envia dados.'],['Path','O final do endereço do Webhook.'],['True e False','As duas saídas do If: sim e não.'],['Fallback','A saída do Switch para o que não bateu com nenhuma regra.'],['Merge','Node que junta duas entradas em uma.']].map(function(g){return '<div><b>'+g[0]+'</b><span>'+g[1]+'</span></div>';}).join('')+'</div><p>Para treinar com perguntas e ganhar o certificado, faça o quiz do Mundo 2 no simulador do curso.</p>'}
]);

IC.split='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 12h4M10 12h4M15 12h4M5 17h4M10 17h4M15 17h4"/></svg>';

function icn(n){return n==='Webhook'?CURSO.icones.hook:n==='HTTP Request'?IC.globe:n==='Telegram'?IC.send:n==='Split Out'?IC.split:n==='Loop Over Items'?IC.loop:n==='Wait'?IC.clock:(n==='Execute Workflow'||n.indexOf('When Executed')===0)?IC.exwf:IC.edit;}
function ptag(x,y,t){return '<div style="position:absolute;left:'+x+'px;top:'+y+'px;font-size:12px;background:#fff;border:1px solid #d9d9de;border-radius:6px;padding:2px 8px;color:#6b6b78">'+t+'</div>';}
function flow3(arr,hl,wf,tags){var h='',st=arr.length>4?150:176,x=40;arr.forEach(function(n,i){h+=node(x,170,icn(n),n,n==='Webhook'?{hl:hl===i,cls:'hk',lbl:'POST'}:{hl:hl===i});if(i<arr.length-1)h+=wire(x+76,208,st-76);x+=st;});(tags||[]).forEach(function(t){h+=ptag(t[0],t[1],t[2]);});return edScr(h,wf);}
var WF31='Mundo 3 · Pedido com erro',WF32='Mundo 3 · Vários pedidos';
chapter('c11','Missão 3.1','Erros e alertas','Fazer o fluxo avisar quando algo falha, em vez de parar no escuro.',['Explicar o que acontece quando um node dá erro','Usar On Error: Continue (using error output)','Ligar um alerta no Telegram com o nome do cliente e o motivo do erro'],[
 {id:'erro',t:'Quando o fluxo quebra',tut:'Nenhum workflow acerta sempre. O que importa é saber o que acontece quando algo dá errado.',
  fala:'Missão 3.1. Quando um node dá erro, por padrão o workflow para ali, e ninguém fica sabendo.',
  html:'<p>Na Missão 2.2 você viu erros do HTTP Request, como o 400 e o 405, e corrigiu cada um na hora. Mas, no dia a dia, o erro aparece <b>quando você não está olhando</b>. Imagine que o site mandou o pedido de <b>Bruno Lima</b> com o CEP <code>1234</code>, faltando números. O HTTP Request tenta buscar o endereço e recebe <b>400 - Bad Request</b>.</p><p>Por padrão, o n8n <b>para o workflow inteiro</b> naquele node e marca ele de vermelho. O pedido de Bruno fica parado, e <b>ninguém é avisado</b>.</p>'+say('Um erro que ninguém vê é o pior erro. A missão de hoje é fazer o erro aparecer para quem precisa.')+warn('<p>O ajuste que decide isso fica na aba <b>Settings</b> do node, no campo <b>On Error</b>. O padrão é <b>Stop Workflow</b>.</p>')},
 {id:'onerr',t:'On Error: a saída Error',tut:'Com Continue (using error output), o item que falhou sai por uma saída só dos erros, e o resto do fluxo continua.',
  fala:'Abra o HTTP Request, entre em Settings e, em On Error, escolha Continue using error output.',
  html:'<p>Abra o <b>HTTP Request</b>, clique na aba <b>Settings</b> e olhe o campo <b>On Error</b>. Ele tem três opções:</p><div class="tw"><table class="cmp"><tr><th>Opção</th><th>O que faz</th><th>Quando usar</th></tr><tr><td><b>Stop Workflow</b></td><td>Para tudo no node que falhou.</td><td>É o padrão. Bom quando o erro precisa travar mesmo.</td></tr><tr><td><b>Continue</b></td><td>Ignora o erro e segue como se nada tivesse acontecido.</td><td>Quase nunca: o erro some e ninguém sabe.</td></tr><tr><td><b>Continue (using error output)</b></td><td>Manda o item com problema por uma saída <b>Error</b>, separada.</td><td>O que queremos: dá para ligar um aviso nessa saída.</td></tr></table></div><p>Escolha <b>Continue (using error output)</b> e clique em <b>Execute step</b> de novo. O node agora tem duas saídas, <b>Success</b> e <b>Error</b>, e o pedido de Bruno sai pela <b>Error</b>, com um campo novo, o <code>error</code>, que carrega a mensagem do problema.</p>'+warn('<p>Cuidado com o <b>Continue</b> simples: ele esconde o erro. O pedido segue como se estivesse tudo certo. O certo é sempre a opção que tem a saída <b>Error</b>.</p>')+tipsx('<p>No seu n8n, olhe a aba <b>Output</b> do node: o campo <code>error</code> pode vir com mais detalhes do que o simulador mostra. O uso é o mesmo.</p>')},
 {id:'alerta',t:'O alerta: Telegram na saída Error',tut:'Ligue um node de mensagem na saída Error. Quando um pedido falhar, a equipe recebe o aviso na hora.',
  fala:'Na saída Error, ligue o Telegram. Chat ID 123456789 e um Text com o nome do cliente e o campo error.',
  html:'<p>Agora o erro tem para onde ir. Falta alguém ser avisado. Clique no <b>+</b> da saída <b>Error</b> e ligue o node <b>Telegram</b> (<i>Send a text message</i>). Pode ser e-mail, Slack ou WhatsApp, a ideia é a mesma.</p>'+fig(flow3(['Webhook','HTTP Request','Telegram'],2,WF31,[[322,140,'Error']]),'O pedido com erro sai pela saída Error e vira um aviso para a equipe.')+'<div class="tw"><table class="cmp"><tr><th>Campo</th><th>O que escrever</th></tr><tr><td><b>Chat ID</b></td><td><code>123456789</code> (o grupo da equipe; no seu n8n vem do seu bot do Telegram)</td></tr><tr><td><b>Text</b></td><td><code>Problema no pedido de {{ $json.body.cliente }}: {{ $json.error }}</code></td></tr></table></div><p>Lembra das expressões da Missão 1.2? O <code>{{ $json.body.cliente }}</code> traz o nome de quem fez o pedido, e o <code>{{ $json.error }}</code> traz o motivo. Assim a equipe já sabe o que olhar. Clique em <b>Execute step</b> e a mensagem sai.</p>'+tipsx('<p>A senha do bot não fica escrita no workflow. Ela mora em <b>Credentials</b>, separada e protegida, e o node só aponta para ela.</p>')},
 {id:'errtrigger',t:'Quando o erro é do workflow inteiro',tut:'A saída Error cuida de um node. O Error Trigger cuida do workflow todo.',
  fala:'Para erros do workflow inteiro, existe o Error Trigger, um workflow separado que dispara quando outro falha.',
  html:'<p>A saída <b>Error</b> protege <b>um node</b>. Para ter uma rede de segurança do workflow <b>inteiro</b>, o n8n tem outro caminho:</p><ul><li><b>Error Trigger</b>: um gatilho para um workflow separado, o <i>workflow de erro</i>. Ele dispara sempre que outro workflow falhar, e pode mandar um alerta geral.</li><li><b>Error Workflow</b>: nas configurações do workflow principal, você escolhe qual workflow de erro vai atender ele.</li><li><b>Stop and Error</b>: um node para <b>falhar de propósito</b>, quando algo está errado do ponto de vista do negócio (por exemplo, pedido sem valor), mesmo que nenhum node tenha quebrado.</li></ul><p>Regra prática: erro previsto em um passo, use a saída Error. Falha geral, use o Error Trigger.</p>'},
 {id:'rec31',t:'Recapitulando a Missão 3.1',tut:'Erro sem aviso é erro escondido.',
  fala:'Missão 3.1 cumprida. Seu workflow agora avisa quando falha.',
  html:'<ul><li><b>Stop Workflow</b> é o padrão: o fluxo para e ninguém sabe.</li><li><b>On Error: Continue (using error output)</b> separa o item com problema em uma saída <b>Error</b>.</li><li>Na saída Error, ligue um alerta com <code>{{ $json.body.cliente }}</code> e <code>{{ $json.error }}</code>.</li><li>Para falhas do workflow inteiro, use o <b>Error Trigger</b>.</li></ul>'}
]);
chapter('c12','Missão 3.2','Loop Over Items','Tratar vários pedidos de uma vez, um por vez, no ritmo certo.',['Separar uma lista em itens com o Split Out','Processar um lote por rodada com o Loop Over Items','Fazer uma pausa entre as rodadas com o Wait'],[
 {id:'lista',t:'Vários pedidos: o Split Out',tut:'A loja mandou três pedidos de uma vez, dentro de uma lista. O Split Out transforma a lista em itens separados.',
  fala:'Missão 3.2. Os pedidos chegaram numa lista dentro de body. O Split Out separa em um item por pedido.',
  html:'<p>Nas missões anteriores chegava <b>um pedido por vez</b>. Hoje a loja mandou <b>três de uma vez</b>, em uma lista dentro do <code>body</code>: <code>body.pedidos</code>. Para o n8n, isso ainda é <b>1 item</b>, com uma lista dentro (lembra da contagem que começa do 0, da Missão 1.2?).</p><p>Para tratar cada pedido, precisamos de um item para cada um. É o trabalho do <b>Split Out</b>.</p><div class="tw"><table class="cmp"><tr><th>Campo</th><th>O que escrever</th></tr><tr><td><b>Fields To Split Out</b></td><td><code>body.pedidos</code> (só o caminho, sem <code>{{ }}</code>)</td></tr></table></div><p>Clique em <b>Execute step</b>: de <b>1 item</b> com uma lista, saem <b>3 itens</b>, um por pedido, cada um com <code>cliente</code> e <code>cep</code>. Repare que o <code>cep</code> agora está direto no item, sem <code>body</code>.</p>'+fig(flow3(['Webhook','Split Out'],1,WF32),'O Split Out transforma a lista de pedidos em itens soltos.')+warn('<p>Neste campo vai <b>só o caminho</b>, sem as chaves duplas. Escrever <code>{{ $json.body.pedidos }}</code> aqui dá erro.</p>')},
 {id:'loop',t:'Loop Over Items: um pedido por vez',tut:'O Loop entrega os itens em lotes e repete os passos ligados nele, uma rodada para cada lote.',
  fala:'O Loop Over Items entrega um lote por rodada. Tudo o que está ligado na saída Loop se repete para cada lote.',
  html:'<p>Agora temos 3 pedidos soltos. Se o HTTP Request buscar os 3 CEPs ao mesmo tempo, o ViaCEP pode bloquear por excesso de pedidos. Imagine 300 pedidos: pior ainda. O <b>Loop Over Items</b> entrega os pedidos <b>em lotes</b> e repete os passos para cada lote.</p><div class="tw"><table class="cmp"><tr><th>Campo</th><th>O que escrever</th></tr><tr><td><b>Batch Size</b></td><td><code>1</code> (um pedido por rodada)</td></tr></table></div><p>O node tem <b>duas saídas</b>:</p><ul><li><b>Loop</b>: entrega o lote da vez. Tudo o que você ligar aqui <b>se repete</b> a cada rodada.</li><li><b>Done</b>: só entrega os itens quando todas as rodadas acabarem.</li></ul><p>Ligue o <b>HTTP Request</b> na saída <b>Loop</b>, com a URL <code>https://viacep.com.br/ws/{{ $json.cep }}/json/</code>. Repare: é <code>$json.cep</code>, e não <code>$json.body.cep</code>, porque o Split Out já tirou o pedido de dentro do <code>body</code>.</p>'+warn('<p>Se você trocar o Batch Size para um número maior, mais pedidos entram em cada rodada. Para ir devagar e com segurança, o lote é <code>1</code>.</p>')},
 {id:'wait',t:'Wait: a pausa entre as rodadas',tut:'Uma pausa curta entre as rodadas evita estourar o limite de pedidos de uma API.',
  fala:'O Wait faz uma pausa. Wait Amount 1 e Wait Unit Seconds. Depois a seta volta ao Loop.',
  html:'<p>Para o ViaCEP não achar que estamos atacando ele, colocamos uma <b>pausa</b> entre uma rodada e outra, com o node <b>Wait</b>:</p><div class="tw"><table class="cmp"><tr><th>Campo</th><th>O que escrever</th></tr><tr><td><b>Resume</b></td><td><code>After Time Interval</code></td></tr><tr><td><b>Wait Amount</b></td><td><code>1</code></td></tr><tr><td><b>Wait Unit</b></td><td><code>Seconds</code></td></tr></table></div>'+fig(flow3(['Webhook','Split Out','Loop Over Items','HTTP Request','Wait'],2,WF32,[[470,118,'seta de volta: o Wait volta ao Loop']]),'O Wait devolve o pedido ao Loop (a seta de volta), que entrega o próximo.')+'<p>A <b>seta que volta</b> do Wait para o Loop é o que pede o próximo lote. Sem ela, o fluxo rodaria uma vez e pararia. Clique em <b>Execute workflow</b>: o Loop entrega um pedido por vez, o HTTP Request busca o endereço, o Wait espera 1 segundo, e no fim os <b>3 itens</b> saem pela saída <b>Done</b>.</p>'+tipsx('<p>Pausa de 1 <b>segundo</b>, não de 1 minuto: com 300 pedidos, 1 minuto de pausa seria uma espera de cinco horas.</p>')},
 {id:'rec32',t:'Recapitulando a Missão 3.2',tut:'Lista vira itens, itens viram rodadas, rodadas têm pausa.',
  fala:'Missão 3.2 cumprida. Você trata vários pedidos no ritmo certo.',
  html:'<ul><li><b>Split Out</b>: transforma a lista <code>body.pedidos</code> em um item por pedido.</li><li><b>Loop Over Items</b>: Batch Size 1; a saída <b>Loop</b> repete os passos, a saída <b>Done</b> entrega tudo no fim.</li><li><b>Wait</b>: 1 segundo entre as rodadas, com a seta de volta ao Loop.</li></ul>'}
]);
chapter('c13','Missão 3.3','Sub-workflows','Guardar a busca de CEP em um workflow separado e chamar quando precisar.',['Criar um sub-workflow com o gatilho When Executed by Another Workflow','Chamar o sub-workflow com o Execute Workflow','Ter à mão o resumo e a cola do Mundo 3'],[
 {id:'sub',t:'Criar o sub-workflow Buscar CEP',tut:'Um sub-workflow é um workflow que outro workflow chama, como uma peça que se reaproveita.',
  fala:'Missão 3.3. Vamos criar o workflow Buscar CEP, que começa com o gatilho When Executed by Another Workflow.',
  html:'<p>A busca de CEP é um pedaço que <b>outros workflows também vão querer</b>: o de cadastro, o de entrega, o de nota. Em vez de copiar os mesmos nodes em todo lugar, você cria uma peça <b>uma vez</b> e chama quando precisar. Essa peça é um <b>sub-workflow</b>.</p><p>Crie um workflow novo chamado <b>Buscar CEP</b>. Ele começa com o gatilho <b>When Executed by Another Workflow</b>, que <b>espera ser chamado</b> por outro workflow, como a campainha que só toca quando alguém aperta (lembra do Webhook, da Missão 2.1?).</p>'+fig(flow3(['When Executed by Another Workflow','HTTP Request'],1,'Buscar CEP'),'O sub-workflow Buscar CEP: um gatilho e o HTTP Request.')+'<p>Ligue o <b>HTTP Request</b> com a URL <code>https://viacep.com.br/ws/{{ $json.cep }}/json/</code>. O <code>cep</code> chega direto, porque o workflow principal vai mandar só ele.</p>'},
 {id:'exec',t:'Chamar com o Execute Workflow',tut:'No workflow principal, o HTTP Request vira uma chamada ao sub-workflow.',
  fala:'No workflow principal, troque o HTTP Request pelo Execute Workflow e escolha Buscar CEP.',
  html:'<p>De volta ao workflow principal (o do Loop), o HTTP Request <b>vira uma chamada</b>. Na saída <b>Loop</b>, ligue o <b>Execute Workflow</b>:</p><div class="tw"><table class="cmp"><tr><th>Campo</th><th>O que escolher</th></tr><tr><td><b>Source</b></td><td><code>Database</code></td></tr><tr><td><b>Workflow</b></td><td><code>Buscar CEP</code></td></tr><tr><td><b>Wait For Sub-Workflow Completion</b></td><td>ligado, para receber o endereço de volta</td></tr></table></div>'+fig(flow3(['Webhook','Split Out','Loop Over Items','Execute Workflow','Wait'],3,'Mundo 3 · Pedidos em lote'),'O Execute Workflow chama o Buscar CEP e traz o endereço de volta.')+'<p>O pedido vai para o sub-workflow, o endereço volta, o Wait espera 1 segundo e o Loop entrega o próximo. O resultado é igual ao da Missão 3.2, mas agora a busca de CEP <b>mora em um lugar só</b>: se o endereço da API mudar, você corrige uma vez.</p>'+warn('<p>O workflow só aparece na lista do Execute Workflow se ele <b>já existir</b>. Por isso criamos o Buscar CEP primeiro.</p>')},
 {id:'cola3',t:'Cola do Mundo 3',tut:'Imprima ou salve: é o resumo das três missões.',
  fala:'Esta é a cola do Mundo 3, com o essencial de cada node.',
  html:'<div class="tw"><table class="cmp"><tr><th>Quero</th><th>Faço</th></tr><tr><td>Saber quando um node falha</td><td>Settings, On Error: <code>Continue (using error output)</code>, e ligo um alerta na saída <b>Error</b></td></tr><tr><td>Avisar a equipe</td><td>Telegram: Chat ID <code>123456789</code>, Text com <code>{{ $json.body.cliente }}</code> e <code>{{ $json.error }}</code></td></tr><tr><td>Proteger o workflow inteiro</td><td>Workflow separado com <b>Error Trigger</b></td></tr><tr><td>Separar uma lista em itens</td><td><b>Split Out</b>: <code>body.pedidos</code></td></tr><tr><td>Tratar um item por vez</td><td><b>Loop Over Items</b>: Batch Size <code>1</code>; ligo na saída <b>Loop</b></td></tr><tr><td>Não estourar o limite da API</td><td><b>Wait</b>: 1 <code>Seconds</code>, com a seta de volta ao Loop</td></tr><tr><td>Reaproveitar uma parte</td><td>Sub-workflow com <b>When Executed by Another Workflow</b> + <b>Execute Workflow</b> no principal</td></tr></table></div>'},
 {id:'resumo3',t:'O que você aprendeu no Mundo 3',tut:'É o mesmo resumo que o simulador mostra ao passar no quiz do Mundo 3.',
  fala:'Este é o resumo de tudo o que você aprendeu no Mundo 3.',
  html:(function(){var R=(window.CURSO&&CURSO.resumo3)||null;if(!R)return '';return '<p>'+esc(R.abre)+'</p>'+R.mundos.map(function(m){return '<h4>Mundo '+m.n+' &middot; '+esc(m.t)+'</h4><div class="tw"><table class="cmp"><tr><th>Missão</th><th>O que ficou</th></tr>'+m.it.map(function(x){return '<tr><td><b>'+esc(x[0])+'</b></td><td>'+esc(x[1])+'</td></tr>';}).join('')+'</table></div>';}).join('')+'<h4>O fio que liga tudo</h4><p>'+esc(R.fio)+'</p><h4>Erros que você já sabe ler</h4><p>'+esc(R.erros)+'</p><h4>O que vem agora</h4><p>'+esc(R.proximo)+'</p>';})()},
 {id:'rec33',t:'Recapitulando a Missão 3.3',tut:'Uma peça, vários usos.',
  fala:'Missão 3.3 cumprida. Seu fluxo ficou organizado em peças reaproveitáveis.',
  html:'<ul><li><b>Sub-workflow</b>: um workflow que outro workflow chama.</li><li>Ele começa com <b>When Executed by Another Workflow</b>.</li><li>No principal, o <b>Execute Workflow</b> escolhe qual workflow chamar e traz o resultado de volta.</li></ul>'}
]);

function icn4(n){return n==='When chat message received'?IC.msg:n==='AI Agent'?IC.bot:n==='If'?IC.branch:icn(n);}
function sub4(x,y,ic,t){return '<div style="position:absolute;left:'+(x-46)+'px;top:'+y+'px;width:92px;text-align:center;font-size:11px;color:#6b6b78;line-height:1.25"><div style="width:44px;height:44px;border-radius:50%;border:2px solid #b7b7c0;background:#fff;margin:0 auto 4px;display:grid;place-items:center"><span style="display:block;width:22px;height:22px;color:#6b6b76">'+ic+'</span></div>'+t+'</div>';}
function dash4(x1,y1,x2,y2){var dx=x2-x1,dy=y2-y1,d=Math.sqrt(dx*dx+dy*dy),a=Math.atan2(dy,dx);return '<div style="position:absolute;left:'+((x1+x2)/2-d/2)+'px;top:'+((y1+y2)/2)+'px;width:'+d+'px;border-top:2px dashed #98a2b3;transform:rotate('+a+'rad)"></div>';}
/* arr: nomes dos nodes principais; subs: [indiceDoAgente, [[icone,texto],...]] */
function flow4(arr,hl,wf,subs,tags){var h='',st=arr.length>4?150:176,x=90,ax={};arr.forEach(function(n,i){h+=node(x,120,icn4(n),n,n==='Webhook'?{hl:hl===i,cls:'hk',lbl:'POST'}:{hl:hl===i});if(i<arr.length-1)h+=wire(x+76,158,st-76);ax[i]=x+38;x+=st;});
 if(subs){var ai=subs[0],L=subs[1],n=L.length,gap=100;L.forEach(function(u,k){var sx=ax[ai]+(k-(n-1)/2)*gap;h+=dash4(ax[ai],214,sx,272)+sub4(sx,272,u[0],u[1]);});}
 (tags||[]).forEach(function(t){h+=ptag(t[0],t[1],t[2]);});return edScr(h,wf);}

chapter('c14','Missão 4.1','Seu primeiro Agente de IA','Montar um agente com chat, cérebro e uma ferramenta: o Buscar CEP que você já criou.',['Explicar o que é um AI Agent e como ele difere de um node comum','Ligar o gatilho de chat, o AI Agent e o Chat Model','Dar ao agente uma ferramenta: o sub-workflow Buscar CEP'],[
 {id:'agente',t:'Do passo fixo ao agente',tut:'Até aqui o workflow seguia passos fixos. O agente decide sozinho o que fazer.',
  fala:'Missão 4.1. Chegamos ao Agente de IA: um node que pensa, decide e usa ferramentas.',
  html:'<p>Nos Mundos 1, 2 e 3 você montou fluxos com <b>passos fixos</b>: o pedido chega, o If decide, o HTTP Request busca. Cada passo faz sempre a mesma coisa. O <b>AI Agent</b> é diferente: você diz <b>quem ele é</b> e <b>quais ferramentas ele tem</b>, e ele decide o que fazer com cada mensagem.</p><div class="tw"><table class="cmp"><tr><th></th><th>Node comum</th><th>AI Agent</th></tr><tr><td><b>Caminho</b></td><td>Fixo: você desenha cada passo.</td><td>Ele escolhe: pensa e decide quais ferramentas usar.</td></tr><tr><td><b>Entrada</b></td><td>Dados com campos conhecidos.</td><td>Uma mensagem em linguagem natural.</td></tr><tr><td><b>Saída</b></td><td>Sempre no mesmo formato.</td><td>Texto livre, a menos que você peça campos fixos (Missão 4.2).</td></tr></table></div>'+say('Pense no agente como um funcionário novo: inteligente, mas sem acesso a nada. Você dá a ele um cérebro, instruções e ferramentas.')+'<p>O agente tem três tipos de peças ligadas embaixo dele, os <b>sub-nodes</b>: <b>Chat Model</b> (o cérebro), <b>Memory</b> (a memória) e <b>Tool</b> (as ferramentas). Mais tarde entra o <b>Output Parser</b> (o formato da resposta).</p>'},
 {id:'cerebro',t:'Gatilho de chat, AI Agent e Chat Model',tut:'O chat entrega a mensagem, o agente pensa, o Chat Model é o cérebro.',
  fala:'Comece com o gatilho When chat message received, ligue o AI Agent e escreva a System Message. Sem Chat Model o agente dá erro.',
  html:'<p>O fluxo começa com o gatilho <b>When chat message received</b> (On chat message): ele abre um chat de teste dentro do próprio n8n. Clique no <b>+</b> e ligue o <b>AI Agent</b>.</p><div class="tw"><table class="cmp"><tr><th>Campo do AI Agent</th><th>O que escrever</th></tr><tr><td><b>Source for Prompt</b></td><td><code>Connected Chat Trigger Node</code> (o agente usa a mensagem do chat)</td></tr><tr><td><b>System Message</b> (Options)</td><td><code>Você é o atendente virtual da loja. Responda em português, de forma curta e educada.</code></td></tr></table></div>'+fig(flow4(['When chat message received','AI Agent'],1,WF41,[1,[[IC.chip,'Chat Model']]]),'O AI Agent com o espaço do Chat Model embaixo.')+'<p>Se você clicar em <b>Execute step</b> agora, o n8n responde <code>A Chat Model sub-node must be connected and enabled</code>: o agente ainda não tem cérebro. Clique no <b>+ Chat Model</b>, embaixo do AI Agent, e escolha o <b>OpenAI Chat Model</b> (o Google Gemini e o Anthropic também servem). A <b>credencial</b>, a chave de acesso ao modelo, fica guardada em Credentials, igual à do Telegram na Missão 3.1.</p>'+tipsx('<p>Teste no chat, embaixo. Escreva <code>Qual o endereço do CEP 40010000?</code>. O agente responde, mas diz que <b>não consegue consultar CEPs</b>: ele tem cérebro, mas nenhuma ferramenta.</p>')},
 {id:'ferramenta',t:'Dando uma ferramenta: o Buscar CEP',tut:'O sub-workflow da Missão 3.3 vira uma ferramenta do agente.',
  fala:'Clique no + Tool e escolha Call n8n Workflow Tool. Name buscar_cep, uma boa Description e o workflow Buscar CEP.',
  html:'<p>Aqui a Missão 3.3 volta. O workflow <b>Buscar CEP</b>, que você criou como sub-workflow, vira <b>ferramenta</b> do agente. Clique no <b>+ Tool</b> e escolha <b>Call n8n Workflow Tool</b>:</p><div class="tw"><table class="cmp"><tr><th>Campo</th><th>O que escrever</th></tr><tr><td><b>Name</b></td><td><code>buscar_cep</code> (sem espaços)</td></tr><tr><td><b>Description</b></td><td><code>Use para buscar o endereço de um CEP. Recebe o cep com 8 números.</code></td></tr><tr><td><b>Source</b></td><td><code>Database</code></td></tr><tr><td><b>Workflow</b></td><td><code>Buscar CEP</code></td></tr></table></div>'+fig(flow4(['When chat message received','AI Agent'],1,WF41,[1,[[IC.chip,'OpenAI Chat Model'],[IC.tool,'Call n8n Workflow Tool']]]),'O agente com o Chat Model e a ferramenta ligados.')+warn('<p>A <b>Description</b> é o que o agente lê para decidir <b>quando</b> usar a ferramenta. Ele não enxerga o interior do workflow, só o nome e a descrição. Descrição vaga, ferramenta ignorada.</p>')+'<p>Pergunte de novo no chat: <code>Qual o endereço do CEP 40010000?</code>. Agora, embaixo da resposta, aparecem os passos: <b>AI Agent, Chat Model, Tool: buscar_cep, Resposta</b>. Ninguém mandou o agente usar a ferramenta: <b>ele decidiu</b>. A resposta: <code>Rua de Exemplo, Comércio, Salvador/BA</code>.</p>'},
 {id:'rec41',t:'Recapitulando a Missão 4.1',tut:'Chat entrega, cérebro pensa, ferramenta age.',
  fala:'Missão 4.1 cumprida. Seu agente já conversa e usa uma ferramenta que você mesmo criou.',
  html:'<ul><li><b>AI Agent</b>: decide sozinho o que fazer, em vez de seguir passos fixos.</li><li><b>When chat message received</b>: gatilho que abre o chat de teste.</li><li><b>Chat Model</b>: o cérebro. Sem ele, o n8n avisa que falta um modelo conectado.</li><li><b>Call n8n Workflow Tool</b>: transforma um workflow seu (o Buscar CEP) em ferramenta. A <b>Description</b> decide quando ela é usada.</li></ul>'}
]);
chapter('c15','Missão 4.2','Memória e saída estruturada','Fazer o agente lembrar da conversa e responder em campos fixos.',['Ver o agente esquecer e resolver com a Simple Memory','Ajustar o Context Window Length','Usar o Structured Output Parser para a resposta sair em campos fixos'],[
 {id:'memoria',t:'O agente esquece: Simple Memory',tut:'Sem memória, cada mensagem é uma conversa nova.',
  fala:'Missão 4.2. No chat, diga seu nome e pergunte depois: o agente esquece. A Simple Memory resolve.',
  html:'<p>No chat, escreva <code>Oi, meu nome é Bruno</code>. O agente responde. Agora escreva <code>Qual é o meu nome?</code>. Ele responde que <b>não sabe</b>. Sem memória, <b>cada mensagem é uma conversa nova</b>.</p><p>A solução é um sub-node de <b>Memory</b>. Clique no <b>+ Memory</b>, embaixo do AI Agent, e escolha a <b>Simple Memory</b> (guarda no próprio n8n, sem credencial):</p><div class="tw"><table class="cmp"><tr><th>Campo</th><th>O que escrever</th></tr><tr><td><b>Session ID</b></td><td><code>Connected Chat Trigger Node</code> (cada pessoa tem a sua memória)</td></tr><tr><td><b>Context Window Length</b></td><td><code>5</code> (quantas mensagens recentes ele guarda)</td></tr></table></div>'+fig(flow4(['When chat message received','AI Agent'],1,WF42,[1,[[IC.chip,'OpenAI Chat Model'],[IC.mem,'Simple Memory'],[IC.tool,'Call n8n Workflow Tool']]]),'O agente com Chat Model, Memória e Ferramenta.')+warn('<p>A memória só guarda o que for dito <b>depois</b> de ligada. Mande de novo <code>Oi, meu nome é Bruno</code> e depois <code>Qual é o meu nome?</code>. Agora ele responde: <i>Seu nome é Bruno</i>.</p>')},
 {id:'saida',t:'Resposta em campos fixos: Structured Output Parser',tut:'Texto livre é bom para conversar, mas ruim para o próximo node. Campos fixos resolvem.',
  fala:'Ligue o Require Specific Output Format no agente e o Structured Output Parser com um JSON de exemplo.',
