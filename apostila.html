  var nxt=SECS.filter(function(s){return s.id===ST.last;})[0]||SECS.filter(function(s){return !ST.read[s.id];})[0]||SECS[0];
  document.getElementById('contT').textContent=ST.last?'Voltar para: '+nxt.t:'Começar: '+nxt.t;
}
/* scrollspy + leitura */
var cur=null,tick=false;
function onScroll(){
  if(hubEl&&!hubEl.hidden)return;
  if(tick)return;tick=true;requestAnimationFrame(function(){tick=false;
    var act=null,vh=window.innerHeight,changed=false;
    SECS.forEach(function(s){var r=s.el.getBoundingClientRect();if(r.top<=vh*0.35)act=s;if(r.bottom<vh*0.75&&r.bottom>0&&!ST.read[s.id]){ST.read[s.id]=1;changed=true;}if(r.bottom<0&&!ST.read[s.id]&&false){}});
    var up=document.getElementById('up');up.classList.toggle('on',window.scrollY>700);
    if(act&&act!==cur){cur=act;ST.last=act.id;changed=true;SECS.forEach(function(s){s.link.classList.toggle('on',s===act);});
      var c=CH.filter(function(x){return x.id===act.ch;})[0];document.getElementById('crumb').innerHTML=esc(c.k)+' &rsaquo; <b>'+esc(act.t)+'</b>';
      document.getElementById('tpc').textContent=act.t;
      var lk=act.link;if(lk&&lk.scrollIntoView&&!document.getElementById('srch').value){var sd=document.getElementById('side'),r=lk.getBoundingClientRect(),sr=sd.getBoundingClientRect();if(r.top<sr.top+60||r.bottom>sr.bottom-90)sd.scrollTop+=r.top-sr.top-120;}
      if(snd)speakSec(act);}
    if(changed){saveST();updProg();}
  });
}
window.addEventListener('scroll',onScroll,{passive:true});window.addEventListener('resize',function(){fit();onScroll();});
/* escala das telas */
function fit(){document.querySelectorAll('.fit').forEach(function(f){var w=f.clientWidth;if(!w)return;var sc=w/900,bf=f.firstElementChild;bf.style.transform='scale('+sc+')';f.style.height=(bf.offsetHeight*sc)+'px';});}
/* menu */
var side=document.getElementById('side'),scrim=document.getElementById('scrim'),bMenu=document.getElementById('bMenu');
function menu(o){side.classList.toggle('open',o);scrim.hidden=!o;bMenu.setAttribute('aria-expanded',o);}
bMenu.addEventListener('click',function(){menu(!side.classList.contains('open'));});
scrim.addEventListener('click',function(){menu(false);});
toc.addEventListener('click',function(e){var a=e.target.closest('a[data-s]');if(a){menu(false);var s=SECS.filter(function(x){return x.id===a.dataset.s;})[0];if(s){e.preventDefault();s.el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});try{history.replaceState(null,'','#s-'+s.id);}catch(x){}}return;}
  var b=e.target.closest('.ch>button');if(b){var ch=b.parentNode;var cl=ch.classList.toggle('cl');b.setAttribute('aria-expanded',!cl);}});
doc.addEventListener('click',function(e){var a=e.target.closest('.mtoc a');if(a){e.preventDefault();var id=a.getAttribute('href').slice(1);var el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}});
document.getElementById('bCont').addEventListener('click',function(){var s=SECS.filter(function(x){return x.id===ST.last;})[0]||SECS.filter(function(x){return !ST.read[x.id];})[0]||SECS[0];s.el.scrollIntoView({behavior:'smooth',block:'start'});menu(false);});
document.getElementById('up').addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
/* busca */
document.getElementById('srch').addEventListener('input',function(){
  var q=nrm(this.value),any=false;
  toc.querySelectorAll('.noh').forEach(function(n){n.remove();});
  CH.forEach(function(c){var box=toc.querySelector('.ch[data-ch="'+c.id+'"]'),n=0;
    c.secs.forEach(function(s){var li=toc.querySelector('li[data-s="'+s.id+'"]'),tt=li.querySelector('.tt'),m=!q||s.text.indexOf(q)>=0;li.classList.toggle('hid',!m);tt.textContent=s.t;if(m&&q&&nrm(s.t).indexOf(q)>=0){var i=nrm(s.t).indexOf(q);tt.innerHTML=esc(s.t.slice(0,i))+'<mark>'+esc(s.t.slice(i,i+q.length))+'</mark>'+esc(s.t.slice(i+q.length));}if(m)n++;});
    box.classList.toggle('hid',!n);if(q&&n)box.classList.remove('cl');if(n)any=true;});
  if(q&&!any){var p=document.createElement('p');p.className='noh';p.textContent='Nada encontrado. Pergunte ao tutor.';toc.appendChild(p);}
});
/* checklist + quiz + ouvir */
doc.addEventListener('change',function(e){var c=e.target;if(c.matches&&c.matches('.co.do input')){var sec=c.closest('.sec').dataset.id;ST.chk[sec+':'+c.dataset.k]=c.checked?1:0;saveST();}});
doc.querySelectorAll('.co.do').forEach(function(box){var sec=box.closest('.sec').dataset.id;box.querySelectorAll('input').forEach(function(i){if(ST.chk[sec+':'+i.dataset.k])i.checked=true;});});
var hits=0,answered=0;
doc.addEventListener('click',function(e){
  var b=e.target.closest('.qo');
  if(b){var q=b.closest('.q');if(q.classList.contains('done'))return;var c=+q.dataset.c;q.classList.add('done');answered++;if(+b.dataset.i===c)hits++;q.querySelectorAll('.qo').forEach(function(x,i){x.disabled=true;if(i===c)x.classList.add('ok');else if(x===b)x.classList.add('no');});
    var sc=document.getElementById('score');sc.textContent='Você acertou '+hits+' de '+answered+' respondidas'+(answered===QP.length?'. '+(hits>=QP.length*0.8?'Muito bem! Você está pronto para o Mundo 2.':'Releia os capítulos das perguntas que errou e tente de novo.'):'.');return;}
  var l=e.target.closest('.listen');if(l){var on=l.getAttribute('aria-pressed')==='true';stopSpeak();if(!on){var sec=l.closest('.sec');var p=l.parentNode.querySelector('p');speak(p?p.textContent:'',l);}}
});
/* voz */
var snd=false;
function stopSpeak(){try{speechSynthesis.cancel();}catch(e){}document.querySelectorAll('.listen').forEach(function(b){b.setAttribute('aria-pressed','false');b.innerHTML='&#9654; Ouvir';});}
function speak(t,btn){if(!t||!window.speechSynthesis)return;var u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=1;u.pitch=.9;
  var vs=speechSynthesis.getVoices().filter(function(v){return /^pt/i.test(v.lang);});var m=vs.filter(function(v){return /antonio|daniel|felipe|ricardo|male|masc/i.test(v.name);})[0];if(m)u.voice=m;else if(vs[0])u.voice=vs[0];
  if(btn){btn.setAttribute('aria-pressed','true');btn.innerHTML='&#9632; Parar';u.onend=u.onerror=function(){btn.setAttribute('aria-pressed','false');btn.innerHTML='&#9654; Ouvir';};}
  try{speechSynthesis.speak(u);}catch(e){}}
var spT=null;function speakSec(s){clearTimeout(spT);spT=setTimeout(function(){stopSpeak();var t=s.fala||'';if(t)speak(t);},900);}
document.getElementById('bSnd').addEventListener('click',function(){snd=!snd;this.setAttribute('aria-pressed',snd);this.textContent='Voz: '+(snd?'ligada':'desligada');stopSpeak();if(snd&&cur)speakSec(cur);});
/* tutor */
var tp=document.getElementById('tp'),tlog=document.getElementById('tlog'),tch=document.getElementById('tch'),tfab=document.getElementById('tfab');
function tutorGender(){var f=ST.g==='f';document.getElementById('tfavI').innerHTML=(f?TUT_F:TUT_M);document.getElementById('tfabT').textContent='Fale com '+(f?'a tutora':'o tutor');document.getElementById('tavH').innerHTML=f?TUT_F:TUT_M;document.getElementById('tpn').textContent=f?'Tutora':'Tutor';tfab.setAttribute('aria-label','Fale com '+(f?'a tutora':'o tutor')+' (beta)');}
function tmsg(t,u){var d=document.createElement('div');d.className='tm '+(u?'u':'t');var s=document.createElement('span');s.textContent=t;d.appendChild(s);tlog.appendChild(d);tlog.scrollTop=tlog.scrollHeight;}
function chips(){var base=[['Explique esta parte','__ctx'],['O que é workflow?','o que é workflow'],['O que é JSON?','o que é json'],['Como pego um dado?','como pego um dado expressão'],['Number ou String?','number string tipo'],['Deu erro, e agora?','deu erro']];tch.innerHTML='';base.forEach(function(b){var x=document.createElement('button');x.type='button';x.textContent=b[0];x.addEventListener('click',function(){ask(b[0],b[1]);});tch.appendChild(x);});}
function ask(label,q){tmsg(label,true);setTimeout(function(){var a;if(q==='__ctx'){a=cur?('Você está em "'+cur.t+'". '+cur.tut):'Comece pela seção "Como usar esta apostila". Depois, role a página e eu explico cada parte.';}else a=kbAnswer(q);tmsg(a||'Não encontrei isso direto. Tente com outras palavras (por exemplo: JSON, gatilho, expressão, Number) ou use a busca do sumário. Se for sobre um assunto dos próximos Mundos, ele chega em breve.');},350);}
function openTutor(){tp.hidden=false;tfab.style.display='none';if(!tlog.children.length){tmsg('Oi! Sou '+(ST.g==='f'?'a tutora':'o tutor')+' desta apostila. Toque em "Explique esta parte" que eu explico de outro jeito o que você está lendo, ou escreva a sua dúvida.');}document.getElementById('tq').focus();}
function closeTutor(){tp.hidden=true;tfab.style.display='';tfab.focus();}
tfab.addEventListener('click',openTutor);document.getElementById('tx').addEventListener('click',closeTutor);
document.getElementById('tsw').addEventListener('click',function(){ST.g=ST.g==='f'?'m':'f';saveST();tutorGender();});
document.getElementById('tf').addEventListener('submit',function(e){e.preventDefault();var i=document.getElementById('tq'),v=i.value.trim();if(!v)return;i.value='';ask(v,v);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!tp.hidden)closeTutor();});
chips();tutorGender();
fit();updProg();setTimeout(fit,80);setTimeout(fit,500);
/* menu principal */
var hubEl=document.getElementById('hub'),wrapEl=document.querySelector('.wrap'),bHub=document.getElementById('bHub');
var HUBG=[{n:'',t:'Antes de começar',d:'Como a apostila funciona e a ideia central do n8n',ids:['c0','c1']},{n:1,t:'Primeiros passos',d:'Gatilho, JSON, expressões e tipos de dado',ids:['c2','c3','c4','c5']},{n:2,t:'Decisões e dados',d:'Webhook, HTTP Request, Merge, If e Switch',ids:['c7','c8','c9','c10']},{n:3,t:'Erros, loops e sub-workflows',d:'Alertas de falha, lotes e peças reaproveitáveis',ids:['c11','c12','c13']},{n:4,t:'Agentes de IA e projeto final',d:'Agente, memória, saída estruturada e o projeto completo',ids:['c14','c15','c16']},{n:'?',t:'Cola e socorro',d:'Resumo, glossário e o que fazer quando der erro',ids:['c6']}];
function chPct(c){var n=c.secs.filter(function(x){return ST.read[x.id];}).length;return Math.round(n/c.secs.length*100);}
function buildHub(){
  var used={};HUBG.forEach(function(g){g.ids.forEach(function(i){used[i]=1;});});
  var extra=CH.filter(function(c){return !used[c.id];}).map(function(c){return c.id;});
  var groups=HUBG.slice();if(extra.length)groups.push({n:'+',t:'Outros capítulos',d:'',ids:extra});
  var nxt=SECS.filter(function(s){return s.id===ST.last;})[0]||SECS.filter(function(s){return !ST.read[s.id];})[0]||SECS[0];
  var rd=SECS.filter(function(s){return ST.read[s.id];}).length;
  var h='<div class="hubh"><div><h1>Menu principal da apostila</h1><p>Escolha por onde quer começar. Cada Mundo tem os capítulos que explicam as missões do curso, com calma e com exemplos. Você leu <b>'+rd+' de '+SECS.length+'</b> seções.</p></div><button class="hubgo" type="button" data-go="'+nxt.id+'">'+(ST.last?'Continuar de onde parei':'Começar pelo início')+'<small>'+esc(nxt.t)+'</small></button></div><div class="hubg">';
  groups.forEach(function(g){
    var cs=g.ids.map(function(i){return CH.filter(function(c){return c.id===i;})[0];}).filter(Boolean);if(!cs.length)return;
    var pc=Math.round(cs.reduce(function(a,c){return a+chPct(c);},0)/cs.length);
    h+='<div class="hubc"><div class="ht"><span class="hn">'+(g.n===''?'0':g.n)+'</span><div><b>'+(typeof g.n==='number'?'Mundo '+g.n+' · ':'')+esc(g.t)+'</b>'+(g.d?'<small>'+esc(g.d)+'</small>':'')+'</div></div><div class="hb"><i style="width:'+pc+'%"></i></div><ul>'+cs.map(function(c){return '<li><a href="#cap='+c.id+'" data-cap="'+c.id+'"><span>'+esc(c.t)+'</span>'+(c.done?'<em class="ok">&#10003; feita</em>':'<em>'+chPct(c)+'%</em>')+'</a></li>';}).join('')+'</ul></div>';
  });
  hubEl.innerHTML=h+'</div>';
}
function showHub(){buildHub();hubEl.hidden=false;wrapEl.hidden=true;bHub.hidden=true;try{stopSpeak();}catch(e){}window.scrollTo(0,0);try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
function showDoc(){hubEl.hidden=true;wrapEl.hidden=false;bHub.hidden=false;fit();setTimeout(fit,80);}
function goSec(id){showDoc();var de=document.documentElement,go=function(){var t=document.getElementById('s-'+id);if(!t)return;de.style.scrollBehavior='auto';t.scrollIntoView();de.style.scrollBehavior='';};setTimeout(go,150);setTimeout(function(){go();onScroll();},700);}
hubEl.addEventListener('click',function(e){
  var a=e.target.closest('[data-cap]'),g=e.target.closest('[data-go]');
  if(a){e.preventDefault();var c=CH.filter(function(x){return x.id===a.dataset.cap;})[0];if(c)goSec(c.secs[0].id);}
  else if(g){e.preventDefault();goSec(g.dataset.go);}
});
bHub.addEventListener('click',showHub);
var hc=/^#cap=(c\d+)$/.exec(location.hash);if(hc){var cc=CH.filter(function(x){return x.id===hc[1];})[0];if(cc)location.hash='#s-'+cc.secs[0].id;}
var h0=/^#s-(.+)$/.exec(location.hash);if(h0){var t0=document.getElementById('s-'+h0[1]);if(t0)setTimeout(function(){t0.scrollIntoView();},120);}
if(/^#(cap=c\d+|s-.+)$/.test(location.hash)){showDoc();}else{showHub();}
onScroll();

})();
</script>
