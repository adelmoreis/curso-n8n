      if(to){var nd=Object.assign({},s,dd);delete nd.manual;done=CL.db.doc('students/'+to).set(nd).then(function(){return CL.db.doc('students/'+id).delete();});}
      else done=CL.db.doc('students/'+id).update(dd);
      return done.then(function(){m.remove();if(dd.user&&dd.pass){GD.msg='Acesso salvo. Usuário: '+dd.user+'  |  Senha: '+dd.pass+'. Passe os dois para o aluno.';gpaint();}});
    }).catch(function(e){btn.disabled=false;var em=m.querySelector('.gerr');if(!em){em=document.createElement('p');em.className='gpm warn gerr';m.querySelector('.gmb').before(em);}em.textContent=(typeof e==='string')?e:'Não foi possível salvar.';});
    return;
  });
}

/* ---------- Login de alunos (usuário e senha criados pelo gestor) ---------- */
function uname(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim().replace(/\s+/g,'.').replace(/[^a-z0-9_.@+-]/g,'').slice(0,40);}
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function newSalt(){return b64(crypto.getRandomValues(new Uint8Array(16)));}
function pwHash(pw,salt){
  if(!window.crypto||!crypto.subtle)return Promise.reject('nocrypto');
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
    return crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(salt),iterations:100000,hash:'SHA-256'},k,256);
  }).then(b64);
}
function blankS(){return {logged:false,name:'',av:-1,mine:0,won:false,tourDone:false,tourEd:false,xp:0,m11:false,m12:false,m13:false,q1:false,q2:false,q3:false,q4:false,cert:null,fe:false,fj:false,ft:false,fl:false,voice:S.voice,vm:S.vm,vf:S.vf,vr:S.vr,vp:S.vp,hand:S.hand,mute:false};}
function blankV(){return {view:'home',tab:'editor',panel:false,trig:false,sel:-1,q:'',ed:null,ed2:null,cur:null,nv:false,wfn:0};}
function doLogin(user,pw,known){
  var u=uname(user);
  if(!u||(!pw&&!known))return Promise.reject('empty');
  var A=window.claude&&window.claude.a3d;
  if(A&&A.remote){
    return A.salt(u).then(function(j){if(!j.salt)throw 'nouser';return known?known:pwHash(pw,j.salt);},function(){throw 'read';}).then(function(h){
      return A.login(u,h).then(function(d){return {u:u,h:h,d:d};},function(e){throw (e&&e.code==='bad')?'bad':(e&&e.code==='nouser')?'nouser':(e&&e.code==='rate')?'rate':'read';});
    });
  }
  return CL.db.doc('logins/'+u).get().catch(function(){throw 'read';}).then(function(sn){
    if(!sn.exists)throw 'nouser';
    var d=sn.data();
    return (known?Promise.resolve(known):pwHash(pw,d.salt)).then(function(h){if(h!==d.hash)throw 'bad';return {u:u,h:h,d:d};});
  });
}
function enterSession(r){
  CL.sid=r.d.sid;CL.login=r.u;
  try{localStorage.setItem(KEY0+'_sess',JSON.stringify({u:r.u,h:r.h}));}catch(e){}
  KEY=KEY0+'_'+CL.sid;
  return CL.db.doc('saves/'+CL.sid).get().then(function(sn){return sn.exists?sn.data():null;},function(){return null;}).then(function(sv){
    var loc=null,st=null;
    try{loc=JSON.parse(localStorage.getItem(KEY));}catch(e){}
    if(sv&&sv.st){try{st=JSON.parse(sv.st);}catch(e){}}
    var pick=(st&&(!loc||(sv.at||0)>(loc._at||0)))?st:loc;
    S=blankS();if(pick)loadS(pick);
    S.logged=true;if(!S.name)S.name=r.d.name||'';
    CL.st=r.d;CL.sig='';
    if(CL.unL){try{CL.unL();}catch(e){}}
    try{CL.unL=CL.db.doc('logins/'+r.u).onSnapshot(function(sn){
      if(!sn.exists){logout();return;}
      CL.st=sn.data();applyStatus();
    },function(){});}catch(e){}
    V=blankV();save();cloudSync(true);applyStatus();route();
  });
}
function logout(){
  TQ.msgs=[];
  try{localStorage.removeItem(KEY0+'_sess');}catch(e){}
  if(CL.unL){try{CL.unL();}catch(e){}CL.unL=null;}
  CL.sid=null;CL.login=null;CL.st=null;KEY=KEY0;
  S=blankS();V=blankV();
  var b=document.getElementById('blk');if(b)b.remove();
  try{speechSynthesis.cancel();}catch(e){}
  mentorEl.classList.add('hidden');pulse('');
  route();
}

/* ---------- Atalho do gestor (Alt + Shift + S) ---------- */
var SKSTEPS=[['m11','Missão 1.1'],['m12','Missão 1.2'],['m13','Missão 1.3'],['q1','Quiz do Mundo 1'],['m21','Missão 2.1'],['m22','Missão 2.2'],['m23','Missão 2.3'],['m24','Projeto do Mundo 2'],['q2','Quiz do Mundo 2'],['m31','Missão 3.1'],['m32','Missão 3.2'],['m33','Missão 3.3'],['q3','Quiz do Mundo 3'],['m41','Missão 4.1'],['m42','Missão 4.2'],['m43','Projeto final'],['q4','Quiz final']];
var SKXP={m11:100,m12:120,m13:150,q1:200,m21:150,m22:150,m23:200,m24:250,q2:200,m31:200,m32:200,m33:250,q3:200,m41:250,m42:250,m43:300,q4:300};
function skLoc(){
  if(V.view==='m21')return 'm21';
  if(V.view==='m3'&&V.m3)return 'm'+V.m3.mis;
  if(V.view==='m4'&&V.m4)return 'm'+V.m4.mis;
  if(V.view==='m2'&&V.m2)return V.m2.mis==='24'?'m24':V.m2.mis==='23'?'m23':'m22';
  if(V.view==='list'||V.view==='editor')return !S.m11?'m11':!S.m12?'m12':!S.m13?'m13':'';
  return '';
}
function skName(k){var r=SKSTEPS.filter(function(x){return x[0]===k;})[0];return r?r[1]:'';}
function skMark(k){
  if(!S[k]){S[k]=true;S.xp=(S.xp||0)+(SKXP[k]||0);}
  S.skips=(S.skips||[]).concat([k+'@'+new Date().toISOString().slice(0,10)]).slice(-40);
  if(k==='m11'||k==='m12'||k==='m13'){S.mine=1;S.won=true;S.tourDone=true;S.tourEd=true;S.fe=true;if(k!=='m11')S.fj=true;if(k==='m13')S.ft=true;}
  if(k==='m21')S.fh=true;
}
function skLeave(){var w=document.querySelector('.win.skp');if(w)w.remove();V.nv=false;V.cur=null;pulse('');V.view='home';route();}
function skOpen(){
  var old=document.querySelector('.win.skp');if(old){old.remove();return;}
  if(!S.logged||S.av<0||!S.name||document.querySelector('.win,.gp,.blk'))return;
  var w=document.createElement('div');w.className='win skp';document.body.appendChild(w);
  var free=skAllowed();
  if(!free){w.remove();return;}
  function close(){w.remove();}
  function panel(msg){
    var k=skLoc(),opts=SKSTEPS.map(function(x){return '<option value="'+x[0]+'">'+esc(x[1])+(S[x[0]]?' (já concluído)':'')+'</option>';}).join('');
    w.innerHTML='<div class="card" style="text-align:left"><h2 style="text-align:center">Atalho do gestor</h2><p class="mut" style="margin:0 0 4px">'+(k?'O aluno está na <b>'+esc(skName(k))+'</b>.':'O aluno está fora de uma missão.')+' Tudo o que você fizer aqui fica registrado.</p>'+(msg?'<p style="color:#0b7a3b;margin:4px 0">'+esc(msg)+'</p>':'')+
     (k?'<button class="btn full" type="button" id="sk1" style="margin-top:10px">Concluir '+esc(skName(k))+' e voltar ao início</button><button class="btn ghost full" type="button" id="sk2" style="margin-top:8px">Reiniciar '+esc(skName(k))+'</button>':'')+
     '<div class="lbl" style="margin-top:14px;font-weight:600">Marcar como concluído até a etapa:</div><select class="wsel" id="sk3" aria-label="Etapa">'+opts+'</select><button class="btn ghost full" type="button" id="sk3b" style="margin-top:8px">Aplicar</button><button class="btn ghost full" type="button" id="sk4" style="margin-top:8px">Ir para o início do curso</button><button class="btn ghost full" type="button" id="skx" style="margin-top:8px">Fechar</button></div>';
    var q=function(i){return w.querySelector(i);};
    q('#skx').addEventListener('click',close);
    q('#sk4').addEventListener('click',skLeave);
    if(k){
      q('#sk1').addEventListener('click',function(){skMark(k);save();skLeave();});
      q('#sk2').addEventListener('click',function(){
        close();pulse('');
        if(k==='m21'){m21Init();route();}
        else if(k==='m22'||k==='m23'||k==='m24'){m2Init(k==='m24'?'24':k==='m23'?'23':'22');route();}
        else if(k==='m31'||k==='m32'||k==='m33'){m3Init(k.slice(1));route();}
        else if(k==='m41'||k==='m42'||k==='m43'){m4Init(k.slice(1));route();}
        else{var vv=blankV();vv.capa=false;V=vv;goCourse();}
      });
    }
    q('#sk3b').addEventListener('click',function(){
      var to=q('#sk3').value,done=false;
      SKSTEPS.forEach(function(x){if(done)return;if(!S[x[0]])skMark(x[0]);if(x[0]===to)done=true;});
      save();panel('Pronto: etapas marcadas como concluídas até "'+skName(to)+'".');
    });
  }
  panel();
}
function skAllowed(){return !!(CL.admin||!CL.db||TEST||skperm());}
function skFill(tg){
  var e=V.cur;
  function setv(el,v,ev){if(!el)return;el.value=v;el.dispatchEvent(new Event(ev||'input',{bubbles:true}));}
  if(V.view==='m2'){m2Fill();return;}
  if(V.view==='m3'){m3Fill();return;}
  if(V.view==='m4'){m4Fill();return;}
  if(V.view==='m21'&&!(V.nv&&e&&e.mission==='21')){
    var m=document.querySelector('#wMethod'),pa=document.querySelector('#wPath');
    if(m&&m.value!=='POST')setv(m,'POST','change');
    if(pa&&pa.value.trim()!=='pedido')setv(pa,'pedido','input');
    return;
  }
  if(!e)return;
  if(e.mission==='21'){e.fields=[{n:'cliente',v:'{{ $json.body.cliente }}',t:'string'}];e.lastVal=0;}
  else if(e.mission==='12'){e.fields=[{n:'telefone',v:'{{ $json.telefone }}',t:'string'},{n:'modelo',v:'{{ $json.moto.modelo }}',t:'string'},{n:'acessorio',v:'{{ $json.extras[0] }}',t:'string'}];e.lastVal=2;}
  else if(e.mission==='13'){e.fields=[{n:'valor',v:'{{ $json.valor }}',t:'number'},{n:'pago',v:'{{ $json.pago }}',t:'boolean'}];e.inc=true;e.lastVal=1;}
  else{e.fields=[{n:'nome',v:'Maria',t:'string'}];e.lastVal=0;}
  route();
}
function skAdvance(){
  if(!skAllowed()||!S.logged||S.av<0||!S.name)return;
  var fk=document.querySelector('.win.ficha #fok');if(fk){fk.click();return;}
  if(document.querySelector('.win,.gp,.blk'))return;
  var did=false;
  function mark(){S.skips=(S.skips||[]).concat(['av@'+new Date().toISOString().slice(0,10)]).slice(-40);try{save();}catch(e){}}
  var bb=document.querySelector('#mentor .bubble .acts button.pri');
  if(bb&&bb.dataset.act!=='quiz'&&bb.dataset.act!=='voz'){bb.click();mark();return;}
  var tg=null;(ringSel||[]).some(function(sel){try{var x=document.querySelector(sel);if(x){tg=x;return true;}}catch(e){}return false;});
  if(!tg)return;
  var tn=tg.tagName,cl=tg.className||'';
  if(tn==='INPUT'||tn==='SELECT'||tn==='TEXTAREA'||/f-name|f-val|f-type/.test(cl)){skFill(tg);mark();return;}
  if(tg.id==='wMethod'||tg.id==='wPath'){skFill(tg);mark();return;}
  if(/(^|\s)node(\s|$)/.test(cl)||tg.hasAttribute('data-m2n')||tg.hasAttribute('data-n')){tg.dispatchEvent(new MouseEvent('dblclick',{bubbles:true,cancelable:true}));mark();return;}
  tg.click();mark();
}
document.addEventListener('keydown',function(ev){
  if(ev.code!=='KeyS'||!ev.altKey)return;
  if(ev.ctrlKey&&!ev.shiftKey){ev.preventDefault();skAdvance();}
  else if(ev.shiftKey&&!ev.ctrlKey){ev.preventDefault();skOpen();}
});

/* ---------- Gestor -> curso: sincronização imediata ---------- */
function skBadge(){
  var on=S.logged&&!CL.admin&&skperm()&&V&&V.view!=='home',b=document.getElementById('skbtn');
  if(on&&!b){b=document.createElement('button');b.type='button';b.id='skbtn';b.className='skbtn';b.textContent='Atalho liberado pelo mentor';b.title='Abre o atalho para concluir esta etapa';b.addEventListener('click',skOpen);document.body.appendChild(b);}
  if(b){b.hidden=!on||!!document.querySelector('.win,.blk,.gp');if(!on)b.remove();}
}
function cloudPoll(){
  if(!CL.db||CL.admin||TEST||!S.logged)return;
  var ref=CL.login?CL.db.doc('logins/'+CL.login):(CL.uid?CL.db.doc('students/'+CL.uid):null);if(!ref)return;
  ref.get().then(function(sn){if(!sn.exists)return;var d=sn.data();if(JSON.stringify(d)!==JSON.stringify(CL.st)){CL.st=d;applyStatus();if(V&&V.view==='home')try{route();}catch(e){}}}).catch(function(){});
}
setInterval(cloudPoll,15000);
window.addEventListener('focus',cloudPoll);
document.addEventListener('visibilitychange',function(){if(!document.hidden)cloudPoll();});
setInterval(function(){try{skBadge();}catch(e){}},1500);

var TEST=false;
function testAsStudent(){
  if(!CL.admin||!CL.db)return;
  closeGestor();
  try{S.logged&&save();}catch(e){}
  TEST=true;CL.admin=false;
  var g=document.getElementById('gbtn');if(g)g.remove();
  logout();
  KEY=KEY0+'_teste';
  if(!document.getElementById('gback')){
    var b=document.createElement('button');b.id='gback';b.type='button';b.className='gback';b.textContent='Sair do teste';b.title='Sair do teste e voltar a gestor';
    b.addEventListener('click',backToAdmin);dock().appendChild(b);
  }
  S=blankS();V=blankV();V.capa=false;route();
}
function backToAdmin(){
  if(!TEST)return;
  TEST=false;CL.admin=true;
  var b=document.getElementById('gback');if(b)b.remove();
  logout();
  S=blankS();try{loadS(JSON.parse(localStorage.getItem(KEY0)));}catch(e){}
  CL.sig='';gbtn();route();
}
function cloudWait(){return !!(window.claude&&window.claude.use&&!CL.ready&&!CL.failed);}
function splashView(){root.innerHTML='<div class="center"><div class="card"><p class="sub" style="margin:0">Conectando ao seu ambiente...</p></div></div>';mentorEl.classList.add('hidden');}
function realLoginView(){
  var free=!CL.cfg||CL.cfg.free!==false;
  root.innerHTML='<div class="center"><div class="card">'+LOGO()+'<h1>Entrar</h1><p class="sub">Use o usuário e a senha que o seu gestor criou para você. Cada aluno tem o seu próprio ambiente e o seu progresso.</p><form id="f"><div class="field"><label for="lu">Usuário</label><input id="lu" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"></div><div class="field"><label for="lp">Senha</label><input id="lp" type="password" autocomplete="current-password"></div><p class="lerr" id="le" role="alert" hidden></p><button class="btn full" type="submit" id="go">Entrar</button></form>'+(free?'<p class="note"><a href="#" id="free" style="color:inherit">Entrar em modo de teste, sem usuário</a>. Nesse modo o progresso fica só neste navegador e seu gestor não vê.</p>':'<p class="note">Esqueceu a senha ou ainda não tem acesso? Fale com o seu gestor.</p>')+'</div></div>';
  var er=$('#le'),go=$('#go');
  function fail(t){er.textContent=t;er.hidden=false;go.disabled=false;go.textContent='Entrar';}
  $('#f').addEventListener('submit',function(e){
    e.preventDefault();er.hidden=true;go.disabled=true;go.textContent='Entrando...';
    doLogin($('#lu').value,$('#lp').value).then(enterSession).catch(function(x){
      fail(x==='nocrypto'?'Este navegador não consegue validar a senha. Tente outro navegador.':x==='empty'?'Escreva o usuário e a senha.':x==='nouser'?'Não encontrei esse usuário. Digite o usuário que o gestor passou (sem espaços), não o nome.':x==='rate'?'Muitas tentativas. Aguarde alguns minutos e tente de novo.':x==='read'?'Não consegui consultar o cadastro agora. Confira a internet e tente de novo.':'Senha incorreta. Confira e tente de novo.');
    });
  });
  var fr=$('#free');if(fr)fr.addEventListener('click',function(e){e.preventDefault();S.logged=true;save();route();});
  $('#lu').focus();mentorEl.classList.add('hidden');
}
function gSyncLogin(id){
  var s=GD.stu[id];if(!s||!s.user)return;
  try{CL.db.doc('logins/'+s.user).update({name:s.name||'',status:s.status||'ativo',perms:s.perms||{}}).catch(function(){});}catch(e){}
}
function genPass(){var c='abcdefghjkmnpqrstuvwxyz23456789',o='';for(var i=0;i<6;i++)o+=c.charAt(Math.floor(Math.random()*c.length));return o;}
function gAcesso(m,id,s){
  var U=m.querySelector('#guser'),P=m.querySelector('#gpass'),N=m.querySelector('#gname');
  m.querySelector('#ggen').addEventListener('click',function(){P.value=genPass();if(!U.value.trim()&&N.value.trim())U.value=uname(N.value);});
  return function save(data){
    var u=uname(U.value),pw=P.value.trim(),oldU=s.user||'';
    if(!u&&pw&&data.name){u=uname(data.name);U.value=u;}
    if(u&&pw&&u===pw)return Promise.reject('O usuário e a senha estão iguais. O usuário é o que o aluno digita no 1º campo (ex.: sandra) e a senha é o 2º campo (ex.: 123456).');
    if(u&&pw&&data.perms&&!data.perms.m1)return Promise.reject('Marque o Mundo 1 abaixo. Sem ele o aluno não consegue entrar no curso.');
    data.user=u;data.pass=pw;
    if(!u&&!pw){if(oldU){try{CL.db.doc('logins/'+oldU).delete();}catch(e){}}data.user='';data.pass='';return Promise.resolve(data);}
    if(!u||pw.length<4)return Promise.reject('Para criar o acesso, escreva o usuário e uma senha de pelo menos 4 caracteres.');
    return CL.db.doc('logins/'+u).get().then(function(sn){
      if(sn.exists&&sn.data().sid!==id)throw 'Esse usuário já está em uso por outro aluno. Escolha outro.';
      var same=sn.exists&&oldU===u&&(s.pass||'')===pw;
      var salt=same?sn.data().salt:newSalt();
      return (same?Promise.resolve(sn.data().hash):pwHash(pw,salt)).then(function(h){
        return CL.db.doc('logins/'+u).set({sid:id,salt:salt,hash:h,name:data.name||'',status:s.status||'ativo',perms:data.perms,v:1});
      });
    }).then(function(){if(oldU&&oldU!==u){try{CL.db.doc('logins/'+oldU).delete();}catch(e){}}return data;});
  };
}

cloudInit();
})();
