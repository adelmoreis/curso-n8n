<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>N8N Academia Agente3d</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">
<style>
/* Simulador: reproduz a aparência do n8n (tema claro, como na instância real). Look único e fixo de propósito, para o aluno reconhecer a tela verdadeira. */
:root{
  --bg:#fbfbfb; --panel:#ffffff; --side:#f4f4f5; --line:#e4e4e7; --fg:#1f1f23; --mut:#6b6b76; --faint:#9a9aa5;
  --brand:#ff6d5a; --brand-d:#ee5844; --ok:#12b76a; --ok-soft:#e6f8ef; --warn:#f5a524; --info:#5b4ee8; --info-soft:#eeedfd;
  --dot:#d9d9de; --shadow:0 8px 28px rgba(20,20,40,.14);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
.hidden{display:none!important}
.pulse{position:relative;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(91,78,232,.55)}50%{box-shadow:0 0 0 7px rgba(91,78,232,0)}}

/* Login e boas-vindas */
.center{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px;width:100%;max-width:400px}
.card.wide{max-width:660px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo svg{width:34px;height:34px;flex:none}
.logo b{font-family:var(--display);font-size:19px;line-height:1.1}
.card h1{font-family:var(--display);font-size:24px;margin:0 0 4px;text-wrap:balance}
.card .sub{color:var(--mut);margin:0 0 18px}
.field{display:grid;gap:5px;margin-bottom:14px}
.field label{font-weight:500;font-size:13px}
.field input{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;color:var(--fg);width:100%}
.field input:focus{outline:2px solid var(--info);outline-offset:1px;border-color:transparent}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600}
.btn:hover{background:var(--brand-d)}
.btn:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.btn.full{width:100%}
.btn:disabled{background:var(--line);color:var(--faint);cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--side)}
.note{font-size:12.5px;color:var(--mut);margin-top:14px;padding:10px 12px;background:var(--info-soft);border-radius:8px}
.avgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin:6px 0 18px}
.avopt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;text-align:center;min-width:0}
.avopt:hover{border-color:var(--faint)}
.avopt[aria-pressed="true"]{border-color:var(--info);background:var(--info-soft)}
.avopt:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.avopt .pic{width:64px;height:64px;margin:0 auto 4px}
.avopt .pic svg{width:100%;height:100%}
.avopt b{display:block;font-size:12.5px}
.avopt span{display:block;font-size:11px;color:var(--mut);line-height:1.3}

/* App */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;position:sticky;top:0;height:100vh}
.side .logo{padding:0 8px;margin-bottom:14px}
.side .logo svg{width:28px;height:28px}
.side .logo b{font-size:14px}
.nav{display:grid;gap:2px}
.nav button{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--fg)}
.nav button:hover{background:#e9e9ec}
.nav button[aria-current="page"]{background:#e6e6ea;font-weight:500}
.nav svg{width:17px;height:17px;flex:none;color:var(--mut)}
.nav .beta{font-size:10.5px;background:var(--info-soft);color:var(--info);padding:0 6px;border-radius:99px;font-weight:600}
.side .grow{flex:1}
.main{padding:28px clamp(16px,4vw,48px) 120px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-family:var(--display);font-size:28px;margin:0;line-height:1.15}
.top p{margin:2px 0 0;color:var(--mut)}
.create{display:inline-flex;border-radius:8px;overflow:hidden}
.create .btn{border-radius:0}
.create .btn.main-b{padding:10px 18px}
.create .btn.chev{padding:10px 11px;border-left:1px solid rgba(255,255,255,.35)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.stat{padding:16px 18px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat .l{color:var(--mut);font-size:13px}
.stat .v{font-size:26px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:24px;margin:30px 0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 2px 11px;color:var(--mut);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-current="page"]{color:var(--brand);border-bottom-color:var(--brand)}
.tools{display:flex;justify-content:flex-end;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tools .inp,.tools .sel{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 12px;color:var(--mut);min-width:140px}
.rows{display:grid;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 18px;width:100%;text-align:left}
.row:hover{border-color:#cfcfd6}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .m{font-size:12.5px;color:var(--mut)}
.row .r{display:flex;gap:10px;align-items:center;flex:none}
.pill{font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:3px 10px;color:var(--mut);background:#fff}
.pill.pub{color:var(--fg);display:inline-flex;gap:6px;align-items:center}
.pill.pub i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.pill.new{background:var(--ok-soft);border-color:#b8ebd0;color:#0b7a47;font-weight:600}
.total{margin-top:14px;color:var(--mut);text-align:right;font-size:13px}

/* Editor */
.ed{display:grid;grid-template-rows:auto minmax(0,1fr) 150px;min-height:100vh;position:relative}
.edtop{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.crumb{display:flex;gap:8px;align-items:center;color:var(--mut);min-width:0}
.crumb b{color:var(--fg);font-weight:500}
.crumb .tag{font-size:12.5px;color:var(--faint)}
.edtop .sp{flex:1}
.pub-b{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;color:var(--faint);background:#fff}
.pub-b button{background:none;border:0;padding:7px 14px;color:inherit}
.pub-b button+button{border-left:1px solid var(--line);padding:7px 9px}
.iconb{background:none;border:0;padding:6px;border-radius:6px;color:var(--mut)}
.iconb:hover{background:var(--side)}
.seg3{display:flex;background:#ececef;border-radius:8px;padding:3px;position:absolute;left:50%;transform:translateX(-50%);top:62px;z-index:3}
.seg3 button{border:0;background:none;padding:6px 14px;border-radius:6px;color:var(--mut)}
.seg3 button[aria-current="page"]{background:#fff;color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.canvas{position:relative;background-color:#fafafa;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:20px 20px;overflow:hidden;min-height:340px}
.first{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:10px;background:none;border:0}
.first .box{width:84px;height:84px;border:2px dashed #9a9aa5;border-radius:12px;display:grid;place-items:center;background:#fff;color:var(--mut)}
.first .box svg{width:30px;height:30px}
.first:hover .box{border-color:var(--info);color:var(--info)}
.first span{font-size:16px}
.rtools{position:absolute;right:16px;top:16px;display:grid;gap:10px}
.rtools button{width:42px;height:42px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--fg)}
.rtools button:hover{background:var(--side)}
.rtools svg,.ztools svg{width:18px;height:18px}
.ztools{position:absolute;left:18px;bottom:18px;display:flex;gap:10px}
.ztools button{width:42px;height:42px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.ztools button:hover{background:var(--side)}
.logs{border-top:1px solid var(--line);background:var(--panel)}
.logs .lh{display:flex;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--line);font-weight:500}
.logs p{text-align:center;color:var(--faint);max-width:260px;margin:26px auto}
.node{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:8px;background:none;border:0;text-align:center}
.node .sq{width:78px;height:78px;border-radius:14px 10px 10px 14px;background:#fff;border:2px solid #b7b7c0;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.08);position:relative}
.node .sq::before{content:"";position:absolute;left:-12px;top:50%;width:0;height:0}
.node .sq svg{width:34px;height:34px;color:#6b6b76}
.node .nm{font-size:12.5px;max-width:150px;color:var(--fg)}
.node.enter .sq{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.plus{position:absolute;left:calc(50% + 62px);top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:0;background:none;border:0}
.plus i{display:block;width:34px;border-top:2px solid #9a9aa5}
.plus b{width:22px;height:22px;border:2px solid #9a9aa5;border-radius:6px;display:grid;place-items:center;background:#fff;color:#6b6b76;font-weight:600;font-size:15px;line-height:1}
.execv{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);min-height:0;background:#fafafa}
.execv aside{border-right:1px solid var(--line);padding:20px;background:#fff}
.execv h3{font-size:18px;font-weight:500;margin:0 0 14px}
.execv .ar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.execv .ar i{width:16px;height:16px;border-radius:4px;background:var(--brand);display:inline-block}
.execv .none{color:var(--mut);text-align:center}
.execv .ctr{display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;padding:30px}
.execv .ctr h2{font-weight:500;font-size:22px;margin:0}

/* Painel de nodes */
.scrim{position:fixed;inset:0;background:rgba(20,20,40,.18);z-index:40}
.drawer.anim{animation:slide .22s ease-out}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,100vw);background:#fff;border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:41;padding:22px 20px;padding-right:max(20px,env(safe-area-inset-right,0px));overflow:auto}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.drawer h2{font-size:18px;margin:0 0 2px;font-weight:600}
.drawer .s{color:var(--mut);margin:0 0 16px}
.drawer .x{position:absolute;right:12px;top:12px;border:0;background:none;font-size:22px;line-height:1;color:var(--mut);padding:4px 8px;border-radius:6px}
.drawer .x:hover{background:var(--side)}
.search{width:100%;border:1px solid var(--info);border-radius:8px;padding:10px 12px;margin-bottom:12px;background:#fff;box-shadow:0 0 0 3px var(--info-soft)}
.search:focus{outline:none}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:12px 10px;position:relative}
.opt:hover{background:var(--side)}
.opt>svg{width:24px;height:24px;flex:none;color:var(--mut);margin-top:2px}
.opt b{display:block;font-weight:500;font-size:15px}
.opt span{display:block;color:var(--mut);font-size:13px;line-height:1.4}
.opt .lock{position:absolute;right:10px;top:12px;font-size:11px;font-weight:600;color:#8a5a00;background:#fff3d6;border-radius:99px;padding:1px 8px;display:flex;gap:4px;align-items:center}
.opt.locked>svg,.opt.locked b,.opt.locked span{opacity:.5}
.opt.locked .lock{opacity:1}
.opt.locked b{padding-right:150px}
.empty{color:var(--mut);padding:16px 8px}

/* Mentor */
.mentor{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;width:min(360px,calc(100vw - 32px));display:flex;gap:10px;align-items:flex-end}
.m-av{width:84px;height:84px;flex:none;background:#fff;border:2px solid var(--info);border-radius:50%;overflow:hidden;box-shadow:var(--shadow);display:grid;place-items:center}
.m-av svg{width:100%;height:100%}
.bubble .bx{position:absolute;top:4px;right:6px;border:0;background:none;font-size:22px;line-height:1;color:#b4232a;padding:2px 6px;border-radius:8px}
.bubble .bx:hover{background:#fde8e8}
.bubble.oops .who{padding-right:26px}
.bubble{position:relative;background:#fff;border:2px solid var(--info);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow);min-width:0;flex:1}
.bubble::after{content:"";position:absolute;right:-9px;bottom:26px;width:14px;height:14px;background:#fff;border-right:2px solid var(--info);border-top:2px solid var(--info);transform:rotate(45deg)}
.bubble.oops{border-color:#e5484d;background:#fff6f6}
.bubble.oops::after{background:#fff6f6;border-color:#e5484d}
.bubble.good{border-color:var(--ok);background:#f2fcf7}
.bubble.good::after{background:#f2fcf7;border-color:var(--ok)}
.bubble .who{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--info);margin-bottom:2px}
.bubble.oops .who{color:#c4262b}
.bubble.good .who{color:#0b7a47}
.bubble p{margin:0;font-size:13.5px;line-height:1.45}
.goalbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
.goalbox .gl{font-size:13px;color:var(--mut);font-weight:600}
.gchip{border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.gchip:hover{border-color:var(--info)}
.gchip.on{background:var(--info);border-color:var(--info);color:#fff}
.win .card.plan{text-align:left;max-width:560px;max-height:92vh;overflow:auto}
.win .card.plan h2,.win .card.plan label,.win .card.plan p,.win .card.plan div{text-align:left}
.plan .pll .plh{display:block;font-size:12.5px;font-weight:400;color:var(--mut);margin:2px 0 4px;line-height:1.4}
.plan .pmr{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:8px;background:#fafafa}
.plan .pmn{flex:0 0 108px;font-weight:700;font-size:13px;color:#b45309;background:#fff1e6;border-radius:6px;padding:3px 8px;text-align:center}
.plan .pma{color:var(--faint);padding-top:3px}
.plan .pmr b{display:block;font-size:13.5px}
.plan .pmr span:last-child,.plan .pmr div span{display:block;font-size:13px;color:var(--mut)}
.plan .pdr{border-top:1px solid var(--line);padding:8px 0}
.plan .pdr b{display:block;font-size:12.5px;color:var(--mut);font-weight:600}
.plan .pdr span{display:block;font-size:14px;color:var(--fg);margin-top:2px}
.plan .plm{color:#0b7a47;font-weight:600}

.plan .pls{font-size:13px;color:var(--mut);margin:4px 0 10px}
.plan .pll{display:block;font-size:13px;font-weight:600;margin-top:10px}
.plan .pll input{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-weight:400}
.plan .plb{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.bubble .typ{color:#e8590c;font-weight:700;background:#fff1e6;border-radius:5px;padding:0 4px}
.bubble .acts{display:flex;gap:8px;margin-top:8px}
.bubble .acts button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 9px;font-size:12px;color:var(--mut)}
.m-av[data-mood="talk"] svg{animation:bob .9s ease-in-out 3}
.m-av[data-mood="think"] svg{animation:tilt 1.6s ease-in-out 2}
.m-av[data-mood="cheer"] svg{animation:jump .55s ease-in-out 4}
.m-av[data-mood="oops"] svg{animation:shake .5s ease-in-out 2}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes tilt{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes jump{50%{transform:translateY(-12px) scale(1.05)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

/* Marca Agente3D */
:root{--bo:#e8761a;--bgreen:#0b7a3b}
.card{position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--bo),var(--bgreen))}
.blogo{height:46px;width:auto;flex:none}
.side .blogo{height:30px}
.center .btn{background:var(--bo)}
.center .btn:hover{background:#cf6710}
.center .btn:disabled{background:var(--line)}
/* Nodes no canvas */
.node{gap:0}
.node .nm{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:170px;line-height:1.3}
.node.l{left:calc(50% - 120px)}
.node.r{left:calc(50% + 120px)}
.plus.r{left:calc(50% + 160px)}
.wire{position:absolute;left:calc(50% - 81px);top:50%;width:162px;border-top:2px solid #9a9aa5}
.ck{position:absolute;right:-9px;top:-9px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center}
/* Node aberto */
.nv{position:fixed;inset:0;z-index:45;background:#fff;display:grid;grid-template-rows:auto minmax(0,1fr)}
.nvh{display:flex;align-items:center;gap:10px;padding:10px 18px;padding-left:max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.nvh svg{width:22px;height:22px;color:var(--info)}
.nvh b{font-weight:500;font-size:16px}
.nvh .sp,.mtabs .sp,.ph .sp{flex:1}
.nvh .docs{color:var(--mut);font-size:13px}
.nvh .nx{border:0;background:none;font-size:24px;line-height:1;padding:2px 8px;border-radius:6px;color:var(--fg)}
.nvh .nx:hover{background:var(--side)}
.nvb{display:grid;grid-template-columns:minmax(0,28fr) minmax(0,42fr) minmax(0,30fr);min-height:0}
.nvin,.nvout,.nvmid{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:auto}
.nvin{background:#f5f5f6;border-right:1px solid var(--line)}
.nvout{background:#f5f5f6;border-left:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:52px}
.ph .pt{letter-spacing:.18em;font-size:13px;color:var(--mut);font-weight:500}
.ph .ps{display:flex;align-items:center;gap:8px;margin-left:auto}
.ph .ps svg{width:17px;height:17px;color:var(--mut)}
.ph .okc{color:var(--ok);font-weight:700}
.seg{display:inline-flex;background:#e6e6ea;border-radius:8px;padding:3px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;color:var(--mut);font-size:13px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.nodata{margin:auto;display:grid;justify-items:center;gap:10px;text-align:center;color:var(--mut);padding:24px}
.nodata svg{width:22px;height:22px}
.nodata b{font-size:18px;font-weight:500}
.btn.xs{padding:8px 14px;font-size:14px;background:var(--brand)}
.btn.xs:hover{background:var(--brand-d)}

var VZS={last:'',at:0,voices:[]};

function ptVoices(){var v=vzOK()?speechSynthesis.getVoices():[];return v.filter(function(x){return /^pt/i.test(x.lang);});}
if(vzOK()){try{speechSynthesis.addEventListener('voiceschanged',function(){VZS.voices=ptVoices();});}catch(e){}VZS.voices=ptVoices();}
var FEMRX=/francisca|maria|luciana|fernanda|vit[oó]ria|camila|thalita|leticia|helena|joana|raquel|google portugu[eê]s do brasil|female|feminin/i,MASCRX=/antonio|ant[oô]nio|daniel|felipe|ricardo|donato|jorge|paulo|jo[aã]o|julio|male\b|masculin/i;
function vScore(v){var n=v.name,sc=0;if(/pt[-_]BR/i.test(v.lang))sc+=10;if(/natural|neural|online/i.test(n))sc+=8;if(/google/i.test(n))sc+=3;if(/microsoft/i.test(n))sc+=2;return sc;}
function pickVoice(g){
  var chosen=g==='m'?S.vm:S.vf;
  if(chosen&&vzOK()){var c=speechSynthesis.getVoices().filter(function(v){return v.name===chosen;})[0];if(c)return {v:c,shift:1};}
  var vs=ptVoices();if(!vs.length)return null;
  var rx=g==='m'?MASCRX:FEMRX,okv=vs.filter(function(v){return rx.test(v.name);}).sort(function(a,b){return vScore(b)-vScore(a);});
  if(okv.length)return {v:okv[0],shift:1};
  var best=vs.slice().sort(function(a,b){return vScore(b)-vScore(a);})[0];
  return {v:best,shift:g==='m'?0.78:1};
}
function vzClean(t){
  return String(t).replace(/\{\{\s*([\s\S]*?)\s*\}\}/g,function(_,ex){if(!ex.trim())return ' ';return ' chaves duplas, '+ex.replace(/\$json/g,'json').replace(/\[(\d+)\]/g,' posição $1 ').replace(/\./g,' ponto ')+', fecha chaves, ';}).replace(/["“”]/g,'').replace(/\s+/g,' ');
}
function speakText(text,g,p,r){
  if(!vzOK())return;
  var pv=pickVoice(g||'f');
  try{speechSynthesis.cancel();}catch(e){}
  var u=new SpeechSynthesisUtterance(vzClean(text));u.lang='pt-BR';
  if(pv)u.voice=pv.v;
  u.pitch=Math.max(0.1,Math.min(2,(p||1)*(S.vp||1)*(pv?pv.shift:1)));u.rate=Math.max(0.5,Math.min(1.6,(r||1)*(S.vr||1)));
  var cl=vzClean(text);
  u.onboundary=function(ev){if(NAR.t&&cl.length&&typeof ev.charIndex==='number'&&ev.charIndex>0)NAR.bp=Math.min(1,ev.charIndex/cl.length);};
  u.onstart=function(){if(NAR.t&&NAR.bp<0)NAR.t0=Date.now();};
  try{speechSynthesis.speak(u);}catch(e){}
}
function speakMentor(text){
  if(!S.voice||!vzOK()||S.av<0)return;
  var now=Date.now();if(text===VZS.last&&now-VZS.at<20000)return;
  VZS.last=text;VZS.at=now;
  var a=AVS[S.av];speakText(text,a.g,a.p,a.r);
}
function toggleVoice(){

}

var ghostLast={sel:'',t:0},ghostEls=[];
function ghostClear(){ghostEls.forEach(function(g){try{g.remove();}catch(e){}});ghostEls=[];}
function ghostHand(sel){
  ghostClear();

var NAR={t:null,text:'',cues:[],i:0,t0:0,bp:-1,hand:null,hl:null,hlT:null,hideT:null,last:'',lastAt:0};
function narrClearHl(){clearTimeout(NAR.hlT);if(NAR.hl){NAR.hl.classList.remove('nar-hl');NAR.hl=null;}}
function narrStop(){
  clearInterval(NAR.t);NAR.t=null;clearTimeout(NAR.hideT);narrClearHl();
  if(NAR.hand){var h=NAR.hand;NAR.hand=null;h.style.opacity='0';setTimeout(function(){try{h.remove();}catch(e){}},500);}
  NAR.text='';NAR.cues=[];NAR.bp=-1;
}
function narrStart(text,cues){
  if(NAR.text===text&&NAR.t)return;
  var now=Date.now();
  if(NAR.last===text&&now-NAR.lastAt<20000)return;
  narrStop();
  if(!cues||!cues.length||S.hand===false||S.mute)return;
  var c=cues.map(function(x){return {sel:x.sel,at:text.indexOf(x.k)};}).filter(function(x){return x.at>=0;}).sort(function(a,b){return a.at-b.at;});
  if(!c.length)return;
  NAR.last=text;NAR.lastAt=now;
  NAR.text=text;NAR.cues=c;NAR.i=0;NAR.t0=now;NAR.bp=-1;
  NAR.t=setInterval(narrTick,120);
}
function narrTick(){
  var n=NAR.text.length||1,pos;
  if(S.voice&&NAR.bp>=0)pos=NAR.bp*n;
  else{var rate=S.voice?14*((S.vr||1)):12;pos=(Date.now()-NAR.t0)/1000*rate;}
  while(NAR.i<NAR.cues.length&&pos+3>=NAR.cues[NAR.i].at){narrPoint(NAR.cues[NAR.i].sel);NAR.i++;}
  if(NAR.i>=NAR.cues.length&&!NAR.hideT){
    NAR.hideT=setTimeout(function(){var rs=ringSel&&ringSel[0];narrStop();if(rs)setTimeout(function(){ghostHand(rs);},300);},3200);
  }
}
function narrPoint(sel){
  var el;try{el=$(sel);}catch(e){el=null;}
  if(!el)return;
  var r=el.getBoundingClientRect();
  if(r.width<2||r.height<2||r.bottom<0||r.top>innerHeight)return;
  var cx=r.left+Math.min(r.width/2,90),cy=r.top+Math.min(r.height/2,22);
  var first=!NAR.hand;
  if(first){
    var h=document.createElement('div');h.className='ghost-hand nar';h.setAttribute('aria-hidden','true');h.innerHTML=HANDSVG;
    h.style.left=(cx-17+60)+'px';h.style.top=(cy-6+50)+'px';document.body.appendChild(h);NAR.hand=h;
    requestAnimationFrame(function(){requestAnimationFrame(function(){if(NAR.hand===h){h.style.left=(cx-17)+'px';h.style.top=(cy-6)+'px';h.style.opacity='.95';}});});
  }else{NAR.hand.style.left=(cx-17)+'px';NAR.hand.style.top=(cy-6)+'px';NAR.hand.style.opacity='.95';}
  var hand=NAR.hand;
  setTimeout(function(){
    if(NAR.hand!==hand)return;
    narrClearHl();el.classList.add('nar-hl');NAR.hl=el;
    NAR.hlT=setTimeout(narrClearHl,2200);
    if(document.body.animate){
      var rip=document.createElement('div');rip.className='ghost-rip';rip.style.left=(cx-18)+'px';rip.style.top=(cy-18)+'px';document.body.appendChild(rip);
      var an=rip.animate([{opacity:.8,transform:'scale(.3)'},{opacity:0,transform:'scale(1.7)'}],{duration:700,easing:'ease-out'});an.onfinish=function(){rip.remove();};
    }
  },first?900:850);
}

function hl(t){
  var s=esc(t);
  s=s.replace(/\b(escreva|digite)(\s+)(?!o\b|a\b|os\b|as\b|no\b|na\b|um\b|uma\b|\{\{)([\w\u00C0-\u00FF]+)/gi,function(m,v,sp,w){return v+sp+'<span class="typ">'+w+'</span>';});
  s=s.replace(/\be(\s+)(pago)(\s+\(segundo)/g,function(m,a,w,b){return 'e'+a+'<span class="typ">'+w+'</span>'+b;});
  s=s.replace(/\{\{[^}]*\}\}/g,function(m){return '<span class="typ">'+m+'</span>';});
  s=s.replace(/\[\[([^\]]+)\]\]/g,function(m,w){return '<span class="typ">'+w+'</span>';});
  return s;
}
function say(text,kind,mood,keepMs,cues){
  if(S.av<0){narrStop();mentorEl.classList.add('hidden');return;}
  var a=AVS[S.av];
  mentorEl.classList.remove('hidden');
  mentorEl.innerHTML='<div class="m-av" id="mav" data-mood="idle"><svg viewBox="0 0 120 120" role="img" aria-label="'+esc(a.n)+'">'+a.s+'</svg></div><div class="bubble '+(kind||'')+'"><div class="who">'+esc(a.n)+'</div><p></p>'+'<button type="button" class="vz'+(S.voice?' on':'')+'" data-act="voz" aria-pressed="'+S.voice+'" aria-label="Voz do mentor" title="Ligar ou desligar a voz">'+vzIcon()+'</button><button type="button" class="bm" aria-label="Minimizar o mentor" title="Minimizar (clique no mentor para abrir de novo). Arraste pelo nome para mover.">&minus;</button>'+(kind==='oops'?'<button type="button" class="bx" data-act="bclose" aria-label="Fechar aviso">&times;</button>':'')+'</div>';
  $('.bubble p',mentorEl).innerHTML=hl(text);
  if(kind==='oops')MM.min=false;else if(MM.min&&MM.last!==text)MM.unread=true;
  MM.last=text;mentorApply();
  if(NAR.text!==text)narrStop();
  if(cues)NAR.bp=-1;
  speakMentor(text);
  if(cues)narrStart(text,cues);
  var av=$('#mav');
  requestAnimationFrame(function(){av.dataset.mood=mood||'talk';});
  clearTimeout(moodTimer);moodTimer=setTimeout(function(){var x=$('#mav');if(x)x.dataset.mood='idle';},2600);
  clearTimeout(hintTimer);
  if(keepMs){hintTimer=setTimeout(guide,keepMs);}
}

function arrowClean(x,y){
  var S2=24,pad=3;
  if(x<2||y<2||x+S2>innerWidth-2||y+S2>innerHeight-2)return false;
  var bx=x-pad,by=y-pad,bw=S2+pad*2,bh=S2+pad*2;
  function hit(r){return r.width>0&&r.height>0&&r.left<bx+bw&&r.right>bx&&r.top<by+bh&&r.bottom>by;}
  var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null),n,rg=document.createRange();
  while((n=w.nextNode())){
    if(!n.nodeValue.trim())continue;
    var p=n.parentNode;if(!p||/SCRIPT|STYLE/.test(p.nodeName))continue;
    var cs=getComputedStyle(p);if(cs.visibility==='hidden'||cs.display==='none')continue;
    rg.selectNodeContents(n);var rs=rg.getClientRects();
    for(var k=0;k<rs.length;k++)if(hit(rs[k]))return false;
  }
  var pts=[[bx+2,by+2],[bx+bw-2,by+2],[bx+2,by+bh-2],[bx+bw-2,by+bh-2],[x+S2/2,y+S2/2]];
  for(var m=0;m<pts.length;m++){
    var el=document.elementFromPoint(pts[m][0],pts[m][1]);
    if(!el)return false;
    if(el.closest&&el.closest('button,input,img,svg,.sq,.node,.avopt,.tg,.selx,.mentor,#mentor,.bubble,.m-av'))return false;
  }
  return true;
}
var ringSel=null,ringEls=[];
function pulse(sel){
  ringSel=sel?String(sel).split('|'):null;
  ghostClear();
  ringEls.forEach(function(r){r.remove();if(r._a)r._a.remove();});ringEls=[];
  document.querySelectorAll('.ringed').forEach(function(x){x.classList.remove('ringed');});
  if(!ringSel)return;
  ringSel.forEach(function(){
    var d=document.createElement('div');
    d.innerHTML='<svg class="ring" aria-hidden="true"><ellipse pathLength="1"></ellipse><rect pathLength="1" rx="14"></rect></svg>';
    var r=d.firstChild;document.body.appendChild(r);ringEls.push(r);
    var ar=document.createElement('div');ar.className='parr';ar.setAttribute('aria-hidden','true');ar.innerHTML='<svg viewBox="0 0 20 20" width="20" height="20"><path d="M10 17V4M4 10l6-6 6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';document.body.appendChild(ar);r._a=ar;
  });
  placeRing();
  setTimeout(function(){if(ringSel&&ringSel[0]===String(sel).split('|')[0])ghostHand(ringSel[0]);},350);
}
function placeRing(){
  if(!ringSel)return;
  if(document.querySelector('.win.ficha')){ringEls.forEach(function(r){r.style.display='none';if(r._a)r._a.style.display='none';});ghostClear();return;}
  ringSel.forEach(function(sel,k){
    var ringEl=ringEls[k];if(!ringEl)return;
    var el=$(sel);
    if(!el){ringEl.style.display='none';ringEl._a.style.display='none';return;}
    var r=el.getBoundingClientRect();
    if(r.width<2||r.height<2||r.bottom<0||r.top>window.innerHeight){ringEl.style.display='none';ringEl._a.style.display='none';return;}
    var wide=r.width/r.height>4,W,H;
    if(wide){W=r.width+18;H=r.height+16;}else{W=r.width*1.42+22;H=r.height*1.42+22;}
    var inp=el.matches&&el.matches('.f-name,.f-val');
    if(inp){W=r.width+18;H=r.height+16;wide=true;}
    var el1=ringEl.querySelector('ellipse'),el2=ringEl.querySelector('rect');
    ringEl.style.display='block';ringEl.style.transform=wide?'none':'';if(inp)el.classList.add('ringed');
    var A=ringEl._a,gx=(W-r.width)/2,gy=(H-r.height)/2,key=[r.left,r.top,r.width,r.height,innerWidth].map(Math.round).join(',');
    A.style.display='block';
    if(A._k!==key){
      A._k=key;
      var cx=r.left+r.width/2-12,cy=r.top+r.height/2-12,cand=[];
      [6,22,40].forEach(function(g){cand.push(
        {c:'',x:r.left-gx-24-g,y:cy},{c:'dn',x:cx,y:r.top-gy-24-g},{c:'rt',x:r.right+gx+g,y:cy},{c:'up',x:cx,y:r.bottom+gy+g});});
      var pick=cand[0];
      for(var q=0;q<cand.length;q++){if(arrowClean(cand[q].x,cand[q].y)){pick=cand[q];break;}}
      A.className='parr '+pick.c;A.style.left=pick.x+'px';A.style.top=pick.y+'px';
    }
    ringEl.style.left=(r.left+r.width/2-W/2)+'px';ringEl.style.top=(r.top+r.height/2-H/2)+'px';
    ringEl.setAttribute('width',W);ringEl.setAttribute('height',H);ringEl.setAttribute('viewBox','0 0 '+W+' '+H);
    if(wide){el1.style.display='none';el2.style.display='block';el2.setAttribute('x',3);el2.setAttribute('y',3);el2.setAttribute('width',W-6);el2.setAttribute('height',H-6);}
    else{el2.style.display='none';el1.style.display='block';el1.setAttribute('cx',W/2);el1.setAttribute('cy',H/2);el1.setAttribute('rx',W/2-3);el1.setAttribute('ry',H/2-3);}
  });
}

function guide(){
  if(!S.logged||S.av<0||tour.on)return;
  if(V.view==='m21'){m21Guide();return;}
  if(V.view==='m2'){m2Guide();return;}
  if(V.view==='m3'){m3Guide();return;}
  if(V.view==='m4'){m4Guide();return;}
  var n=S.name;
  if(V.view==='list'){
    if(!S.won){say('Oi, '+n+'! Missão de hoje: criar o seu primeiro workflow. Clique no botão laranja "Create workflow".','','talk');pulse('#btnCreate');}
    else{say('O seu workflow do Mundo 1 já está na lista. Para praticar a Missão 1.1, clique em Create workflow (ou no próprio workflow) e use o + depois do gatilho.','good','cheer');pulse('');}
  }else if(V.view==='editor'){
    if(V.tab==='executions'){say('Aqui ficam os resultados de cada execução. Como o workflow ainda está vazio, não tem nada. Volte para a aba Editor.','','think');pulse('#tabEditor');}
    else if(V.panel==='next'){say('Boa! Agora escolha "Edit Fields". É o node que cria ou muda campos nos seus dados.','','talk');pulse('#opt-edit');}
    else if(V.panel){say('Todo workflow começa por um gatilho (trigger), o que faz ele disparar. Escolha "Trigger manually": ele roda quando você clica em um botão.','','talk');pulse('#opt-manual');}
    else if(!V.trig){say('Este é o editor, a tela onde você monta os workflows. Está vazio. Clique em "Add first step…" para escolher o primeiro passo.','','talk');pulse('#addFirst');}
    else guideEd();
  }
}

var NAV={h:[],i:-1,busy:false},NKEYS=['view','tab','panel','trig','sel','q','ed','ed2','m21','m2','nv','flow','wfn'];
function navCurKey(){return !V.cur?'':V.cur===V.ed?'ed':V.cur===V.ed2?'ed2':(V.m21&&V.cur===V.m21.ed)?'m21ed':'x';}
function navKey(){var a=V.m21,b=V.m2;return [V.view,V.tab,V.panel,V.nv,V.trig,navCurKey(),a?[a.trig,a.panel,a.wOpen,!!a.ed].join(','):'',b?[b.mis,b.part,b.panel,b.open].join(','):''].join('|');}
function navSnap(){var o={};NKEYS.forEach(function(k){if(V[k]!==undefined)o[k]=V[k];});var ck=navCurKey();return {k:navKey(),c:ck,d:JSON.stringify(o)};}
function navApply(sn){
  var o=JSON.parse(sn.d);NKEYS.forEach(function(k){delete V[k];});
  Object.keys(o).forEach(function(k){V[k]=o[k];});
  V.cur=sn.c==='ed'?V.ed:sn.c==='ed2'?V.ed2:sn.c==='m21ed'&&V.m21?V.m21.ed:null;
  V.fresh=false;V.flow=false;
  var w=document.querySelectorAll('.win.ficha,.scrim');for(var i=0;i<w.length;i++)w[i].remove();
}
function navAfter(){
  if(NAV.busy){navBtns();return;}
  var ok=S.logged&&S.av>=0&&S.name;
  if(!ok){NAV.h=[];NAV.i=-1;navBtns();return;}
  if(V.view==='home'){NAV.h=[navSnap()];NAV.i=0;navBtns();return;}
  var k=navKey(),cur=NAV.h[NAV.i];
  if(cur&&cur.k===k){NAV.h[NAV.i]=navSnap();}
  else{NAV.h=NAV.h.slice(0,NAV.i+1);NAV.h.push(navSnap());NAV.i=NAV.h.length-1;}
  navBtns();
}
function navGo(d){
  var j=NAV.i+d;if(j<0||j>=NAV.h.length)return;
  if(NAV.h[NAV.i])NAV.h[NAV.i]=navSnap();
  NAV.i=j;NAV.busy=true;
  try{try{pulse('');}catch(e){}navApply(NAV.h[j]);route();}finally{NAV.busy=false;}
  navBtns();
}
function navBtns(){
  var el=document.getElementById('navb');
  if(!el){el=document.createElement('div');el.id='navb';el.className='navb';el.innerHTML='<button type="button" id="navBack" class="nb-back" aria-label="Voltar para a tela anterior"><span aria-hidden="true">&larr;</span><b>Voltar</b></button><button type="button" id="navFwd" class="nb-fwd" aria-label="Próximo: só até a tela onde você estava"><b>Próximo</b><span aria-hidden="true">&rarr;</span></button>';document.body.appendChild(el);
    el.addEventListener('click',function(ev){var t=ev.target.closest('button');if(!t||t.disabled)return;navGo(t.id==='navBack'?-1:1);});}
  var back=NAV.i>0,fwd=NAV.i>=0&&NAV.i<NAV.h.length-1;
  var bb=el.querySelector('#navBack'),bf=el.querySelector('#navFwd');
  bb.disabled=!back;bf.disabled=!fwd;
  bf.title=fwd?'Avançar até a tela onde você estava':'Só libera depois que você voltar';
  var course=S.logged&&S.av>=0&&S.name&&V.view!=='home'&&NAV.i>=0;
  el.hidden=!course||!!document.querySelector('.win,.blk,.gp');
  try{
    var m=document.querySelector('#mentor .bubble')||mentorEl,r=m.getBoundingClientRect(),ar=mentorEl.getBoundingClientRect();
    var top=Math.min(r.top,ar.top);if(top>0&&!el.hidden){el.style.bottom=(innerHeight-top+8)+'px';el.style.right=(Math.max(16,innerWidth-Math.max(r.right,ar.right))+(document.querySelector('.logs')?64:0))+'px';}
  }catch(e){}
}
setInterval(function(){if(document.getElementById('navb'))navBtns();},400);
function route(){route0();navAfter();}

  if(S.av<0||!S.name){onboardView();return;}
  if(V.view==='home'){homeView();return;}

function startWorldQuiz(n){
  var cfg=QCFG[n];if(!cfg)return;

  function ask(){
    var q=qs[cur];
    w.innerHTML='<div class="card"><div class="qk">'+esc(cfg.label)+' · Pergunta '+(cur+1)+' de '+N+'</div><div class="qbar"><i style="width:'+(cur/N*100)+'%"></i></div><h2></h2><div class="qopts"></div><div class="qfb" hidden></div></div>';
    $('h2',w).textContent=q.q;
    q.o.forEach(function(t,i){var b=document.createElement('button');b.type='button';b.className='qo';b.innerHTML='<b>'+'ABCD'.charAt(i)+'</b><span></span>';$('span',b).textContent=t;b.addEventListener('click',function(){pick(i);});$('.qopts',w).appendChild(b);});
    $('.qo',w).focus();
  }
  function pick(i){
    var q=qs[cur],ok=i===q.c;if(ok)hits++;
    $$('.qo',w).forEach(function(b,k){b.disabled=true;if(k===q.c)b.classList.add('ok');else if(k===i)b.classList.add('no');});
    var fb=$('.qfb',w);fb.hidden=false;fb.className='qfb '+(ok?'ok':'no');
    fb.innerHTML='<b></b><p></p><button type="button" class="btn full" id="qn"></button>';
    $('b',fb).textContent=ok?'Certo!':'Quase. A resposta certa está em verde.';$('p',fb).textContent=q.e;
    $('#qn',fb).textContent=cur<N-1?'Próxima pergunta':'Ver resultado';
    $('#qn',fb).addEventListener('click',function(){if(cur<N-1){cur++;ask();}else result();});
    $('#qn',fb).focus();
  }
  function result(){
    var pass=hits>=cfg.pass,first=pass&&!S[cfg.flag];
    if(first){S[cfg.flag]=true;S.xp=(S.xp||0)+cfg.xp;}
    if(pass&&cfg.final){if(!S.cert)S.cert={code:certCode(hits),date:new Date().toISOString().slice(0,10),hits:hits,total:N};else if(hits>S.cert.hits){S.cert.hits=hits;}}
    save();
    if(pass&&(n===2||n===3)){w.remove();resumoWin({hits:hits,N:N,first:first,xp:cfg.xp,n:n});return;}
    w.innerHTML='<div class="card"><svg class="badge" viewBox="0 0 68 68" aria-hidden="true"><circle cx="34" cy="34" r="32" fill="'+(pass?'#5b4ee8':'#e8761a')+'"/><path d="'+(pass?'M20 35l9 9 19-21':'M24 24l20 20M44 24L24 44')+'" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><h2></h2><div class="xp"></div><p class="mut" style="margin:10px 0 16px"></p>'+(pass&&cfg.final?'<button class="btn full" type="button" id="qc">Ver meu certificado</button>':'')+'<button class="btn '+(pass&&cfg.final?'ghost ':'')+'full" type="button" id="qr" style="margin-top:8px"></button><button class="btn ghost full" type="button" id="qh" style="margin-top:8px">Voltar ao início do curso</button><button class="btn ghost full" type="button" id="qx" style="margin-top:8px">Fechar</button></div>';
    $('h2',w).textContent=pass?cfg.title:'Faltou pouco!';
    $('.xp',w).textContent=hits+' de '+N+' acertos'+(first?' · +'+cfg.xp+' XP · Total '+S.xp+' XP':'');
    $('p',w).textContent=pass?(first?cfg.ok:cfg.okAgain):cfg.bad;
    $('#qr',w).textContent=pass?'Refazer o quiz':'Tentar de novo';
    $('#qr',w).addEventListener('click',function(){startWorldQuiz(n);});
    $('#qh',w).addEventListener('click',function(){w.remove();V.view='home';V.nv=false;route();});
    $('#qx',w).addEventListener('click',function(){w.remove();route();});
    var qc=$('#qc',w);if(qc)qc.addEventListener('click',function(){w.remove();certWin();});
    if(pass){fireworks(first?5:3);addSnd(w);say(first?'Parabéns, '+S.name+'! '+(cfg.final?'Você concluiu o curso.':cfg.title):'Boa, '+S.name+'!','good','cheer');}
    else say('Faltou pouco, '+S.name+'. Revise e tente de novo!','','think');
    (qc||$('#qr',w)).focus();
  }
  ask();
}

function certCode(h){
  var str=(CL&&(CL.sid||CL.uid)||'')+'|'+(S.name||'')+'|'+Date.now()+'|'+h,x=2166136261;
  for(var i=0;i<str.length;i++){x^=str.charCodeAt(i);x=Math.imul(x,16777619)>>>0;}
  return 'A3D-'+x.toString(36).toUpperCase().padStart(7,'0').slice(0,7);
}

function nrm(t){return ' '+String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9{}$]+/g,' ')+' ';}
function tapLink(){var c=tutorCtx(),k=c==='quiz'?'q1':c,h=apHref(k)||(window.CURSO?(CURSO.apostila||'apostila.html'):'');return h?'<a class="tbk" href="'+h+'" target="_blank" rel="noopener">Ver na apostila</a>':'';}
function tutorCtx(){
  if(V.view==='m21')return 'm21';
  if(V.view==='m2'&&V.m2)return (V.m2.mis==='23'||V.m2.mis==='24')?'m23':'m22';
  if(V.view==='m3'&&V.m3)return 'm'+V.m3.mis;
  if(V.view==='m4'&&V.m4)return 'm'+V.m4.mis;
  if(V.nv&&V.cur)return V.cur.mission==='13'?'m13':V.cur.mission==='12'?'m12':'m11';
  return !S.m11?'m11':!S.m12?'m12':!S.m13?'m13':'quiz';
}
function tutorMatch(text){
  var t=nrm(text),best=null,bs=0,c=tutorCtx(),order=[c,'geral','m11','m12','m13','m21','m22','m23','m31','m32','m33','m41','m42','m43','quiz'].filter(function(x,i,a){return a.indexOf(x)===i;});
  order.forEach(function(key){TFAQ[key].forEach(function(it){
    var sc=0;it.k.forEach(function(w){var kw=nrm(w).trim();if(kw&&t.indexOf(kw)>-1)sc++;});
    if(sc>bs){bs=sc;best=it;}
  });});
  return bs>0?best:null;
}

function tutorDiagnose(){
  var L=[],nx='',bp=$('.bubble p',mentorEl),bt=bp?bp.textContent:'';
  function quizOrDone(){return !S.q1?'Falta o quiz do Mundo 1. Clique em "Fazer o quiz do Mundo 1" no balão do mentor.':'O Mundo 1 está concluído. Você pode refazer o quiz ou voltar ao início do curso.';}
  if(V.view==='home'){L.push('Você está na tela de boas-vindas, vendo o sumário.');nx='Clique em "'+((S.m11||S.m12||S.m13)?'Continuar de onde parei':'Começar o curso')+'".';}
  else if(V.view==='m2'&&V.m2){var h2=m2Hint();L.push('Você está na Missão '+(V.m2.mis==='23'?'2.3 (If e Switch)':'2.2 (HTTP Request e Merge)')+'.');nx=h2.s||'Clique em Concluir a missão.';}
  else if(V.view==='m4'&&V.m4){var h4=m4Hint();L.push('Você está na Missão '+V.m4.mis.charAt(0)+'.'+V.m4.mis.charAt(1)+' ('+({'41':'Seu primeiro Agente de IA','42':'Memória e saída estruturada','43':'Projeto final'}[V.m4.mis])+').');nx=h4.s||'Clique em Concluir a missão.';}
  else if(V.view==='m3'&&V.m3){var h3=m3Hint();L.push('Você está na Missão '+V.m3.mis.charAt(0)+'.'+V.m3.mis.charAt(1)+' ('+({'31':'Erros e alertas','32':'Loop Over Items','33':'Sub-workflows'}[V.m3.mis])+').');nx=h3.s||'Clique em Concluir a missão.';}
  else if(V.view==='m21'){var mm=V.m21||{},ww=mm.wp||{};L.push('Você está na Missão 2.1 (Webhooks).');
    if(!mm.trig){L.push('Ainda não escolheu o gatilho.');nx='Clique em "Add first step…" e escolha "On webhook call".';}
    else if(mm.wOpen){L.push('O node Webhook está aberto.');if(ww.method!=='POST')L.push('O HTTP Method está '+ww.method+', mas o site envia com POST.');if(ww.path.trim()!=='pedido')L.push('O Path precisa ser pedido.');if(ww.got)nx='Veja o Output e feche o node no X.';else if(ww.listen)nx='Clique em "Enviar pedido de teste", no cartão do site.';else nx=(ww.method!=='POST'?'Troque o Method para POST.':ww.path.trim()!=='pedido'?'Escreva pedido no Path.':'Clique em Listen for test event.');}
    else if(!ww.got){nx='Dê dois cliques no node Webhook para abrir.';}
    else if(!mm.ed){nx='Clique no + para ligar o Edit Fields.';}
    else if(V.nv&&V.cur){var ee=V.cur;if(!ee.fields.length)nx='Clique em Add Field.';else{L.push('Campo: nome "'+ee.fields[0].n+'", valor "'+ee.fields[0].v+'".');nx='O nome deve ser cliente e o valor {{ $json.body.cliente }}. Depois clique em Execute step.';}}
    else nx='Dê dois cliques no Edit Fields.';}
  else if(V.view==='list'){L.push('Você está na lista de workflows (Overview).');L.push(S.mine?'O seu workflow "'+WFN+'" já existe.':'Você ainda não criou o workflow do Mundo 1.');nx=S.mine?'Clique no workflow "'+WFN+'" para abrir.':'Clique no botão laranja "Create workflow", no alto da tela.';}
  else if(V.view==='editor'&&V.nv&&V.cur){
    var e=V.cur,ms=e.mission==='13'?'1.3':e.mission==='12'?'1.2':'1.1';
    L.push('Você está com um node aberto, na Missão '+ms+'.');
    L.push(e.inputRan?'O Input já recebeu dados.':'O Input ainda está vazio.');
    if(!e.fields.length)L.push('Ainda não existe nenhum campo no Edit Fields.');
    e.fields.forEach(function(x,i){
      var nm=String(x.n).trim(),vl=String(x.v).trim(),p='Campo '+(i+1)+': ';
      if(!nm&&!vl){L.push(p+'está em branco. O quadro de cima é o NOME e o de baixo é o VALOR.');return;}
      if(!nm){L.push(p+'falta o NOME (quadro de cima). O valor "'+vl+'" já está lá.');return;}
      if(!vl){L.push(p+'o nome "'+nm+'" está certo, mas falta o VALOR (quadro de baixo).');return;}
      var r=evalVal(x.v,e.data),ok=true,msg='';
      if(ms==='1.1'){ok=nm==='nome'&&vl==='Maria';msg=ok?'':'Para esta missão o nome deve ser nome e o valor Maria, tudo igual, com letra minúscula no nome e M maiúsculo em Maria.';}
      else if(ms==='1.2'){var okV=['11 99999-1234','Elétrica X1','capacete'];
        if(r.expr&&r.undef){ok=false;msg='A expressão não achou nada. Confira a escrita, com {{ }}, o $json e o caminho, sem letra trocada.';}
        else if(!r.expr){ok=false;msg='Você digitou um texto fixo. Aqui o valor tem que vir do Input, com uma expressão {{ $json... }}.';}
        else if(okV.indexOf(r.text)<0){ok=false;msg='Essa expressão funciona, mas pega um dado que a missão não pediu (telefone, modelo ou primeiro acessório).';}}
      else{var t=x.t||'string';
        if(nm==='valor'){ok=vl==='{{ $json.valor }}'&&t==='number';msg=ok?'':(vl!=='{{ $json.valor }}'?'O valor deve ser {{ $json.valor }}. ':'')+(t!=='number'?'O tipo está como '+t+'. Troque para Number, no seletor à direita do nome.':'');}
        else if(nm==='pago'){ok=vl==='{{ $json.pago }}'&&t==='boolean';msg=ok?'':(vl!=='{{ $json.pago }}'?'O valor deve ser {{ $json.pago }}. ':'')+(t!=='boolean'?'O tipo está como '+t+'. Troque para Boolean.':'');}
        else{ok=false;msg='Nesta missão os nomes são valor e pago.';}}
      L.push(p+nm+' = '+vl+(ok?'  (certo)':'  (ajustar)')+(msg?'\n   '+msg:''));
    });
    if(ms==='1.3'&&e.fields.length>=2&&!e.inc)L.push('Falta ligar "Include Other Input Fields", para o cliente continuar nos dados.');
    if(e.fields.length&&!e.ran)L.push('Você ainda não clicou em Execute step.');
    if(e.ran&&e.good)L.push('Você já executou e o resultado está certo.');
    if(ms==='1.2'){var nc=nextChallenge(e);nx=nc?nc.txt:'Os três desafios estão prontos.';}
    else nx=bt||'Siga o balão do mentor.';
  }
  else if(V.view==='editor'){
    var nodes=[];if(V.trig)nodes.push('o gatilho');if(V.ed)nodes.push('o Edit Fields');if(V.ed2)nodes.push('o Edit Fields1');
    L.push('Você está no editor do workflow.');
    L.push(nodes.length?'Já estão no canvas: '+nodes.join(', ')+'.':'O canvas está vazio.');
    if(V.panel){L.push('O painel de nodes está aberto.');nx=V.panel==='next'?'Escolha "Edit Fields" na lista.':'Escolha "Trigger manually" na lista.';}
    else if(!V.trig)nx='Clique em "Add first step…" no meio da tela.';
    else if(!V.ed)nx='Clique no + ao lado do gatilho e escolha "Edit Fields".';
    else if(!V.ed2){nx=!S.m11?'Dê dois cliques rápidos no Edit Fields para abrir.':!S.m12?'Clique no + depois do Edit Fields para adicionar o segundo.':!S.m13?'Dê dois cliques no Edit Fields1 para abrir.':quizOrDone();}
    else nx=!S.m12?'Dê dois cliques rápidos no segundo Edit Fields para abrir.':!S.m13?'Dê dois cliques no Edit Fields1 para abrir.':quizOrDone();
    if(V.tab==='executions')nx='Você está na aba Executions. Volte para a aba Editor, no alto da tela. '+nx;
  }
  return 'O que eu vejo na sua tela:\n• '+L.join('\n• ')+'\n\nPróximo passo: '+nx;
}
function tutorChips(){
  var c=tutorCtx(),asked=TQ.msgs.filter(function(m){return m.u;}).map(function(m){return m.t;});
  var list=[{q:'Analise a minha tela',diag:true}].concat(TFAQ[c].concat(TFAQ.geral).filter(function(it){return asked.indexOf(it.q)<0;})).slice(0,6);
  return list;
}
function tutorLog(text,ok){
  if(!CL.db||!CL.uid)return;
  var id='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ref=CL.db.doc('duvidas/'+CL.uid);
  try{ref.get().then(function(sn){var d=sn.exists?sn.data():{};d[id]={sid:CL.sid||'',name:S.name||'',ctx:tutorCtx(),q:String(text).slice(0,400),ok:!!ok,at:Date.now()};return ref.set(d);}).catch(function(){});}catch(e){}
}
function tutorAnswer(text,item,fromChip){
  TQ.msgs.push({u:true,t:text});TQ.busy=true;tutorPaint();
  setTimeout(function(){
    var a;
    if(item&&item.diag)a=tutorDiagnose();
    else if(item)a=item.a;
    else{
      var m=tutorMatch(text);
      if(m){a=m.a;tutorLog(text,true);}
      else if(/analis|minha tela|o que faco|o que eu faco|perdid|travei|travado|socorro|me ajuda|ajuda|e agora|nao sei o que/.test(nrm(text)))a=tutorDiagnose();
      else{a='Ainda não sei responder essa. Já anotei a sua dúvida para o professor ver e melhorar o curso. Enquanto isso, veja se uma destas ajuda:';tutorLog(text,false);}
    }
    TQ.msgs.push({u:false,t:a});TQ.busy=false;tutorPaint();
    if(S.voice&&a.length<260&&a.indexOf('\n')<0)speakMentor(a);
  },fromChip?350:650);
}
function tutorPaint(){
  var w=document.getElementById('tutor');if(!w)return;

  var log=w.querySelector('.tlog');
  log.innerHTML=TQ.msgs.map(function(m){return '<div class="tm '+(m.u?'u':'t')+'"><span></span></div>';}).join('')+(TQ.busy?'<div class="tm t"><span class="dots"><i></i><i></i><i></i></span></div>':'');
  var sp=log.querySelectorAll('.tm span:not(.dots)');TQ.msgs.forEach(function(m,i){sp[i].textContent=m.t;});
  var ch=w.querySelector('.tchips');
  ch.innerHTML=TQ.busy?'':tutorChips().map(function(it,i){return '<button type="button" data-ti="'+i+'">'+esc(it.q)+'</button>';}).join('');
  var list=tutorChips();
  ch.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){var it=list[+b.dataset.ti];tutorAnswer(it.q,it,true);});});
  log.scrollTop=log.scrollHeight;
}

var actx=null;
function audio(){

function noiseBuf(c,dur){var n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);return b;}
function sndWhoosh(){
  var c=audio();if(!c)return;var t=c.currentTime,o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(900,t+.22);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.025,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.24);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.25);
}
function sndPop(){
  var c=audio();if(!c)return;var t=c.currentTime;
  var s1=c.createBufferSource();s1.buffer=noiseBuf(c,.18);
  var f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
  var g=c.createGain();g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
  s1.connect(f);f.connect(g);g.connect(c.destination);s1.start(t);
  for(var i=0;i<5;i++){
    var tt=t+.12+Math.random()*.45,s2=c.createBufferSource();s2.buffer=noiseBuf(c,.025);
    var h=c.createBiquadFilter();h.type='highpass';h.frequency.value=2500;
    var g2=c.createGain();g2.gain.value=.012;s2.connect(h);h.connect(g2);g2.connect(c.destination);s2.start(tt);
  }
}
function fireworks(bursts){
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce)bursts=Math.min(bursts,2);
  var cv=null,ctx=null,W=0,H=0,parts=[],raf=0,end=0;
  {
    cv=document.createElement('canvas');cv.setAttribute('aria-hidden','true');
    cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:72;pointer-events:none';
    var dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx=cv.getContext('2d');ctx.scale(dpr,dpr);document.body.appendChild(cv);
  }
  var cols=['#e8761a','#0b7a3b','#5b4ee8','#f5b83d','#ff6d5a'];
  function explode(){
    sndPop();
    if(!ctx)return;
    var x=W*(.2+Math.random()*.6),y=H*(.14+Math.random()*.3),col=cols[Math.floor(Math.random()*cols.length)];
    for(var i=0;i<34;i++){var a=Math.PI*2*i/34+Math.random()*.2,sp=1.6+Math.random()*3.2;
      parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0,max:55+Math.random()*30,c:col});}
  }
  for(var b=0;b<bursts;b++){(function(k){
    setTimeout(function(){sndWhoosh();setTimeout(explode,230);},k*520);
  })(b);}
  if(!ctx)return;
  end=performance.now()+bursts*520+2200;
  (function loop(){
    ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';
    parts=parts.filter(function(p){return p.life<p.max;});
    parts.forEach(function(p){
      p.life++;p.vx*=.985;p.vy=p.vy*.985+.045;p.x+=p.vx;p.y+=p.vy;
      ctx.globalAlpha=Math.max(0,1-p.life/p.max);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;
    if(performance.now()<end||parts.length)raf=requestAnimationFrame(loop);else cv.remove();
  })();
}

function m21Send(){

    if(w.method==='POST'&&w.path.trim()==='pedido')pulse('#wListen');else pulse(w.method!=='POST'?'#wMethod':'#wPath');
    return;
  }
  if(w.method!=='POST'){
    w.resp={c:404,m:'This webhook is not registered for POST requests. Did you mean to make a GET request?'};route();

    flagInputs('#wMethod',function(){return true;});pulse('#wMethod');return;
  }
  if(w.path.trim()!=='pedido'){
    w.resp={c:404,m:'The requested webhook "POST '+w.path.trim()+'" is not registered.'};route();

}
function runStep21(){
  var e=V.cur,f=e.fields,kind='good',cf=null;
  e.ran=true;e.good=false;e.snap=computeOut(e);
  if(!f.length)kind='nofield';
  else if(f.some(function(x){return String(x.n).trim()==='';}))kind='noname';
  else{
    cf=f.filter(function(x){return x.n==='cliente';})[0];
    if(!cf)kind=f.some(function(x){return x.n.trim().toLowerCase()==='cliente';})?'case':'other';
    else if(!String(cf.v).trim())kind='novalue';
    else{var r=evalVal(cf.v,e.data);if(!r.expr)kind='literal';else if(r.undef)kind='undef';else if(r.text!=='Carla Dias')kind='wrongval';}
  }
  if(kind==='good'){e.good=true;e.done.t=true;}
  route();
  if(kind==='nofield'){oops('Rodou, mas o Edit Fields ainda não tem nenhum campo, então o Output saiu vazio. Clique em "Add Field".');pulse('#addField');}
  else if(kind==='noname'){oops('Seu campo está sem nome. O quadro de cima é o NOME do campo. Escreva cliente lá.');flagInputs('.f-name',function(x){return !x.value.trim();});bubbleBtn('Preencher para mim','fill21');}
  else if(kind==='case'){oops('O n8n diferencia maiúscula de minúscula: use tudo minúsculo, cliente.');flagInputs('.f-name',function(x){return x.value!=='cliente';});bubbleBtn('Preencher para mim','fill21');}
  else if(kind==='other'){oops('Funcionou, mas para eu conferir a missão o nome do campo precisa ser exatamente cliente. Troque e execute de novo.');flagInputs('.f-name',function(x){return x.value!=='cliente';});bubbleBtn('Preencher para mim','fill21');}
  else if(kind==='novalue'){oops('O campo tem nome, mas o valor está vazio. Escreva {{ $json.body.cliente }} no quadro do VALOR.');flagInputs('.f-val',function(x){return !x.value.trim();});bubbleBtn('Preencher para mim','fill21');}
  else if(kind==='literal'){oops('Você digitou o nome na mão. A ideia é o n8n buscar sozinho: escreva {{ $json.body.cliente }}, ou clique em "cliente" dentro de body, na esquerda.');flagInputs('.f-val',function(x){return true;});bubbleBtn('Preencher para mim','fill21');}
  else if(kind==='undef'){oops('O resultado veio [undefined]: o n8n não achou esse caminho. O cliente não está solto, ele está dentro da caixa "body". Leia de fora para dentro: {{ $json.body.cliente }}.');flagInputs('.f-val',function(x){return true;});bubbleBtn('Preencher para mim','fill21');}
  else if(kind==='wrongval'){oops('Esse caminho existe, mas não é o do cliente. Use {{ $json.body.cliente }}.');flagInputs('.f-val',function(x){return true;});bubbleBtn('Preencher para mim','fill21');}
  else{say('Funcionou! O campo cliente trouxe Carla Dias, lido de dentro de body. É o mesmo caminho com ponto do Mundo 1, agora em um pedido que veio de fora. Clique em "Concluir a missão".','good','cheer');bubbleBtn('Concluir a missão','finish21');pulse('.bubble .pri');}
}

function m2ExecHttp(M){
  var c=M.cfg,st=M.st,item=inp2(M),raw=c.url.trim(),r=evalVal(raw,item),u=r.text;
  st.ran=true;st.err=null;st.res=null;st.good=false;st.fixed=false;st.node='http';st.ov='schema';
  if(!raw)st.err={k:'nourl',m:'The parameter "URL" is required.'};
  else if(!/^https?:\/\//i.test(u))st.err={k:'scheme',m:'Invalid URL: "'+u+'" - falta o https:// no começo.'};
  else if(!/^https:\/\/viacep\.com\.br\//i.test(u))st.err={k:'host',m:'The service refused the connection (ENOTFOUND). Esse endereço não existe: confira se escreveu viacep.com.br certinho.'};
  else if(c.method!=='GET')st.err={k:'method',m:'405 - Method Not Allowed. O ViaCEP só responde ao método GET.'};
  else{
    var m=u.match(/^https:\/\/viacep\.com\.br\/ws\/(\d*)\/json\/?$/i);
    if(!m)st.err={k:'path',m:'400 - Bad Request. O endereço precisa ser https://viacep.com.br/ws/CEP/json/ (repare no /json/ no final).'};
    else if(m[1].length!==8)st.err={k:r.undef?'undef':'cep',m:'400 - Bad Request. O CEP veio vazio ou incompleto: '+(r.undef?'o n8n não achou o caminho da expressão.':'"'+m[1]+'" não tem 8 números.')};
    else if(m[1]!=='40010000')st.err={k:'cep',m:'Esse CEP não é o do pedido de Carla Dias.'};
    else{st.res=cepOut();st.fixed=!r.expr;st.good=!st.fixed&&raw.indexOf('$json.body.cep')>=0;}
  }
}

function m3ExecHttp(M){

  else if(!/^https:\/\/viacep\.com\.br\//i.test(u))st.err={k:'host',m:'ENOTFOUND. Esse endereço não existe: confira se escreveu viacep.com.br certinho.'};

function m4Sugs(M){
  var m=M.mis,h=m4Has(M);
  if(m==='41')return ['Qual o endereço do CEP 40010000?'];
  if(h.parser)return ['Pedido de Bruno Lima, R$ 800, pago'];
  return ['Oi, meu nome é Bruno','Qual é o meu nome?'];
}
function m4Intro(M){return M.chat.slice(0).some(function(x,i){return x.me&&/meu nome/i.test(x.t)&&(M.subs.mem?M.chat.filter(function(y){return y.me;}).indexOf(x)>=M.memFrom:true);});}
function m4ChatHTML(){
  var M=V.m4;if(!m4ChatOn(M))return '';
  var ready=!!M.subs.model,ms='';
  if(!M.chat.length)ms='<div class="m4m bot"><div class="m4av">'+IC.bot+'</div><div class="m4tx">'+(ready?'Oi! Eu sou o atendente virtual da loja. Escolha uma mensagem abaixo para conversar comigo.':'O chat só funciona depois que o AI Agent tem um Chat Model.')+'</div></div>';
  ms+=M.chat.map(function(x){
    if(x.me)return '<div class="m4m me">'+esc(x.t)+'</div>';
    return '<div class="m4m bot"><div class="m4av">'+IC.bot+'</div><div><div class="m4tx">'+(x.json?'<pre class="js">'+esc(x.t)+'</pre>':esc(x.t))+'</div>'+(x.steps?'<div class="m4st">'+x.steps.map(function(s){return '<span>'+esc(s)+'</span>';}).join('<i>&rsaquo;</i>')+'</div>':'')+'</div></div>';
  }).join('');
  if(M.typing)ms+='<div class="m4m bot"><div class="m4av">'+IC.bot+'</div><div class="m4tx m4dots"><i></i><i></i><i></i></div></div>';
  var sg='';
  if(ready){var L=m4Sugs(M),d0=L.length<2||m4Intro(M);
    sg='<div class="m4sg">'+L.map(function(x,i){var dis=M.typing||(i===1&&!d0);var dn=(L.length>1&&i===0&&d0);return '<button type="button" class="gchip m4chip'+(dn?' done':'')+'" data-m4sug="'+esc(x)+'"'+(dis?' disabled':'')+'>'+(L.length>1?'<b>'+(dn?'&#10003;':(i+1))+'</b>':'')+esc(x)+'</button>';}).join('')+'</div>';}
  return '<div class="m4chat" id="m4Chat"><div class="lh"><span><b>Chat de teste</b> com o agente</span><span class="mut">'+(ready?'escolha uma mensagem ou escreva a sua':'')+'</span></div><div class="m4msgs" id="m4Msgs">'+ms+'</div>'+(ready?sg+'<form class="m4in" id="m4Form"><input id="m4In" autocomplete="off" maxlength="120" placeholder="Escreva uma mensagem..." aria-label="Mensagem do chat"'+(M.typing?' disabled':'')+'><button class="btn" type="submit" id="m4Send"'+(M.typing?' disabled':'')+'>Enviar</button></form>':'')+'</div>';
}
function m4Reply(M,t){
  var h=m4Has(M),l=t.toLowerCase(),cep=t.match(/(\d{5})-?(\d{3})/),r;
  var mine=M.chat.filter(function(x){return x.me;}).map(function(x){return x.t;});
  if(h.parser){
    var nm=t.match(/de ([A-ZÁÉÍÓÚÂÊÔÃÕÇ][\wÀ-ú]+(?: [A-ZÁÉÍÓÚÂÊÔÃÕÇ][\wÀ-ú]+)?)/),cl=nm?nm[1]:'Bruno Lima';
    return {t:JSON.stringify({cliente:cl,mensagem:'Olá, '+cl+'! Recebemos o seu pedido e já estamos cuidando dele. Obrigado pela compra!'},null,2),json:true,steps:['AI Agent','Chat Model','Output Parser'],fmt:true};
  }
  if(cep){
    var d=cep[1]+cep[2];
    if(h.tool){var a=ADDR3[d];return a?{t:'O CEP '+a.cep+' fica na '+a.logradouro+', bairro '+a.bairro+', em '+a.localidade+'/'+a.uf+'.',steps:['AI Agent','Chat Model','Tool: buscar_cep','Resposta'],tool:true}:{t:'Consultei o CEP '+cep[1]+'-'+cep[2]+', mas ele não existe na base. Confira os números.',steps:['AI Agent','Chat Model','Tool: buscar_cep','Resposta']};}
    return {t:'Não consigo consultar CEPs: não tenho acesso a nenhum serviço de endereços. Se você me disser a rua e a cidade, eu ajudo de outra forma.',steps:['AI Agent','Chat Model','Resposta'],notool:true};
  }
  var intro=t.match(/meu nome (?:é|e) ([A-Za-zÀ-ú]+)/i);
  if(intro)return {t:'Oi, '+intro[1]+'! Em que posso ajudar?',steps:h.mem?['AI Agent','Chat Model','Simple Memory','Resposta']:['AI Agent','Chat Model','Resposta'],intro:true};
  if(/qual (?:é|e) o meu nome|meu nome\?|sabe meu nome|lembra/.test(l)){
    var found=null;if(h.mem)mine.slice(M.memFrom).forEach(function(x){var q=x.match(/meu nome (?:é|e) ([A-Za-zÀ-ú]+)/i);if(q)found=q[1];});
    if(found)return {t:'Seu nome é '+found+', você me contou agora há pouco.',steps:['AI Agent','Chat Model','Simple Memory','Resposta'],remembered:true};
    return {t:'Ainda não sei o seu nome. Pode me contar?',steps:h.mem?['AI Agent','Chat Model','Simple Memory','Resposta']:['AI Agent','Chat Model','Resposta'],forgot:!h.mem,nomem:h.mem};
  }
  return {t:'Olá! Eu sou o atendente virtual da loja. Posso ajudar com pedidos'+(h.tool?' e endereços':'')+'.',steps:['AI Agent','Chat Model','Resposta']};
}
function m4Send(t){
  var M=V.m4;t=String(t||'').trim();if(!t||!M.subs.model||M.typing)return;
  M.chat.push({me:true,t:t});M.typing=true;route();
  var box=document.getElementById('m4Msgs');if(box)box.scrollTop=box.scrollHeight;
  setTimeout(function(){
    if(V.view!=='m4'||V.m4!==M)return;
    M.typing=false;var r=m4Reply(M,t);M.chat.push(r);
    if(r.notool)M.fl.c1=true;if(r.tool)M.fl.tool=true;if(r.forgot)M.fl.forgot=true;if(r.remembered)M.fl.rem=true;if(r.fmt)M.fl.fmt=true;if(r.intro&&M.subs.mem)M.fl.intro=true;
    route();
    var b2=document.getElementById('m4Msgs');if(b2)b2.scrollTop=b2.scrollHeight;
    m4AfterChat(M,r);
  },700);
}
function m4AfterChat(M,r){
  var m=M.mis;
  if(m==='41'){
    if(r.notool)say('Veja só: o agente conversou, mas respondeu que não consegue consultar CEPs. Ele só tem o cérebro, nenhuma ferramenta. É como contratar alguém inteligente e não dar acesso a nada. Apareceu um + Tool embaixo do AI Agent. Clique nele.','good','think');
    else if(r.tool){say('Funcionou! Repare nos passos embaixo da resposta: o agente decidiu sozinho usar a ferramenta buscar_cep, que é o seu sub-workflow da Missão 3.3. Ninguém mandou ele fazer isso. Clique em "Concluir a missão".','good','cheer');bubbleBtn('Concluir a missão','m4fin');pulse('.bubble .acts .pri');}
    else if(!M.subs.tool)note('O agente respondeu, mas hoje queremos ver ele lidar com um CEP. Use o botão com a pergunta do CEP.');
    else note('Para o agente usar a ferramenta, a pergunta precisa ter um CEP com 8 números, como 40010000.');
    return;
  }
  if(r.forgot){say('Viu? Acabei de me apresentar e, na mensagem seguinte, o agente já esqueceu o meu nome. Sem memória, cada mensagem é uma conversa nova. Embaixo do AI Agent há um + Memory. Clique nele.','good','think');pulse('#m4s-mem');return;}
  if(r.nomem){note('A memória só guarda as mensagens depois que ela foi ligada. Mande de novo: "Oi, meu nome é Bruno" e depois "Qual é o meu nome?".');return;}
  if(r.remembered){say('Agora ele lembrou do meu nome! A Simple Memory devolveu a conversa ao agente a cada mensagem. Só falta uma coisa: hoje o agente responde com texto livre, e o próximo node não sabe pegar um pedaço dele. Clique em "Continuar: resposta em formato fixo".','good','cheer');bubbleBtn('Continuar: resposta em formato fixo','m4fmt');pulse('.bubble .acts .pri');return;}
  if(r.intro&&M.subs.mem){note('Anotado pela memória. Agora pergunte: "Qual é o meu nome?".');return;}
  if(r.fmt){say('Olha só: em vez de texto solto, o agente respondeu com campos fixos, cliente e mensagem. Agora o próximo node consegue pegar cada um com {{ $json.output.mensagem }}, como em qualquer outro dado do n8n. Clique em "Concluir a missão".','good','cheer');bubbleBtn('Concluir a missão','m4fin');pulse('.bubble .acts .pri');return;}
}

function m4ExecTool(M){
  var c=M.cfg,st=M.sts.tool={ran:true,err:null,good:false,alt:null};
  if(!c.tname.trim())st.err={m:'The parameter "Name" is required.'};
  else if(!/^[A-Za-z0-9_-]+$/.test(c.tname.trim()))st.err={m:'O Name aceita só letras, números e _ (sem espaços). Exemplo: buscar_cep.'};
  else if(c.tdesc.trim().length<15)st.err={m:'A Description está curta demais: o agente lê ela para decidir quando usar a ferramenta.'};
  else if(!c.twf)st.err={m:'The parameter "Workflow" is required.'};
  else if(c.twf==='avisar')st.alt={enviado:true,obs:'Esse workflow só manda alertas.'};
  else if(c.twf==='frete')st.alt={frete:0,obs:'Esse workflow só calcula frete.'};
  else st.good=true;

function m4OpenNode(id,sub){
  var M=V.m4,type,ck;
  if(sub){var sb=M.subs[id];if(!sb)return;type=id;ck=sb.ck&&!(M.sts[id]&&!M.sts[id].good&&false);}
  else{var n=m4Node(M,id);if(!n)return;type=n.type;ck=n.ck;}
  if(ck&&type!=='agent'){note('Esse node já está pronto desde a missão anterior. Abra o que você acabou de ligar.');return;}
  var go=function(){M.open=type;V.nv=true;V.cur=null;route();};
  if(!FSEEN[type]&&type!=='if'){FSEEN[type]=1;showFicha(type,go);}else go();
}
function m4Pick(id){
  var M=V.m4,d=M.drawer,e=m4Expect(M),opt=OPT4[d].filter(function(x){return x.id===id;})[0];if(!opt)return;
  if(!e||e.w!==d){M.panel=false;route();return;}
  if(d==='model'&&['oai','gem','ant'].indexOf(id)>=0){/* qualquer Chat Model serve */}
  else if(id!==e.id){oops(d==='main'?'Esse node é bom, mas hoje não é o que a missão pede. Escolha "'+OPT4.main.filter(function(x){return x.id===e.id;})[0].t+'".':'Esse sub-node existe, mas hoje queremos outro: escolha "'+OPT4[d].filter(function(x){return x.id===e.id;})[0].t+'".'+(d==='tool'?' Queremos reaproveitar o Buscar CEP que você criou na Missão 3.3.':''));return;}
  if(e.gate){note(e.gate);M.panel=false;route();return;}
  M.panel=false;
  if(d==='main'){m4Add(M,id);route();var go=function(){M.open=id;V.nv=true;route();};if(!FSEEN[id]){FSEEN[id]=1;note('Ligado! Antes de abrir, uma ficha rápida sobre este node.');showFicha(id,go);}else go();return;}
  M.subs[d]={name:opt.t,mdl:opt.mdl,ck:false};
  if(d==='mem'){M.memFrom=M.chat.filter(function(x){return x.me;}).length;M.fl.intro=false;}
  route();note('Conectado! Uma ficha rápida sobre este sub-node.');
  var go2=function(){M.open=d;V.nv=true;route();};
  if(d==='model'&&M.sts.agent){M.sts.agent={ran:true,good:true,err:null,out:{output:'Olá! Eu sou o atendente virtual da loja. Como posso ajudar?'}};}
  if(!FSEEN[d]){FSEEN[d]=1;showFicha(d,go2);}else go2();
}

function gFmt(iso){if(!iso)return '—';var a=iso.split('-');return a[2]+'/'+a[1]+'/'+a[0];}
function gFmtTs(ts){if(!ts)return '—';var d=new Date(ts);return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();}
function gAddM(iso,n){var d=new Date(gMs(iso||gToday()));d.setDate(1);var a=(iso||gToday()).split('-'),day=+a[2];d=new Date(+a[0],+a[1]-1+n,1,12);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function gDays(a,b){return Math.round((gMs(b)-gMs(a))/864e5);}
function gMoney(v){return (+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
var GCYC={unico:'Pagamento único',mensal:'Mensal',trimestral:'Trimestral',anual:'Anual'},GCYN={mensal:1,trimestral:3,anual:12};
/* metas */
function gMeta(r){
  var s=r.s||{},p=r.p,pct=gPct(p),days=(GD.pcfg&&+GD.pcfg.days)||30,start=s.createdAt||0;
  var until=(s.meta&&s.meta.until)?gMs(s.meta.until):(start?start+days*864e5:0);
  if(p&&p.cert)return {st:'done',lab:'Concluída',cls:'o',pct:pct,exp:100,until:until};
  if(!r.reg||!start||!until)return {st:'none',lab:'Sem prazo',cls:'n',pct:pct,exp:0,until:until};
  var exp=Math.max(0,Math.min(1,(Date.now()-start)/Math.max(1,until-start)))*100;
  if(Date.now()>until)return {st:'late',lab:'Prazo vencido',cls:'b',pct:pct,exp:Math.round(exp),until:until};
  if(pct+10<exp)return {st:'behind',lab:'Abaixo do esperado',cls:'w',pct:pct,exp:Math.round(exp),until:until};
  return {st:'ok',lab:'No ritmo',cls:'o',pct:pct,exp:Math.round(exp),until:until};
}
function gMarcos(p){return [['M1','q1'],['M2','q2'],['M3','q3'],['M4','q4'],['Cert.','cert']].map(function(m){return '<i class="gmk'+(p&&p[m[1]]?' on':'')+'" title="'+(m[0]==='Cert.'?'Certificado':'Mundo '+m[0].slice(1))+(p&&p[m[1]]?' concluído':' pendente')+'">'+m[0]+'</i>';}).join('');}
function gProg(p){
  var st=gSteps(p),pc=gPct(p);
  return '<div class="gpg"><div class="gpgb"><i style="width:'+pc+'%"></i></div><b>'+pc+'%</b></div><div class="gpw">'+GWLD.map(function(w){return '<span title="'+w[0]+'">'+st.slice(w[2],w[3]).map(function(x,i){return '<i class="'+(x?'on':'')+'" title="'+GMIS[w[2]+i][0]+'"></i>';}).join('')+'</span>';}).join('')+'</div><small>'+esc(gWhere(p))+'</small>';
}
/* pagamentos */
function gPayOf(id){return GD.pay[id]||null;}
function gPaid(pay){return ((pay&&pay.hist)||[]).reduce(function(a,h){return a+(+h.amt||0);},0);}
function gPayStat(pay){
  if(!pay)return {k:'sem',lab:'Sem cobrança',cls:'n',open:0};
  if(pay.exempt)return {k:'iso',lab:'Cortesia',cls:'r',open:0};
  var amt=+pay.amount||0;if(!amt)return {k:'sem',lab:'Sem cobrança',cls:'n',open:0};
  var paid=gPaid(pay),t=gToday(),due=pay.due||'',hs=(pay.hist||[]).length;
  if(pay.cycle==='unico'&&paid>=amt)return {k:'pago',lab:'Pago',cls:'o',open:0};
  var open=pay.cycle==='unico'?Math.max(0,amt-paid):amt;
  if(due&&t>due)return {k:'atr',lab:'Em atraso '+gDays(due,t)+' d',cls:'b',open:open,late:gDays(due,t)};
  if(!hs)return {k:'pend',lab:'Pendente',cls:'w',open:open};
  if(due&&gDays(t,due)<=5)return {k:'vence',lab:'Vence em breve',cls:'w',open:open};
  return {k:'ok',lab:'Em dia',cls:'o',open:0};
}
function gPillPay(r){var s=gPayStat(gPayOf(r.id));return '<span class="gp-pill '+s.cls+'">'+s.lab+'</span>';}
function gModal(title,body,okLabel,onOk,wide){
  var old=document.getElementById('gpm2');if(old)old.remove();
  var m=document.createElement('div');m.id='gpm2';m.className='gpmod';
  m.innerHTML='<div class="gpc'+(wide?' wide':'')+'"><h3></h3><div class="gbd">'+body+'</div><div class="gmb"><button type="button" class="gb" id="gm2c">'+(onOk?'Cancelar':'Fechar')+'</button>'+(onOk?'<button type="button" class="gb pri" id="gm2o">'+okLabel+'</button>':'')+'</div></div>';
  m.querySelector('h3').textContent=title;document.body.appendChild(m);
  m.querySelector('#gm2c').addEventListener('click',function(){m.remove();document.body.classList.remove('gprn');});
  if(onOk)m.querySelector('#gm2o').addEventListener('click',function(){
    var b=this,er=m.querySelector('.gerr');if(er)er.remove();
    var r=null;try{r=onOk(m);}catch(e){r='Não foi possível salvar.';}

    b.disabled=true;Promise.resolve(r).then(function(){m.remove();}).catch(function(){b.disabled=false;var em=document.createElement('p');em.className='gpm warn gerr';em.textContent='Não foi possível salvar agora.';m.querySelector('.gmb').before(em);});
  });
  return m;
}
function gCsv(name,rows){
  var t='﻿'+rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return '"'+c.replace(/"/g,'""')+'"';}).join(';');}).join('\r\n');
  var b=new Blob([t],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(a.href);},500);

function gPcfg(mod){var c=Object.assign({plans:[],pix:'',wmsg:'',days:30},GD.pcfg||{});c.plans=(c.plans||[]).slice();mod(c);GD.pcfg=c;return CL.db.doc('config/pay').set(c);}
/* Visão geral */
function gAtencao(rows){
  var out=[];
  rows.forEach(function(r){
    if(!r.reg)return;var why=[];
    if(r.blocked)return;
    if(r.last&&Date.now()-r.last>3*864e5&&!(r.p&&r.p.cert))why.push('parado há '+Math.round((Date.now()-r.last)/864e5)+' dias');
    var m=gMeta(r);if(m.st==='late')why.push('prazo vencido');else if(m.st==='behind')why.push('abaixo do ritmo da meta');
    var ps=gPayStat(gPayOf(r.id));if(ps.k==='atr')why.push('pagamento em atraso');
    if(gErrs(r.p)>=15)why.push('muitas dificuldades ('+gErrs(r.p)+' avisos)');
    if(why.length)out.push({r:r,why:why});
  });
  return out;
}
function gGeral(rows){
  var n=rows.length,reg=rows.filter(function(r){return r.reg;}),week=rows.filter(function(r){return r.last&&Date.now()-r.last<7*864e5;}).length;
  var blk=rows.filter(function(r){return r.blocked;}).length,cert=rows.filter(function(r){return r.p&&r.p.cert;}).length;
  var avg=n?Math.round(rows.reduce(function(a,r){return a+gPct(r.p);},0)/n):0;
  var xp=n?Math.round(rows.reduce(function(a,r){return a+((r.p&&r.p.xp)||0);},0)/n):0;
  var late=reg.filter(function(r){var s=gMeta(r).st;return s==='late'||s==='behind';}).length;
  var atr=reg.filter(function(r){return gPayStat(gPayOf(r.id)).k==='atr';}).length;
  var k=function(v,l,c){return '<div class="gk '+(c||'')+'"><b>'+v+'</b><span>'+l+'</span></div>';};
  var h='<div class="gks">'+k(n,'alunos com atividade')+k(week,'ativos nos últimos 7 dias','ok')+k(avg+'%','progresso médio no curso')+k(cert,'certificados emitidos','ok')+k(xp,'XP médio')+k(late,'metas em risco',late?'warn':'')+k(atr,'pagamentos em atraso',atr?'bad':'')+k(blk,'bloqueados',blk?'bad':'')+k(rows.filter(function(r){return !r.reg;}).length,'ainda sem cadastro',rows.some(function(r){return !r.reg;})?'warn':'')+'</div>';
  var f=[['Entraram',n]].concat(GWLD.map(function(w){return [w[0]+' concluído',rows.filter(function(r){return r.p&&r.p[w[4]];}).length];})).concat([['Certificado',cert]]);
  h+='<div class="gcard"><h3>Funil do curso</h3>'+f.map(function(x){var pc=n?Math.round(x[1]/n*100):0;return '<div class="gbar"><span>'+x[0]+'</span><div><i style="width:'+pc+'%"></i></div><em>'+x[1]+' ('+pc+'%)</em></div>';}).join('')+'</div>';
  var at=gAtencao(rows);
  h+='<div class="gcard"><h3>Precisam de atenção</h3>'+(at.length?at.map(function(o){return '<div class="gli"><span>'+gNm(o.r,'Aluno')+' <em>'+esc(o.why.join(' · '))+'</em></span><span><button type="button" class="gb" data-ga="rep" data-id="'+esc(o.r.id)+'">Relatório</button></span></div>';}).join(''):'<p class="gpm">Ninguém precisando de atenção agora: sem alunos parados, sem prazo vencido e sem pagamento em atraso.</p>')+'</div>';
  var er=gErrAll(rows),mx=Math.max.apply(null,[1].concat(er.map(function(x){return x[1];})));
  h+='<div class="gcard"><h3>Onde os alunos mais erram</h3>'+(er.length?er.slice(0,6).map(function(x){return '<div class="gbar"><span>Missão '+x[0]+'</span><div><i class="e" style="width:'+Math.round(x[1]/mx*100)+'%"></i></div><em>'+x[1]+' avisos do mentor</em></div>';}).join('')+'<p class="gpm">Cada aviso do mentor conta como uma dificuldade. A missão com mais avisos é a que talvez precise de mais explicação.</p>':'<p class="gpm">Ainda sem avisos registrados.</p>')+'</div>';
  var rd=rows.filter(gReady);
  h+='<div class="gcard"><h3>Prontos para o Mundo 2</h3>'+(rd.length?rd.map(function(r){return '<div class="gready">'+gNm(r,'Aluno')+'<span><em>concluiu o Mundo 1</em> <button type="button" class="gb pri" data-ga="rel2" data-id="'+esc(r.id)+'">Liberar Mundo 2</button></span></div>';}).join(''):'<p class="gpm">Ninguém esperando. Quando um aluno concluir o Mundo 1, ele aparece aqui para você liberar o Mundo 2. Os Mundos 3 e 4 abrem sozinhos quando o aluno passa no quiz do mundo anterior.</p>')+'</div>';
  var st=rows.filter(function(r){return r.reg&&!r.blocked&&r.last&&Date.now()-r.last>3*864e5;});
  h+='<div class="gcard"><h3>Alunos parados (3 dias ou mais)</h3>'+(st.length?st.map(function(r){return '<div class="gli">'+gNm(r,'Aluno')+'<em>último acesso '+relT(r.last)+'</em></div>';}).join(''):'<p class="gpm">Ninguém parado no momento.</p>')+'</div>';
  if(!n)h+='<p class="gpm">Ainda não há alunos. Cadastre pessoas na aba "Adicionar aluno" e peça para abrirem o curso. O progresso delas aparece aqui sozinho.</p>';
  return h;
}
function gErrAll(rows){var er={};rows.forEach(function(r){if(r.p&&r.p.errs)Object.keys(r.p.errs).forEach(function(m){er[m]=(er[m]||0)+(+r.p.errs[m]||0);});});return Object.keys(er).filter(function(m){return er[m]>0;}).map(function(m){return [m,er[m]];}).sort(function(a,b){return b[1]-a[1];});}
function gReady(r){var pm=(GD.stu[r.id]&&GD.stu[r.id].perms)||{};return !!(r.reg&&!r.blocked&&r.p&&r.p.q1&&!pm.m2);}

  });

  reg.slice().sort(function(a,b){var o={late:0,behind:1,ok:2,none:3,done:4};return o[gMeta(a).st]-o[gMeta(b).st];}).forEach(function(r){

function gStuRep(r){
